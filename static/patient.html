<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>病患資料 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=100">
<style>
.pt-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;display:flex;align-items:flex-start;gap:18px;margin-bottom:20px}
.pt-av{width:52px;height:52px;border-radius:50%;background:var(--g0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--sub);flex-shrink:0;border:2px solid var(--border)}
.pt-info{flex:1;min-width:0}
.pt-name{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.pt-meta-row{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub)}
.pt-meta-item{display:flex;align-items:center;gap:5px}
.pt-meta-label{font-size:11.5px;color:var(--muted)}
.pt-chart{font-family:monospace;font-size:12px;color:var(--muted);margin-top:3px}

.pt-section{margin-bottom:20px}
.pt-section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0 2px}

.fu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fu-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:5px}
.fu-card-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:5px;display:inline-flex;align-items:center;width:fit-content;margin-bottom:3px}
.fu-card-disease{font-size:13px;font-weight:600;color:var(--text)}
.fu-card-detail{font-size:12px;color:var(--sub)}
.fu-card-overdue{font-size:12px;font-weight:600}
.fu-card-overdue.ok{color:#059669}
.fu-card-overdue.warn{color:#D97706}
.fu-card-overdue.late{color:#DC2626}

.cat-chronic{background:#DBEAFE;color:#1E40AF}
.cat-mspt{background:#EDE9FE;color:#5B21B6}
.cat-hep{background:#D1FAE5;color:#065F46}
.cat-meta{background:#FEF3C7;color:#92400E}
.cat-ckd{background:#FEE2E2;color:#991B1B}
.cat-default{background:var(--bg);color:var(--sub)}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) .cat-chronic{background:#1e3a5f;color:#93c5fd}
  :root:not([data-theme=light]) .cat-mspt{background:#2e1065;color:#c4b5fd}
  :root:not([data-theme=light]) .cat-hep{background:#052e16;color:#6ee7b7}
  :root:not([data-theme=light]) .cat-meta{background:#451a03;color:#fcd34d}
  :root:not([data-theme=light]) .cat-ckd{background:#450a0a;color:#fca5a5}
}
:root[data-theme=dark] .cat-chronic{background:#1e3a5f;color:#93c5fd}
:root[data-theme=dark] .cat-mspt{background:#2e1065;color:#c4b5fd}
:root[data-theme=dark] .cat-hep{background:#052e16;color:#6ee7b7}
:root[data-theme=dark] .cat-meta{background:#451a03;color:#fcd34d}
:root[data-theme=dark] .cat-ckd{background:#450a0a;color:#fca5a5}

.hist-list{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.hist-row{display:grid;grid-template-columns:100px 1fr auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:start}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:12px;color:var(--muted)}
.hist-time{font-size:11px;color:var(--muted)}
.hist-body{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hist-detail{font-size:12.5px;color:var(--sub);flex-basis:100%}
.hist-nurse{font-size:12px;color:var(--muted);white-space:nowrap}
.hist-chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.hist-cat{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.chip-contacted{background:#DBEAFE;color:#1D4ED8}
.chip-called{background:#FEF3C7;color:#92400E}
.chip-line{background:#D1FAE5;color:#065F46}
.chip-hold{background:#FEF9C3;color:#713F12}
.chip-excluded{background:#FEE2E2;color:#991B1B}
.chip-mspt_completed{background:#EDE9FE;color:#5B21B6}
.chip-checkedin{background:#CCFBF1;color:#0F766E}
.chip-hep_completed{background:#E0E7FF;color:#3730A3}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) .chip-contacted{background:#1e3a5f;color:#93c5fd}
  :root:not([data-theme=light]) .chip-called{background:#451a03;color:#fcd34d}
  :root:not([data-theme=light]) .chip-line{background:#052e16;color:#6ee7b7}
  :root:not([data-theme=light]) .chip-hold{background:#3b2000;color:#fde68a}
  :root:not([data-theme=light]) .chip-excluded{background:#450a0a;color:#fca5a5}
  :root:not([data-theme=light]) .chip-mspt_completed{background:#2e1065;color:#c4b5fd}
  :root:not([data-theme=light]) .chip-checkedin{background:#042f2e;color:#5eead4}
  :root:not([data-theme=light]) .chip-hep_completed{background:#1e1b4b;color:#a5b4fc}
}
:root[data-theme=dark] .chip-contacted{background:#1e3a5f;color:#93c5fd}
:root[data-theme=dark] .chip-called{background:#451a03;color:#fcd34d}
:root[data-theme=dark] .chip-line{background:#052e16;color:#6ee7b7}
:root[data-theme=dark] .chip-hold{background:#3b2000;color:#fde68a}
:root[data-theme=dark] .chip-excluded{background:#450a0a;color:#fca5a5}
:root[data-theme=dark] .chip-mspt_completed{background:#2e1065;color:#c4b5fd}
:root[data-theme=dark] .chip-checkedin{background:#042f2e;color:#5eead4}
:root[data-theme=dark] .chip-hep_completed{background:#1e1b4b;color:#a5b4fc}

.pt-loading{text-align:center;padding:60px;color:var(--muted)}
.pt-error{text-align:center;padding:60px;color:#991b1b}
.hist-empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

.back-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:16px;padding:6px 10px;border-radius:7px;transition:background .1s}
@media(hover:hover){.back-link:hover{background:var(--g0);color:var(--text)}}
.back-link svg{width:14px;height:14px}

.phone-copy{cursor:pointer;border-radius:3px;padding:1px 3px;transition:background .1s}
@media(hover:hover){.phone-copy:hover{background:var(--border)}}

/* 聯絡偏好 — what this patient asked not to receive */
.cp-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.cp-now{font-size:13.5px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-now b{font-weight:600}
.cp-now .cp-off{color:var(--danger,#c00)}
.cp-label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:-4px}
.cp-card .reason-chips{margin-bottom:0}
.cp-card .reason-chip:disabled{cursor:default;opacity:.7}
.cp-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cp-meta{font-size:12px;color:var(--muted)}
.chip-pref{background:var(--g0);color:var(--sub)}

/* 不聯絡名單 (page opened without a patient) */
.dnc-tbl td a{color:var(--text);font-weight:600;text-decoration:none}
@media(hover:hover){.dnc-tbl td a:hover{text-decoration:underline}}
.dnc-head{margin-bottom:20px}
.dnc-tbl .dnc-sub{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">
      <div id="pt-root"><div class="pt-loading">載入中…</div></div>
    </div>
  </div>
</div>

<script src="/static/_layout.js?v=94"></script>
<script src="/static/auth-client.js"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  L.init({ activePage: 'patient' });

  var root = document.getElementById('pt-root');

  var CAT_CLASS = {
    '慢簽': 'cat-chronic',
    '代謝症候群': 'cat-meta',
    'MSPT': 'cat-mspt',
    '肝炎': 'cat-hep',
  };

  var CHIP_LABELS = {
    contacted: '一次通知', called: '二次通知', line: 'LINE訊息',
    hold: '暫緩', excluded: '排除', mspt_completed: 'MSPT完成',
    checkedin: 'MSPT回診', hep_completed: '肝炎回診', pref: '聯絡偏好',
  };

  // Lists a patient can ask to stop; keys match the server's contact_prefs.SCOPES
  var SCOPES = [
    ['慢簽', '慢簽'], ['代謝症候群', 'MSPT'], ['B肝', 'B/C肝'], ['慢性腎臟病', 'CKD'],
    ['處方', '處方追蹤'], ['抽血', '抽血追蹤・檢驗通知'], ['群發', '群發訊息'],
  ];
  var _patient = null;          // profile being shown
  var _saved = null;            // preference as stored: {block_all, scopes, note}
  var _draft = null;            // preference being edited

  function prefState(pref) {
    return { block_all: !!(pref && pref.block_all), scopes: ((pref && pref.scopes) || []).slice(), note: (pref && pref.note) || '' };
  }
  function prefSummary(st) {
    if (st.block_all) return '全部不聯絡';
    if (!st.scopes.length) return '';
    return '不聯絡：' + SCOPES.filter(function (s) { return st.scopes.indexOf(s[0]) !== -1; })
      .map(function (s) { return s[1]; }).join('、');
  }
  function prefDirty() {
    return _draft.block_all !== _saved.block_all || _draft.note.trim() !== _saved.note.trim() ||
      _draft.scopes.slice().sort().join() !== _saved.scopes.slice().sort().join();
  }

  function prefHtml(p) {
    var pref = p.contact_pref;
    var summary = prefSummary(_saved);
    var meta = pref ? '上次修改 ' + pref.updated_at + (pref.nurse ? '・' + pref.nurse : '') : '';
    var scopeChips = SCOPES.map(function (s) {
      return '<button type="button" class="reason-chip" data-scope="' + L.escHtml(s[0]) + '">' + L.escHtml(s[1]) + '</button>';
    }).join('');
    return '<div class="pt-section"><div class="pt-section-title">聯絡偏好</div>' +
      '<div class="cp-card" id="cp-card">' +
        '<div class="cp-now">目前：' + (summary ? '<b class="cp-off">' + L.escHtml(summary) + '</b>' : '<b>可以聯絡</b>') + '</div>' +
        '<div class="cp-label">病患要求不要收到</div>' +
        '<div class="reason-chips"><button type="button" class="reason-chip" data-all="1">全部訊息（含群發）</button></div>' +
        '<div class="cp-label">或只停止這幾種</div>' +
        '<div class="reason-chips" id="cp-scopes">' + scopeChips + '</div>' +
        '<div><label class="modal-label" for="cp-note">原因／備註</label>' +
          '<textarea class="modal-input" id="cp-note" rows="2" placeholder="例：病患來電表示不需要處方提醒"></textarea></div>' +
        '<div class="cp-foot"><button class="bp" id="cp-save" disabled>儲存</button>' +
          '<span class="cp-meta" id="cp-meta">' + L.escHtml(meta) + '</span></div>' +
      '</div></div>';
  }

  function syncPrefUi() {
    var card = document.getElementById('cp-card'); if (!card) return;
    card.querySelector('[data-all]').classList.toggle('selected', _draft.block_all);
    card.querySelectorAll('[data-scope]').forEach(function (b) {
      b.classList.toggle('selected', _draft.block_all || _draft.scopes.indexOf(b.dataset.scope) !== -1);
      b.disabled = _draft.block_all;
    });
    document.getElementById('cp-save').disabled = !prefDirty();
  }

  function wirePref() {
    var card = document.getElementById('cp-card');
    document.getElementById('cp-note').value = _draft.note;
    card.addEventListener('click', function (ev) {
      var chip = ev.target.closest('.reason-chip'); if (!chip || chip.disabled) return;
      if (chip.dataset.all) {
        _draft.block_all = !_draft.block_all;
      } else {
        var k = chip.dataset.scope, i = _draft.scopes.indexOf(k);
        if (i === -1) _draft.scopes.push(k); else _draft.scopes.splice(i, 1);
      }
      syncPrefUi();
    });
    document.getElementById('cp-note').addEventListener('input', function (ev) {
      _draft.note = ev.target.value; syncPrefUi();
    });
    document.getElementById('cp-save').addEventListener('click', function () {
      var btn = this; btn.disabled = true;
      L.apiAction('PUT', '/api/contact-prefs/' + encodeURIComponent(_patient.chart_number), {
        name: _patient.name || '', block_all: _draft.block_all,
        scopes: _draft.block_all ? [] : _draft.scopes, note: _draft.note, nurse: L.getNurse() || '',
      }).then(function (res) {
        _patient.contact_pref = res.pref;
        _patient.contact_pref_log = res.log || [];
        var sum = prefSummary(prefState(res.pref));
        L.showToast('已儲存：' + (sum || '恢復聯絡'));
        render(_patient);
      }).catch(function (e) {
        L.showToast('儲存失敗：' + (e.message || '請稍後再試'), 'error');
        btn.disabled = false;
      });
    });
    syncPrefUi();
  }

  function rocDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length !== 3) return iso;
    return (parseInt(p[0], 10) - 1911) + '/' + p[1] + '/' + p[2];
  }

  function overdueCls(d) {
    if (d == null) return '';
    if (d < 0) return 'ok';
    if (d <= 7) return 'warn';
    return 'late';
  }

  function overdueText(d, dueDate) {
    if (d == null) return '';
    if (d < 0) return '提前 ' + Math.abs(d) + ' 天';
    if (d === 0) return '今日到期（' + dueDate + '）';
    return '逾期 ' + d + ' 天（' + dueDate + '）';
  }

  function render(p) {
    _patient = p;
    _saved = prefState(p.contact_pref);
    _draft = prefState(p.contact_pref);
    var initials = (p.name || '?').slice(0, 1);
    var dobDisplay = rocDate(p.birth_date);
    var phone = p.phone || '';
    var mobile = p.mobile || '';

    var metaItems = [];
    if (dobDisplay) metaItems.push(
      '<span class="pt-meta-item"><span class="pt-meta-label">生日</span>' + L.escHtml(dobDisplay) + '</span>'
    );
    if (phone) metaItems.push(
      '<span class="pt-meta-item"><span class="pt-meta-label">電話</span>' +
      '<span class="phone-copy pr-copy" data-copy="' + L.escHtml(phone) + '" title="點擊複製">' + L.escHtml(phone) + '</span></span>'
    );
    if (mobile) metaItems.push(
      '<span class="pt-meta-item"><span class="pt-meta-label">手機</span>' +
      '<span class="phone-copy pr-copy" data-copy="' + L.escHtml(mobile) + '" title="點擊複製">' + L.escHtml(mobile) + '</span></span>'
    );

    var fuCards = (p.followups || []).map(function (f) {
      var cls = CAT_CLASS[f.category] || 'cat-default';
      var details = [];
      if (f.disease_name) details.push(f.disease_name);
      if (f.mspt_stage) details.push('階段 ' + f.mspt_stage);
      if (f.contact_reason) details.push(f.contact_reason);
      if (f.last_visit_date) details.push('最後就診 ' + f.last_visit_date);
      var od = f.days_overdue;
      var odText = overdueText(od, f.due_date);
      var odCls = overdueCls(od);
      return '<div class="fu-card">' +
        '<span class="fu-card-cat ' + L.escHtml(cls) + '">' + L.escHtml(f.category) + '</span>' +
        (details.length ? '<div class="fu-card-disease">' + L.escHtml(details[0]) + '</div>' : '') +
        (details.slice(1).length ? '<div class="fu-card-detail">' + L.escHtml(details.slice(1).join('・')) + '</div>' : '') +
        (odText ? '<div class="fu-card-overdue ' + odCls + '">' + L.escHtml(odText) + '</div>' : '') +
      '</div>';
    }).join('');

    var prefEvents = (p.contact_pref_log || []).map(function (lg) {
      return { type: 'pref', date: String(lg.created_at).slice(0, 10), time: String(lg.created_at).slice(11),
               detail: lg.summary + (lg.note ? '（' + lg.note + '）' : ''), nurse: lg.nurse };
    });
    var events = (p.history || []).concat(prefEvents).sort(function (a, b) {
      var ka = (a.date || '') + ' ' + (a.time || ''), kb = (b.date || '') + ' ' + (b.time || '');
      return kb < ka ? -1 : kb > ka ? 1 : 0;
    });
    var histRows = events.map(function (ev) {
      var chipCls = 'hist-chip chip-' + L.escHtml(ev.type || '');
      var chipLabel = L.escHtml(CHIP_LABELS[ev.type] || ev.type);
      var catHtml = ev.category ? '<span class="hist-cat">' + L.escHtml(ev.category) + '</span>' : '';
      var detailHtml = ev.detail ? '<span class="hist-detail">' + L.escHtml(ev.detail) + '</span>' : '';
      var timeHtml = ev.time ? '<div class="hist-time">' + L.escHtml(ev.time) + '</div>' : '';
      return '<div class="hist-row">' +
        '<div class="hist-date"><div>' + L.escHtml(ev.date || '') + '</div>' + timeHtml + '</div>' +
        '<div class="hist-body"><span class="' + chipCls + '">' + chipLabel + '</span>' + catHtml + detailHtml + '</div>' +
        '<div class="hist-nurse">' + L.escHtml(ev.nurse || '') + '</div>' +
      '</div>';
    }).join('');

    root.innerHTML =
      '<a class="back-link" href="javascript:history.back()">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '返回' +
      '</a>' +
      '<div class="pt-hero">' +
        '<div class="pt-av">' + L.escHtml(initials) + '</div>' +
        '<div class="pt-info">' +
          '<div class="pt-name">' + L.escHtml(p.name) + '</div>' +
          (metaItems.length ? '<div class="pt-meta-row">' + metaItems.join('') + '</div>' : '') +
          '<div class="pt-chart">' + L.escHtml(p.chart_number) + '</div>' +
        '</div>' +
      '</div>' +
      prefHtml(p) +
      (fuCards ? '<div class="pt-section"><div class="pt-section-title">追蹤項目</div><div class="fu-cards">' + fuCards + '</div></div>' : '') +
      '<div class="pt-section"><div class="pt-section-title">聯絡記錄</div>' +
        '<div class="hist-list">' +
          (histRows || '<div class="hist-empty">尚無聯絡記錄</div>') +
        '</div>' +
      '</div>';

    wirePref();

    // wire up copy clicks
    root.querySelectorAll('.pr-copy').forEach(function (el) {
      el.addEventListener('click', function () {
        var text = el.dataset.copy || el.textContent;
        navigator.clipboard.writeText(text).then(function () {
          L.showToast('已複製：' + text);
        }).catch(function () {});
      });
    });
  }

  var chartNumber = new URLSearchParams(location.search).get('chart');
  function renderDncList(list) {
    var rows = list.map(function (x) {
      return '<tr class="pr">' +
        '<td><a href="/patient?chart=' + encodeURIComponent(x.chart_number) + '">' + L.escHtml(x.name || x.chart_number) + '</a>' +
          '<div class="dnc-sub">' + L.escHtml(x.chart_number) + '</div></td>' +
        '<td>' + L.escHtml(prefSummary(prefState(x))) + (x.note ? '<div class="dnc-sub">' + L.escHtml(x.note) + '</div>' : '') + '</td>' +
        '<td class="dnc-sub">' + L.escHtml(x.updated_at) + (x.nurse ? '<br>' + L.escHtml(x.nurse) : '') + '</td>' +
      '</tr>';
    }).join('');
    root.innerHTML =
      '<div class="ph dnc-head"><div><h1>病患資料</h1>' +
        '<p>用上方「找病患」輸入姓名或身份證，打開病患資料，即可設定聯絡偏好。</p></div></div>' +
      '<div class="pt-section"><div class="pt-section-title">要求不聯絡的病患（' + list.length + '）</div>' +
      (list.length
        ? '<div class="ptbl-wrap"><table class="p-table dnc-tbl"><colgroup><col style="width:180px"><col><col style="width:150px"></colgroup>' +
          '<thead><tr><th>病患</th><th>要求</th><th>設定時間</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="hist-list"><div class="hist-empty">目前沒有病患要求不聯絡</div></div>') +
      '</div>';
  }

  if (!chartNumber) {
    L.apiFetch('/api/contact-prefs')
      .then(function (data) { renderDncList((data && data.patients) || []); })
      .catch(function () { root.innerHTML = '<div class="pt-error">載入失敗，請重新整理</div>'; });
  } else {
    L.apiFetch('/api/patient-profile/' + encodeURIComponent(chartNumber))
      .then(function (data) { render(data); })
      .catch(function (err) {
        root.innerHTML = '<div class="pt-error">載入失敗' + (err.message === '404' ? '：找不到病患' : '') + '</div>';
      });
  }
})();
