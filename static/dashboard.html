<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>今日總覽 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=99">
<style>
/* ── dashboard-specific ─────────────────────────────── */
.tc{display:grid;grid-template-columns:1fr minmax(260px,28%);gap:12px;flex:1;min-height:0}
.lc,.rc{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;min-height:0}
.urg-item{display:flex;align-items:center;gap:9px;padding:8px 8px;margin:0 -8px;border-bottom:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;transition:background-color .12s}
.urg-item:last-child{border-bottom:none}
@media(hover:hover){.urg-item:hover{background:var(--bg)}}
.urg-item:focus-visible{outline:2.5px solid #4aa7f7;outline-offset:-2px}
.urg-item:active{background:var(--g0)}
.urg-go{width:14px;height:14px;color:var(--muted);flex-shrink:0;margin-left:2px}
/* Nothing to do: the row and tile step back so the ones with work stand out */
.urg-item.is-zero .urg-count,.urg-item.is-zero .urg-name{color:var(--muted);font-weight:500}
.urg-item.is-zero .urg-icon{opacity:.45}
.sc.is-zero .sn{color:var(--muted)!important;font-weight:500}
.sc.is-zero .sico{opacity:.45}
.urg-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.urg-name{font-size:13px;font-weight:600;color:var(--text)}
.urg-sub{font-size:11px;color:var(--sub)}
.urg-count{margin-left:auto;font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
/* ── tablet: stack dashboard columns ─────────────────── */
@media(min-width:768px) and (max-width:960px){
  .tc{grid-template-columns:1fr}
  .rc{display:grid;grid-template-columns:repeat(2,1fr)}
}
/* 本週聯繫: seven small bars, count above, weekday below */
.wk-total{margin-left:auto;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.wk-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk-n{font-size:12.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.wk-track{width:100%;max-width:44px;height:44px;display:flex;align-items:flex-end}
.wk-bar{width:100%;min-height:2px;border-radius:4px 4px 2px 2px;background:#b5d7f5}
.wk-day.today .wk-bar{background:#4aa7f7}
.wk-lbl{font-size:11.5px;color:var(--muted)}
.wk-day.today .wk-lbl{color:var(--text);font-weight:600}
.wk-day.future .wk-n,.wk-day.future .wk-lbl{opacity:.4}
.wk-day.future .wk-bar{background:var(--border)}
.wk-day.zero .wk-n{color:var(--muted);font-weight:500}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .wk-bar{background:#1E3A5F}}
:root[data-theme=dark] .wk-bar{background:#1E3A5F}
/* 下週即將到期: one row per day */
.up-note{font-size:12px;color:var(--muted);margin-bottom:8px}
.up-list{flex:1;overflow-y:auto;min-height:0}
.up-row{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.up-row:last-child{border-bottom:none}
.up-date{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.up-cats{display:flex;flex-wrap:wrap;gap:4px 16px;min-width:0}
.up-cat{text-decoration:none;color:var(--sub);white-space:nowrap;transition:color .12s}
@media(hover:hover){.up-cat:hover{color:var(--text);text-decoration:underline}}
.up-cat b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;margin-left:4px}
.up-sum{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <!-- page header -->
      <div class="ph">
        <div><h1>今日追蹤總覽</h1><p id="page-date">各科病患追蹤狀況一覽</p></div>
      </div>

      <!-- stat cards -->
      <div class="sr">
        <div class="sc ft">
          <div class="sct"><span class="scl">總待追蹤</span>
            <div class="sico ico-blue">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4aa7f7" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>
          <div class="sn" id="stat-pending">—</div>
          <div class="str" id="stat-pending-sub">載入中</div>
        </div>
        <div class="sc">
          <div class="sct"><span class="scl">結案風險</span>
            <div class="sico ico-amber">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
          </div>
          <div class="sn" id="stat-risk" style="color:var(--text)">—</div>
          <div class="str" style="color:var(--muted)">即將到期病患</div>
        </div>
        <div class="sc">
          <div class="sct"><span class="scl">可申報MSPT</span>
            <div class="sico ico-purple">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 12 18 15 15"/></svg>
            </div>
          </div>
          <div class="sn" id="stat-mspt" style="color:var(--text)">—</div>
          <div class="str" style="color:var(--muted)">今日可提交健保</div>
        </div>
        <div class="sc">
          <div class="sct"><span class="scl">暫緩中</span>
            <div class="sico ico-amber">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
          </div>
          <div class="sn" id="stat-hold" style="color:var(--text)">—</div>
          <div class="str" style="color:var(--muted)">各科暫緩</div>
        </div>
      </div>

      <!-- two-col -->
      <div class="tc">
        <div class="lc">

          <!-- this week's contacts: compact strip -->
          <div class="card">
            <div class="chd" style="margin-bottom:12px">
              <div class="cttl">本週聯繫</div>
              <div class="wk-total" id="wk-total">—</div>
            </div>
            <div class="wk-strip" id="wk-strip"></div>
          </div>

          <!-- next 7 days -->
          <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
            <div class="chd" style="margin-bottom:6px">
              <div class="cttl">下週即將到期</div>
              <div class="wk-total" id="up-total">—</div>
            </div>
            <div class="up-note">代謝症候群、B/C肝、慢性腎臟病的下次追蹤日落在未來 7 天的病患。</div>
            <div class="up-list" id="up-list"><div class="sec-empty">載入中…</div></div>
          </div>

        </div><!-- end left col -->

        <div class="rc">

          <!-- urgent -->
          <div class="card">
            <div class="chd" style="margin-bottom:10px"><div class="cttl">今日待處理</div></div>
            <a class="urg-item" href="/prescription">
              <div class="urg-icon ico-green">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#065F46" stroke-width="2" stroke-linecap="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
              </div>
              <div><div class="urg-name">處方追蹤</div><div class="urg-sub">待聯絡處方病患</div></div>
              <div class="urg-count" id="urg-rx">—</div><svg class="urg-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
            </a>
            <a class="urg-item" href="/lab">
              <div class="urg-icon ico-sky">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v11m0 0a3 3 0 1 0 6 0m-6 0h6m-6 0H3m12 0h6"/></svg>
              </div>
              <div><div class="urg-name">抽血結果待確認</div><div class="urg-sub">檢驗追蹤</div></div>
              <div class="urg-count" id="urg-blood">—</div><svg class="urg-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
            </a>
            <a class="urg-item" href="/mspt" data-tab-key="mspt_active_tab" data-tab="submittable">
              <div class="urg-icon ico-purple">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 12 18 15 15"/></svg>
              </div>
              <div><div class="urg-name">可申報MSPT</div><div class="urg-sub">血液報告已出爐</div></div>
              <div class="urg-count" id="urg-mspt">—</div><svg class="urg-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
            </a>
            <a class="urg-item" href="/hepatitis" data-tab-key="hep_active_tab" data-tab="returned">
              <div class="urg-icon ico-sky">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              </div>
              <div><div class="urg-name">B肝待輸入VPN</div><div class="urg-sub">近期回診未登錄</div></div>
              <div class="urg-count" id="urg-hep">—</div><svg class="urg-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
            </a>
            <a class="urg-item" href="/blood-recall">
              <div class="urg-icon ico-rose">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9D174D" stroke-width="2" stroke-linecap="round"><path d="M12 2C9 5 5 9 5 14a7 7 0 0 0 14 0C19 9 15 5 12 2z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <div><div class="urg-name">抽血追蹤</div><div class="urg-sub">異常指標需複查</div></div>
              <div class="urg-count" id="urg-recall">—</div><svg class="urg-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
            </a>
          </div>

          <!-- contact log -->
          <div class="card dk" style="flex:1;display:flex;flex-direction:column;min-height:0">
            <div style="display:flex;align-items:center;margin-bottom:12px;flex-shrink:0">
              <div class="cttl">今日聯繫記錄</div>
              <span id="cl-count" style="margin-left:auto;font-size:11px;opacity:.55;margin-right:8px">0 筆</span>
              <a href="/history" style="font-size:11px;color:var(--sub);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;white-space:nowrap;flex-shrink:0">完整記錄 →</a>
            </div>
            <div id="contact-log" style="flex:1;overflow:hidden;min-height:0"><div class="dk-empty">載入中…</div></div>
          </div>

        </div><!-- end right col -->
      </div><!-- end two-col -->

    </div><!-- end ct -->
  </div><!-- end main -->
</div><!-- end app -->

<script src="/static/_layout.js?v=93"></script>
<script>
(function () {
  'use strict';
  var E = Layout.escHtml, D = Layout.localDateStr, L = Layout;

  function renderPageDate() {
    var d = new Date(), DOW = ['日','一','二','三','四','五','六'];
    document.getElementById('page-date').textContent =
      d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日（週' + DOW[d.getDay()] + '）';
  }

  // ── stats ──────────────────────────────────────────
  function renderStats(report, bloodCount, rxPendingCount) {
    var pending = [].concat(
      report.mspt_followups||[], report.mspt_inactive||[],
      report.hep_followups||[], report.ckd_followups||[], report.ckd_inactive||[]
    );
    var rxCount  = rxPendingCount || 0;
    var labCount = bloodCount || 0;
    var riskAll = [].concat(report.mspt_followups||[], report.hep_followups||[], report.ckd_followups||[]);
    var riskCount = 0;
    riskAll.forEach(function(e) {
      var cd = CLOSE_DAYS_DB[e.category]; if (cd == null) return;
      var dtc = cd - e.days_overdue;
      var thr = (e.category === '代謝症候群' && e.needs_blood_test === false) ? 5 : 15;
      if (dtc >= 0 && dtc <= thr) riskCount++;
    });
    setCount('stat-pending', pending.length + rxCount + labCount);
    setCount('stat-risk',    riskCount);
    setCount('stat-mspt',    (report.mspt_submittable||[]).length);
    setCount('stat-hold',    (report.on_hold||[]).length);
    document.getElementById('stat-pending-sub').textContent =
      '處方 '+rxCount+' · MSPT '+(report.mspt_followups||[]).length+' · B肝 '+(report.hep_followups||[]).length+' · 腎臟 '+(report.ckd_followups||[]).length+' · 檢驗 '+labCount;
    L.updateBadges(report, bloodCount);
    return { pending: pending, rxCount: rxCount, labCount: labCount };
  }

  var CAT_CLS  = {'慢簽':'cat-c','代謝症候群':'cat-m','B肝':'cat-h','C肝':'cat-h','慢性腎臟病':'cat-k','處方':'cat-r','檢驗':'cat-l'};
  var CLOSE_DAYS_DB = {'代謝症候群':90,'B肝':185,'C肝':185,'慢性腎臟病':180};

  // ── urgent panel ────────────────────────────────────
  // Set a tile/row count and mark its tile or row when it is zero
  function setCount(id, n) {
    var el = document.getElementById(id);
    el.textContent = n;
    var box = el.closest('.sc, .urg-item');
    if (box) box.classList.toggle('is-zero', !Number(n));
  }

  function renderUrgent(report, bloodCount, rxPendingCount, brCount) {
    setCount('urg-rx',     rxPendingCount || 0);
    setCount('urg-blood',  bloodCount || 0);
    setCount('urg-mspt',   (report.mspt_submittable||[]).length);
    setCount('urg-hep',    (report.hep_returned||[]).length);
    setCount('urg-recall', brCount || 0);
  }

  // Rows that open a specific tab remember it the same way the list pages do
  document.querySelectorAll('.urg-item[data-tab-key]').forEach(function (a) {
    a.addEventListener('click', function () {
      try { sessionStorage.setItem(a.dataset.tabKey, a.dataset.tab); } catch (ex) {}
    });
  });

  // ── contact log card ────────────────────────────────
  var CAT_SHORT = {'慢簽':'慢簽','代謝症候群':'代謝','慢性腎臟病':'腎臟','B肝':'B肝','C肝':'C肝'};
  function renderContactLog(todayHistory) {
    var all = ((todayHistory&&todayHistory.contacted)||[]).concat((todayHistory&&todayHistory.called)||[]);
    all.reverse(); // newest first
    var el = document.getElementById('contact-log');
    var cntEl = document.getElementById('cl-count');
    if (cntEl) cntEl.textContent = all.length + ' 筆';
    if (!all.length) { el.innerHTML='<div class="dk-empty">今日尚無聯繫記錄</div>'; return; }
    el.innerHTML = all.map(function(e) {
      var name = (e.patient&&e.patient.name)||e.manual_name||'—';
      var cat  = CAT_SHORT[e.category]||(e.category||'').slice(0,2);
      var nurse = e.nurse ? ' · '+E(e.nurse) : '';
      var time = e.contacted_time ? ' '+E(e.contacted_time) : '';
      return '<div class="dk-row">'+
        '<span class="dk-val">'+E(name)+'</span>'+
        '<span class="dk-label">'+E(cat)+nurse+time+'</span>'+
      '</div>';
    }).join('');
    // hide rows that don't fit completely, leaving a clean bottom gap
    requestAnimationFrame(function() {
      var avail = el.clientHeight - 10;
      var rows = el.querySelectorAll('.dk-row');
      var acc = 0, clipping = false;
      rows.forEach(function(row) {
        if (clipping) { row.style.display = 'none'; return; }
        acc += row.offsetHeight;
        if (acc > avail) { row.style.display = 'none'; clipping = true; }
      });
    });
  }

  // ── weekly chart ────────────────────────────────────
  function fetchDayHistory(dateStr) {
    var today = D();
    var cacheKey = 'hist:' + dateStr;
    if (dateStr !== today) {
      try {
        var hit = sessionStorage.getItem(cacheKey);
        if (hit) return Promise.resolve(JSON.parse(hit));
      } catch(e) {}
    }
    return L.apiFetch('/api/contacts/history?target_date=' + dateStr)
      .then(function(r) {
        var c1 = (r.contacted || []).length, c2 = (r.called || []).length, mc = (r.mspt_completed || []).length;
        var cats = {};
        [].concat(r.contacted || [], r.called || []).forEach(function(e) {
          var c = e.category || '其他'; cats[c] = (cats[c] || 0) + 1;
        });
        var result = {count: c1 + c2, contacted: c1, called: c2, mspt_completed: mc, cats: cats};
        if (dateStr !== today) {
          try { sessionStorage.setItem(cacheKey, JSON.stringify(result)); } catch(e) {}
        }
        return result;
      })
      .catch(function() { return {count: 0, contacted: 0, called: 0, mspt_completed: 0, cats: {}}; });
  }
  function fetchWeekHistory() {
    var monday = L.getMondayStr(), today = D();
    var dates = [], i; for(i=0;i<7;i++) dates.push(L.addDays(monday,i));
    var todayIdx = dates.indexOf(today);
    var upto = todayIdx>=0 ? todayIdx+1 : 7;
    return Promise.all(dates.slice(0,upto).map(fetchDayHistory)).then(function(data){
      return dates.map(function(d,i){
        var dd = i < upto ? data[i] : null;
        return {dateStr:d, count:dd?dd.count:null, contacted:dd?dd.contacted:0, called:dd?dd.called:0,
          mspt_completed:dd?dd.mspt_completed:0, cats:dd?dd.cats:{}, isToday:d===today, isFuture:todayIdx>=0&&i>todayIdx};
      });
    });
  }
  var DAY_NAMES = ['一','二','三','四','五','六','日'];
  var CAT_SHORT_UP = {'慢簽':'慢簽','代謝症候群':'代謝','B肝':'B肝','C肝':'C肝','慢性腎臟病':'腎臟'};

  // 本週聯繫 — one small bar per weekday; hover title gives the day's breakdown by list
  function renderWeek(weekData) {
    var counts = weekData.map(function (d) { return d.count != null ? d.count : 0; });
    var maxVal = Math.max.apply(null, counts.concat([1]));
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    document.getElementById('wk-total').textContent = '本週共 ' + total + ' 件';
    document.getElementById('wk-strip').innerHTML = weekData.map(function (d, i) {
      var n = counts[i];
      var cls = 'wk-day' + (d.isToday ? ' today' : '') + (d.isFuture ? ' future' : '') + (!d.isFuture && !n ? ' zero' : '');
      var cats = d.cats || {};
      var parts = Object.keys(cats).filter(function (c) { return cats[c]; })
        .map(function (c) { return (CAT_SHORT_UP[c] || c) + ' ' + cats[c]; });
      var title = '週' + DAY_NAMES[i] + ' ' + d.dateStr.slice(5) + '：' + (d.isFuture ? '尚未到' : n + ' 件' + (parts.length ? '（' + parts.join('、') + '）' : ''));
      var h = d.isFuture ? 0 : Math.round(n / maxVal * 44);
      return '<div class="' + cls + '" title="' + L.escHtml(title) + '">' +
        '<span class="wk-n">' + (d.isFuture ? '' : n) + '</span>' +
        '<span class="wk-track"><span class="wk-bar" style="height:' + h + 'px"></span></span>' +
        '<span class="wk-lbl">' + DAY_NAMES[i] + '</span></div>';
    }).join('');
  }

  // 下週即將到期 — patients whose next follow-up date falls in the next 7 days, grouped by day.
  // Each list name opens that page on its 未到期 tab.
  var UP_SOURCES = [
    { key: 'mspt_upcoming', label: '代謝症候群', href: '/mspt',      tabKey: 'mspt_active_tab' },
    { key: 'hep_upcoming',  label: 'B/C肝',      href: '/hepatitis', tabKey: 'hep_active_tab' },
    { key: 'ckd_upcoming',  label: '慢性腎臟病', href: '/ckd',       tabKey: 'ckd_active_tab' },
  ];
  function renderUpcoming(report) {
    var today = D(), days = [], i;
    for (i = 1; i <= 7; i++) days.push(L.addDays(today, i));
    var byDay = {}; days.forEach(function (d) { byDay[d] = {}; });
    var total = 0;
    UP_SOURCES.forEach(function (src) {
      (report[src.key] || []).forEach(function (e) {
        var d = String(e.due_date || '').slice(0, 10);
        if (!byDay[d]) return;
        byDay[d][src.label] = (byDay[d][src.label] || 0) + 1;
        total++;
      });
    });
    document.getElementById('up-total').textContent = '共 ' + total + ' 人';
    var rows = days.filter(function (d) { return Object.keys(byDay[d]).length; }).map(function (d) {
      var dt = new Date(d + 'T00:00:00');
      var wd = DAY_NAMES[(dt.getDay() + 6) % 7];
      var sum = 0;
      var cats = UP_SOURCES.filter(function (s) { return byDay[d][s.label]; }).map(function (s) {
        sum += byDay[d][s.label];
        return '<a class="up-cat" href="' + s.href + '" data-tab-key="' + s.tabKey + '">' + s.label + '<b>' + byDay[d][s.label] + '</b></a>';
      }).join('');
      return '<div class="up-row"><span class="up-date">' + d.slice(5).replace('-', '/') + ' 週' + wd + '</span>' +
        '<span class="up-cats">' + cats + '</span><span class="up-sum">' + sum + '</span></div>';
    });
    document.getElementById('up-list').innerHTML = rows.length ? rows.join('') : '<div class="sec-empty">未來 7 天沒有到期的病患</div>';
  }
  document.getElementById('up-list').addEventListener('click', function (ev) {
    var a = ev.target.closest('.up-cat'); if (!a) return;
    try { sessionStorage.setItem(a.dataset.tabKey, 'upcoming'); } catch (ex) {}
  });

  // ── main load ───────────────────────────────────────
  function load() {
    L.hideError();
    var today = D();
    Promise.all([
      L.getReport(today),
      L.apiFetch('/api/blood-pending').catch(function(){return [];}),
      fetchWeekHistory(),
      L.apiFetch('/api/contacts/history?target_date='+today).catch(function(){return {contacted:[],called:[]};}),
      L.apiFetch('/api/report/prescriptions').catch(function(){return [];}),
      L.apiFetch('/api/blood-recall').catch(function(){return [];})
    ]).then(function(res){
      var report=res[0], bloodData=res[1], week=res[2], todayHistory=res[3], rxResp=res[4], brData=res[5];
      var rxData = (rxResp && rxResp.rows) ? rxResp.rows : (rxResp || []);
      var bloodCount=0;
      if(Array.isArray(bloodData)) bloodData.forEach(function(day){(day.patients||[]).forEach(function(p){if(p.results_back && !p.notified)bloodCount++;});});
      // compute prescription pending: rx entries not yet contacted or on hold
      var rxContactedKeys = {};
      (report.contacted||[]).forEach(function(e){ if(e.category==='處方') rxContactedKeys[e.patient.chart_number]=true; });
      (report.called||[]).forEach(function(e){ if(e.category==='處方') rxContactedKeys[e.patient.chart_number]=true; });
      var rxHoldKeys = {};
      (report.on_hold||[]).forEach(function(e){ if(e.category==='處方'&&e.patient) rxHoldKeys[e.patient.chart_number]=true; });
      var rxPendingCount = (rxData||[]).filter(function(e){ return !rxContactedKeys[e.nat_id] && !rxHoldKeys[e.nat_id] && !e.is_care; }).length;
      var s = renderStats(report, bloodCount, rxPendingCount);
      // normalize 處方 entries (priority 0)
      var rxPendingEntries = (rxData||[]).filter(function(e){
        return !rxContactedKeys[e.nat_id] && !rxHoldKeys[e.nat_id] && !e.is_care;
      }).map(function(e) {
        var days = e.due_date ? Math.round((new Date(today+'T00:00:00') - new Date(String(e.due_date).slice(0,10)+'T00:00:00')) / 86400000) : 0;
        return { patient:{chart_number:e.nat_id, name:e.name}, category:'處方', days_overdue:days, _priority:0 };
      });
      // normalize 檢驗 entries (priority 1)
      var bloodPendingEntries = [];
      (bloodData||[]).forEach(function(day){
        (day.patients||[]).forEach(function(p){
          if (p.results_back && !p.notified) {
            var days = day.date ? Math.round((new Date(today+'T00:00:00') - new Date(String(day.date).slice(0,10)+'T00:00:00')) / 86400000) : 0;
            bloodPendingEntries.push({ patient:{chart_number:p.nat_id, name:p.name}, category:'檢驗', days_overdue:days, _priority:1 });
          }
        });
      });
      var brCount = Array.isArray(brData) ? brData.filter(function(p){ return p.status === 'active'; }).length : 0;
      renderUrgent(report, bloodCount, rxPendingCount, brCount);
      renderContactLog(todayHistory);
      renderWeek(week);
      renderUpcoming(report);
      L.updateLastUpdated();
    }).catch(function(e){
      L.showError('資料載入失敗 — '+(e.message||'請確認伺服器連線'));
    });
  }

  renderPageDate();
  Layout.init({ activePage: 'dashboard', onRefresh: load });
  load();
})();
</script>
</body>
</html>
