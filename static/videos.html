<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>教學影片 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=104">
<style>
.vd-head{margin-bottom:20px}
#vd-groups{display:flex;flex-direction:column;gap:28px;flex-shrink:0}
.vd-gh{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px}
.vd-gn{font-size:12.5px;font-weight:500;color:var(--muted)}
.vd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vd-new{display:inline-block;font-size:11px;font-weight:700;color:var(--link);background:var(--g0);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.vd-card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s}
@media(hover:hover){.vd-card:hover{border-color:var(--sub)}}
.vd-card:focus-visible{outline:2.5px solid #4aa7f7;outline-offset:2px}
.vd-card:active{transform:scale(.99)}
.vd-thumb{position:relative;aspect-ratio:1366/768;background:var(--g0);overflow:hidden}
.vd-thumb img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.vd-thumb.phone img{object-fit:contain}
.vd-phone{position:absolute;left:8px;bottom:8px;background:rgba(17,24,39,.78);color:#fff;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px}
.vd-play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(17,24,39,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.vd-len{position:absolute;right:8px;bottom:8px;background:rgba(17,24,39,.78);color:#fff;font-size:11.5px;font-weight:600;
  padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.vd-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.vd-title{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.45}
.vd-desc{font-size:12.5px;color:var(--sub);line-height:1.55}
.vd-date{font-size:11.5px;color:var(--muted);margin-top:2px}
@media(prefers-reduced-motion:reduce){.vd-card:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">
      <div class="ph vd-head"><div><h1>教學影片</h1>
        <p>每支影片不到一分鐘，示範一件事怎麼做。影片裡的病患都是假資料。</p></div></div>
      <div id="vd-groups"></div>
    </div>
  </div>
</div>

<script src="/static/_layout.js?v=99"></script>
<script src="/static/auth-client.js"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  L.init({ activePage: 'videos' });

  var play = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  // Grouped like the sidebar; a video added in the last two weeks gets a 「新」 tag
  var today = new Date(); today.setHours(0, 0, 0, 0);
  function isNew(d) { return (today - new Date(d.added + 'T00:00:00')) / 86400000 <= 14; }
  function card(d) {
    var date = d.added.split('-');
    return '<button type="button" class="vd-card" onclick="Layout.playDemo(\'' + d.id + '\')">' +
      '<div class="vd-thumb' + (d.phone ? ' phone' : '') + '"><img src="/static/demos/' + d.id + '.jpg?v=' + d.v + '" alt="" loading="lazy">' +
        (d.phone ? '<span class="vd-phone">手機畫面</span>' : '') + '<span class="vd-play">' + play + '</span><span class="vd-len">' + Math.floor(d.secs / 60) + ':' + ('0' + d.secs % 60).slice(-2) + '</span></div>' +
      '<div class="vd-body"><div class="vd-title">' + (isNew(d) ? '<span class="vd-new">新</span>' : '') + L.escHtml(d.title) + '</div>' +
        '<div class="vd-desc">' + L.escHtml(d.desc) + '</div>' +
        '<div class="vd-date">' + (+date[1]) + '/' + (+date[2]) + ' 新增</div></div>' +
    '</button>';
  }
  document.getElementById('vd-groups').innerHTML = L.demoGroups.map(function (g) {
    var list = L.demos.filter(function (d) { return d.group === g; });
    if (!list.length) return '';
    return '<section><h2 class="vd-gh">' + L.escHtml(g) + '<span class="vd-gn">' + list.length + ' 支</span></h2>' +
      '<div class="vd-grid">' + list.map(card).join('') + '</div></section>';
  }).join('');
})();
</script>
</body>
</html>
