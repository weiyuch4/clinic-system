<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>便利貼 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=35">
<style>
.compose-card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.compose-footer{display:flex;align-items:center;gap:10px}
.color-pick{display:flex;gap:7px;align-items:center}
.cp-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.cp-dot:hover{transform:scale(1.18)}
.cp-dot.active{border-color:var(--text)}
.cp-dot[data-c="yellow"]{background:#FCD34D}
.cp-dot[data-c="blue"]  {background:#60A5FA}
.cp-dot[data-c="green"] {background:#4ADE80}
.cp-dot[data-c="pink"]  {background:#F472B6}
.compose-hint{font-size:11.5px;color:var(--muted)}
.compose-spacer{flex:1}

.notes-list{display:flex;flex-direction:column;gap:8px}
.note-item{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border-left:4px solid #FCD34D;display:flex;align-items:flex-start;gap:0;overflow:hidden}
.note-item[data-color="yellow"]{border-left-color:#FCD34D}
.note-item[data-color="blue"]  {border-left-color:#60A5FA}
.note-item[data-color="green"] {border-left-color:#4ADE80}
.note-item[data-color="pink"]  {border-left-color:#F472B6}
.note-body{flex:1;padding:11px 14px 10px}
.note-content{font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.note-meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--muted)}
.note-nurse{font-weight:600;color:var(--sub)}
.note-dot{opacity:.4}
.note-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:11px 14px;align-self:stretch;display:flex;align-items:center;font-size:16px;line-height:1;transition:color .12s,background .12s;flex-shrink:0}
.note-del:hover{color:#dc2626;background:rgba(220,38,38,.08)}

.notes-empty{text-align:center;color:var(--muted);font-size:13px;padding:32px 0}
.notes-empty svg{display:block;margin:0 auto 10px;opacity:.3}

.undo-toast{position:fixed;bottom:24px;right:24px;background:#374151;color:#fff;padding:11px 14px 11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.22);display:flex;align-items:center;gap:12px;z-index:9999;transform:translateY(10px);opacity:0;transition:transform .22s,opacity .22s;pointer-events:none}
.undo-toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
.undo-btn{background:#fff;color:#111827;border:none;border-radius:6px;padding:4px 11px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.undo-btn:hover{background:#f3f4f6}

@media(max-width:767px){
  .undo-toast{bottom:calc(72px + env(safe-area-inset-bottom,0px) + 10px)}
  .compose-hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>便利貼</h1><p>前台共用記事板，即時同步</p></div>
      </div>

      <div class="compose-card">
        <textarea class="modal-input" id="compose-ta" placeholder="快速記事…" rows="2" style="resize:none;min-height:60px"></textarea>
        <div class="compose-footer">
          <div class="color-pick" id="color-pick">
            <span class="cp-dot active" data-c="yellow"></span>
            <span class="cp-dot" data-c="blue"></span>
            <span class="cp-dot" data-c="green"></span>
            <span class="cp-dot" data-c="pink"></span>
          </div>
          <span class="compose-hint">Ctrl+Enter 送出</span>
          <div class="compose-spacer"></div>
          <button class="act-btn act-primary" id="btn-post">貼上</button>
        </div>
      </div>

      <div class="sec-head" style="margin-top:18px;cursor:default">
        <span>記事</span>
        <span class="sec-count" id="notes-count" style="display:none"></span>
      </div>

      <div class="notes-list" id="notes-list">
        <div class="notes-empty" id="notes-loading">載入中…</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/_layout.js?v=35"></script>
<script>
(function () {
  var L = window.Layout;
  var _color          = 'yellow';
  var _notes          = [];
  var _pendingDeletes = {};

  document.getElementById('color-pick').addEventListener('click', function (e) {
    var dot = e.target.closest('.cp-dot');
    if (!dot) return;
    _color = dot.dataset.c;
    document.querySelectorAll('.cp-dot').forEach(function (d) {
      d.classList.toggle('active', d.dataset.c === _color);
    });
  });

  var ta = document.getElementById('compose-ta');
  ta.addEventListener('input', function () {
    ta.style.height = 'auto';
    ta.style.height = Math.max(60, ta.scrollHeight) + 'px';
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  });
  setTimeout(function () { ta.focus(); }, 50);

  document.getElementById('btn-post').addEventListener('click', submit);

  function submit() {
    var content = ta.value.trim();
    if (!content) { ta.focus(); return; }
    var btn = document.getElementById('btn-post');
    btn.disabled = true;
    var optimistic = {
      id: 'tmp-' + Date.now(), content: content, color: _color,
      nurse: L.getNurse(),
      created_at: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
      _tmp: true,
    };
    _notes.unshift(optimistic);
    render(_notes);
    ta.value = ''; ta.style.height = '';
    L.apiAction('POST', '/api/notes', { content: content, color: _color, nurse: L.getNurse() })
      .then(function (note) {
        _notes = _notes.map(function (n) { return n.id === optimistic.id ? note : n; });
        render(_notes);
      })
      .catch(function (e) {
        _notes = _notes.filter(function (n) { return n.id !== optimistic.id; });
        render(_notes);
        L.showToast('發布失敗：' + (e.message || ''), 'error');
      })
      .finally(function () { btn.disabled = false; });
  }

  document.getElementById('notes-list').addEventListener('click', function (e) {
    var delBtn = e.target.closest('.note-del');
    if (!delBtn) return;
    var id = delBtn.dataset.id;
    if (!id || _pendingDeletes[id]) return;
    var idx = -1, note = null;
    for (var i = 0; i < _notes.length; i++) {
      if (String(_notes[i].id) === id) { idx = i; note = _notes[i]; break; }
    }
    if (!note) return;
    _notes.splice(idx, 1);
    render(_notes);
    var toast = document.createElement('div');
    toast.className = 'undo-toast';
    toast.innerHTML = '已移除便利貼 <button class="undo-btn">復原</button>';
    document.body.appendChild(toast);
    setTimeout(function () { toast.classList.add('show'); }, 10);
    var timerId = setTimeout(function () { _commitDelete(id); }, 5000);
    _pendingDeletes[id] = { note: note, origIndex: idx, timerId: timerId, toastEl: toast };
    toast.querySelector('.undo-btn').addEventListener('click', function () { _undoDelete(id); });
  });

  function _commitDelete(id) {
    var entry = _pendingDeletes[id]; if (!entry) return;
    _dismissToast(entry.toastEl); delete _pendingDeletes[id];
    L.apiAction('DELETE', '/api/notes/' + id).catch(function (e) {
      L.showToast('刪除失敗：' + (e.message || ''), 'error');
      _notes.splice(0, 0, entry.note); render(_notes);
    });
  }

  function _undoDelete(id) {
    var entry = _pendingDeletes[id]; if (!entry) return;
    clearTimeout(entry.timerId); _dismissToast(entry.toastEl); delete _pendingDeletes[id];
    _notes.splice(Math.min(entry.origIndex, _notes.length), 0, entry.note);
    render(_notes);
  }

  function _dismissToast(toast) {
    toast.classList.remove('show');
    setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 280);
  }

  function render(notes) {
    var list = document.getElementById('notes-list');
    var countEl = document.getElementById('notes-count');
    var real = notes.filter(function(n){ return !n._tmp; });
    if (real.length > 0) {
      countEl.textContent = real.length; countEl.style.display = '';
    } else {
      countEl.style.display = 'none';
    }
    if (!notes.length) {
      list.innerHTML = '<div class="notes-empty">' +
        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/></svg>' +
        '目前沒有便利貼</div>';
      return;
    }
    list.innerHTML = notes.map(function (n) {
      var timeLabel = n.created_at ? (n.created_at.slice(11, 16) || n.created_at) : '';
      var isTemp = !!n._tmp;
      var meta = [];
      if (n.nurse) meta.push('<span class="note-nurse">' + L.escHtml(n.nurse) + '</span>');
      if (timeLabel) {
        if (meta.length) meta.push('<span class="note-dot">·</span>');
        meta.push('<span>' + L.escHtml(timeLabel) + '</span>');
      }
      return '<div class="note-item" data-color="' + L.escHtml(n.color || 'yellow') + '">' +
        '<div class="note-body">' +
          '<div class="note-content">' + L.escHtml(n.content) + '</div>' +
          (meta.length ? '<div class="note-meta">' + meta.join('') + '</div>' : '') +
        '</div>' +
        (!isTemp ? '<button class="note-del" data-id="' + L.escHtml(String(n.id)) + '" title="刪除">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' : '') +
      '</div>';
    }).join('');
  }

  function load() {
    L.apiFetch('/api/notes')
      .then(function (notes) {
        var tmpEntries = _notes.filter(function (n) { return n._tmp; });
        var pendingIds = Object.keys(_pendingDeletes);
        _notes = tmpEntries.concat(notes.filter(function (n) {
          return pendingIds.indexOf(String(n.id)) === -1;
        }));
        render(_notes);
      })
      .catch(function (e) {
        document.getElementById('error-msg').textContent = '便利貼載入失敗 — ' + (e.message || e);
        document.getElementById('error-bar').style.display = 'flex';
      });
  }

  load();
  setInterval(function () {
    if (_notes.some(function (n) { return n._tmp; })) return;
    L.apiFetch('/api/notes').then(function (notes) {
      var pendingIds = Object.keys(_pendingDeletes);
      _notes = notes.filter(function (n) { return pendingIds.indexOf(String(n.id)) === -1; });
      render(_notes);
    }).catch(function () {});
  }, 10000);

  Layout.init({ activePage: 'notes' });
}());
</script>
</body>
</html>
