<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>代謝症候群 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=58">
<style>
.sub-banner{border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:11px;flex-shrink:0;background:#EDE9FE;border:1px solid #DDD6FE}
.sub-banner-icon{width:30px;height:30px;border-radius:8px;background:#6D28D9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-banner-title{font-size:13px;font-weight:700;color:#4C1D95}
.sub-banner-sub{font-size:12px;color:#6D28D9;margin-top:2px}
.sub-count{margin-left:auto;font-size:22px;font-weight:700;color:#6D28D9;font-variant-numeric:tabular-nums;flex-shrink:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sub-banner{background:#1A0B35;border-color:#4C1D95;color:#C4B5FD}:root:not([data-theme="light"]) .sub-banner-title,:root:not([data-theme="light"]) .sub-banner-sub,:root:not([data-theme="light"]) .sub-count{color:#C4B5FD}}
:root[data-theme="dark"] .sub-banner{background:#1A0B35;border-color:#4C1D95;color:#C4B5FD}
:root[data-theme="dark"] .sub-banner-title,:root[data-theme="dark"] .sub-banner-sub,:root[data-theme="dark"] .sub-count{color:#C4B5FD}
.tab-hint{font-size:12px;border-radius:8px;padding:9px 13px;flex-shrink:0;display:flex;align-items:flex-start;gap:8px;line-height:1.5;margin-bottom:10px}
.tab-hint-warn{background:#fef3c7;border:1px solid #fde68a;color:#78350f}
.tab-hint-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab-hint-warn{background:#1c1200;border-color:#78350f;color:#fcd34d}:root:not([data-theme="light"]) .tab-hint-info{background:#0d1f3b;border-color:#1d4ed8;color:#93c5fd}}
:root[data-theme="dark"] .tab-hint-warn{background:#1c1200;border-color:#78350f;color:#fcd34d}
:root[data-theme="dark"] .tab-hint-info{background:#0d1f3b;border-color:#1d4ed8;color:#93c5fd}
.modal-hint{font-size:12.5px;padding:9px 11px;border-radius:7px;border:1px solid;margin-bottom:2px}
.mdp-trigger{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:600 13px/1 system-ui,-apple-system,'Microsoft JhengHei',sans-serif;padding:7px 12px;height:36px;cursor:pointer;white-space:nowrap;transition:border-color .12s,box-shadow .12s;user-select:none;width:100%}
.mdp-trigger:hover{border-color:var(--sub)}.mdp-trigger.open{border-color:var(--g5);box-shadow:0 0 0 3px rgba(107,114,128,.12)}.mdp-trigger svg{width:13px;height:13px;color:var(--muted);flex-shrink:0}
.mdp-wrap{position:relative}.pick-drop{position:absolute;top:calc(100% + 6px);left:0;z-index:700;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.07);overflow:hidden;animation:pick-in .12s ease}
@keyframes pick-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cal-drop{padding:14px;width:248px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-nav-btn{width:26px;height:26px;border:none;border-radius:6px;background:var(--bg);color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}.cal-nav-btn:hover{background:var(--g0);color:var(--text)}.cal-month-lbl{font-size:13.5px;font-weight:700;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}.cal-dow{font-size:10px;font-weight:700;text-align:center;color:var(--muted);padding:0 0 8px;letter-spacing:.04em}
.cal-day{height:30px;border:none;border-radius:6px;background:transparent;font-size:12.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;font-variant-numeric:tabular-nums}
.cal-day:hover:not(:disabled){background:var(--g0)}.cal-day.cal-today{font-weight:700;color:#2563EB}.cal-day.cal-sel{background:#2563EB;color:#fff;font-weight:700}.cal-day.cal-sel:hover{background:#1D4ED8}.cal-day.cal-other{color:var(--muted)}.cal-day:disabled{opacity:.25;cursor:default}

</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>代謝症候群</h1><p id="page-date">MSPT 各階段追蹤</p></div>
      </div>

      <div class="sub-banner" id="sub-banner" style="display:none">
        <div class="sub-banner-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 12 18 15 15"/></svg>
        </div>
        <div>
          <div class="sub-banner-title">今日待登VPN</div>
          <div class="sub-banner-sub">血液報告已出爐或電話完成，可於健保署VPN系統提交</div>
        </div>
        <div class="sub-count" id="sub-count">0</div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-tab on" data-tab="return">需回診 <span class="tc-count" id="cnt-return">…</span></button>
        <button class="filter-tab" data-tab="phone">可電話完成 <span class="tc-count" id="cnt-phone">…</span></button>
        <button class="filter-tab" data-tab="submittable">待登VPN <span class="tc-count" id="cnt-submittable">…</span></button>
        <button class="filter-tab" data-tab="submitted">已申報 <span class="tc-count" id="cnt-submitted">…</span></button>
        <span class="filter-sep"></span>
        <button class="filter-tab" data-tab="inactive">未複診 <span class="tc-count" id="cnt-inactive">…</span></button>
        <button class="filter-tab" data-tab="contacted">已聯繫 <span class="tc-count" id="cnt-contacted">…</span></button>
        <button class="filter-tab" data-tab="hold">暫緩中 <span class="tc-count" id="cnt-hold">…</span></button>
        <button class="filter-tab" data-tab="excluded">排除名單 <span class="tc-count" id="cnt-excluded">…</span></button>
        <button class="act-btn" id="btn-workflow" style="margin-left:auto;gap:5px;flex-shrink:0;padding:6px 12px;font-size:13px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="11" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          逐一追蹤
        </button>
      </div>

      <div class="search-row">
        <input class="si" type="text" id="search-input" placeholder="搜尋姓名或身份證…">
        <button class="act-btn" id="btn-filter" style="flex-shrink:0;gap:5px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          篩選<span class="filter-badge" id="filter-badge" style="display:none">0</span>
        </button>
        <span class="sr-count" id="result-count"></span>
      </div>

      <div class="filter-panel" id="filter-panel" style="display:none">
        <div class="chip-group">
          <span class="chip-label">階段</span>
          <div class="type-chips" id="type-chips">
            <button class="type-chip on" data-stage="">全部</button>
            <button class="type-chip" data-stage="收案">收案</button>
            <button class="type-chip" data-stage="追1">追1</button>
            <button class="type-chip" data-stage="追2">追2</button>
            <button class="type-chip" data-stage="追3">追3</button>
            <button class="type-chip" data-stage="年度追蹤">年度追蹤</button>
          </div>
        </div>
        <div class="chip-group" id="note-filter-group" style="display:none">
          <span class="chip-label">備注</span>
          <div class="type-chips" id="note-chips">
            <button class="type-chip on" data-note="">全部</button>
            <button class="type-chip" data-note="has">有備注</button>
            <button class="type-chip" data-note="none">無備注</button>
          </div>
        </div>
        <div class="chip-group" id="reason-filter-group" style="display:none">
          <span class="chip-label">排除原因</span>
          <div class="type-chips" id="reason-chips">
            <button class="type-chip on" data-rfilter="">全部</button>
            <button class="type-chip" data-rfilter="轉至其他診所">轉至其他診所</button>
            <button class="type-chip" data-rfilter="轉至大醫院追蹤">轉至大醫院追蹤</button>
            <button class="type-chip" data-rfilter="不願繼續用藥">不願繼續用藥</button>
            <button class="type-chip" data-rfilter="病患已過世">病患已過世</button>
            <button class="type-chip" data-rfilter="已自行停藥">已自行停藥</button>
            <button class="type-chip" data-rfilter="長期未回應">長期未回應</button>
            <button class="type-chip" data-rfilter="已結案">已結案</button>
            <button class="type-chip" data-rfilter="其他">其他</button>
          </div>
        </div>
      </div>

      <div class="list-area" id="list-scroll">
        <div id="list-return">
          <div class="tab-hint tab-hint-warn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>這些病患需要回診抽血，才能繼續下一個MSPT階段。請電話通知安排回診並抽血。</span>
          </div>
          <div id="list-return-rows"><div class="sec-empty">載入中…</div></div>
        </div>
        <div id="list-phone" style="display:none">
          <div class="tab-hint tab-hint-info">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 11.9 19.79 19.79 0 0 1 1.61 3.27 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.56a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg>
            <span>這些病患不需要回診抽血，電話聯繫後即可直接完成並待登VPN。</span>
          </div>
          <div id="list-phone-rows"><div class="sec-empty">載入中…</div></div>
        </div>
        <div id="list-submittable" style="display:none"></div>
        <div id="list-submitted" style="display:none"></div>
        <div id="list-inactive" style="display:none"></div>
        <div id="list-contacted" style="display:none"></div>
        <div id="list-hold" style="display:none"></div>
        <div id="list-excluded" style="display:none"></div>
      </div>

    </div>
  </div>
</div>

<!-- Contact modal (for 需回診 tab — general contact only) -->
<div class="modal-overlay" id="modal-contact">
  <div class="modal-box">
    <div class="modal-title" id="modal-contact-title">聯絡病患</div>
    <div class="modal-sub" id="modal-contact-sub"></div>
    <div class="modal-field">
      <label class="modal-label">聯絡方式</label>
      <select class="modal-select" id="modal-contact-type">
        <option value="contacted">已聯繫（直接通知）</option>
        <option value="called">已二次確認（電話通話）</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">備註（選填）</label>
      <textarea class="modal-input" id="modal-contact-note" rows="2" placeholder="例：預約回診日期"></textarea>
    </div>
    <div class="modal-error" id="contact-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-contact')">取消</button>
      <button class="act-btn act-primary" id="btn-contact-confirm">確認送出</button>
    </div>
  </div>
</div>

<!-- Phone-complete modal -->
<div class="modal-overlay" id="modal-phone">
  <div class="modal-box">
    <div class="modal-title" id="modal-phone-title">電話聯繫並完成</div>
    <div class="modal-sub" id="modal-phone-sub"></div>
    <div class="modal-field" id="modal-phone-blood-wrap" style="display:none">
      <div id="modal-phone-blood" class="modal-hint"></div>
    </div>
    <div class="modal-field">
      <label class="modal-label">聯絡方式</label>
      <select class="modal-select" id="modal-phone-type">
        <option value="contacted">已聯繫（直接通知）</option>
        <option value="called">已二次確認（電話通話）</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">備註（選填）</label>
      <textarea class="modal-input" id="modal-phone-note" rows="2" placeholder="例：已通知病患"></textarea>
    </div>
    <div class="modal-error" id="phone-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-phone')">取消</button>
      <button class="act-btn act-primary" id="btn-phone-confirm">完成並待登VPN</button>
    </div>
  </div>
</div>

<!-- Blood invalid confirm modal -->
<div class="modal-overlay" id="modal-blood-invalid">
  <div class="modal-box">
    <div class="modal-title">送回需回診</div>
    <div class="modal-sub" id="modal-blood-invalid-sub"></div>
    <p style="font-size:13px;color:var(--text);margin:0 0 16px;line-height:1.6">血液報告結果無效或無法使用，將此病患送回「需回診」名單，重新安排抽血。</p>
    <div class="modal-error" id="blood-invalid-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-blood-invalid')">取消</button>
      <button class="act-btn act-warn" id="btn-blood-invalid-confirm">確認送回</button>
    </div>
  </div>
</div>

<!-- VPN submit confirm modal -->
<div class="modal-overlay" id="modal-vpn">
  <div class="modal-box">
    <div class="modal-title">確認待登VPN</div>
    <div class="modal-sub" id="modal-vpn-sub"></div>
    <div class="modal-field" style="margin-top:4px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px">
        <input type="checkbox" id="modal-vpn-blood" style="width:16px;height:16px;cursor:pointer">
        <span>此次使用血液檢驗紀錄</span>
      </label>
    </div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-vpn')">取消</button>
      <button class="act-btn act-primary" id="btn-vpn-confirm">已登VPN</button>
    </div>
  </div>
</div>

<!-- Hold modal -->
<div class="modal-overlay" id="modal-hold">
  <div class="modal-box">
    <div class="modal-title">設定暫緩</div>
    <div class="modal-sub" id="modal-hold-sub"></div>
    <div class="modal-field">
      <label class="modal-label">備註</label>
      <textarea class="modal-input" id="modal-hold-note" rows="2" placeholder="例：出國旅遊，三個月後聯絡"></textarea>
    </div>
    <div class="modal-error" id="hold-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-hold')">取消</button>
      <button class="act-btn act-warn" id="btn-hold-confirm">設定暫緩</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="modal-exclude">
  <div class="modal-box">
    <div class="modal-title">排除病患</div>
    <div class="modal-sub" id="modal-exclude-sub"></div>
    <div class="modal-field">
      <label class="modal-label">排除原因</label>
      <div class="reason-chips" id="exclude-chips">
        <button class="reason-chip" data-reason="轉至其他診所">轉至其他診所</button>
        <button class="reason-chip" data-reason="轉至大醫院追蹤">轉至大醫院追蹤</button>
        <button class="reason-chip" data-reason="不願繼續用藥">不願繼續用藥</button>
        <button class="reason-chip" data-reason="病患已過世">病患已過世</button>
        <button class="reason-chip" data-reason="已自行停藥">已自行停藥</button>
        <button class="reason-chip" data-reason="已結案">已結案</button>
        <button class="reason-chip" data-reason="其他">其他</button>
      </div>
      <div id="case-date-wrap" style="display:none;margin-top:8px">
        <label class="modal-label" style="margin-bottom:4px">結案日期</label>
        <div class="mdp-wrap">
          <button type="button" class="mdp-trigger" id="btn-exclude-case" onclick="mdpToggle('exclude')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="disp-exclude-case">選擇日期</span>
          </button>
          <div class="pick-drop cal-drop" id="drop-exclude-case" style="display:none"></div>
        </div>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">備註（選填）</label>
      <textarea class="modal-input" id="modal-exclude-note" rows="2" placeholder="選填備註"></textarea>
    </div>
    <div class="modal-error" id="exclude-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-exclude')">取消</button>
      <button class="act-btn act-danger" id="btn-exclude-confirm">確認排除</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-edit-reason">
  <div class="modal-box">
    <div class="modal-title">編輯排除原因</div>
    <div class="modal-sub" id="modal-edit-reason-sub"></div>
    <div class="modal-field">
      <label class="modal-label">排除原因</label>
      <div class="reason-chips" id="edit-reason-chips">
        <button class="reason-chip" data-reason="轉至其他診所">轉至其他診所</button>
        <button class="reason-chip" data-reason="轉至大醫院追蹤">轉至大醫院追蹤</button>
        <button class="reason-chip" data-reason="不願繼續用藥">不願繼續用藥</button>
        <button class="reason-chip" data-reason="病患已過世">病患已過世</button>
        <button class="reason-chip" data-reason="已自行停藥">已自行停藥</button>
        <button class="reason-chip" data-reason="長期未回應">長期未回應</button>
        <button class="reason-chip" data-reason="已結案">已結案</button>
        <button class="reason-chip" data-reason="其他">其他</button>
      </div>
      <div id="edit-case-date-wrap" style="display:none;margin-top:8px">
        <label class="modal-label" style="margin-bottom:4px">結案日期</label>
        <div class="mdp-wrap">
          <button type="button" class="mdp-trigger" id="btn-edit-case" onclick="mdpToggle('edit')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="disp-edit-case">選擇日期</span>
          </button>
          <div class="pick-drop cal-drop" id="drop-edit-case" style="display:none"></div>
        </div>
      </div>
    </div>
    <div class="modal-field">
      <label class="modal-label">備註（選填）</label>
      <textarea class="modal-input" id="modal-edit-reason-note" rows="2" placeholder="選填備註"></textarea>
    </div>
    <div class="modal-error" id="edit-reason-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-edit-reason')">取消</button>
      <button class="act-btn act-primary" id="btn-edit-reason-confirm">儲存</button>
    </div>
  </div>
</div>

<script>
// ── Modal date picker ──────────────────────────────────────────────────────
var _mdp = {
  exclude: { y:0, m:0, d:0, navY:0, navM:0, iso:'' },
  edit:    { y:0, m:0, d:0, navY:0, navM:0, iso:'' }
};
function _mdpTodayInit(s) {
  var t = new Date();
  s.y = t.getFullYear(); s.m = t.getMonth()+1; s.d = t.getDate();
  s.navY = s.y; s.navM = s.m;
  s.iso = s.y + '-' + String(s.m).padStart(2,'0') + '-' + String(s.d).padStart(2,'0');
}
function _mdpDisp(id) {
  document.getElementById('disp-' + id + '-case').textContent = _mdp[id].iso || '選擇日期';
}
function _mdpRender(id) {
  var s = _mdp[id];
  var drop = document.getElementById('drop-' + id + '-case');
  var t = new Date(), daysInMon = new Date(s.navY, s.navM, 0).getDate(), firstDow = new Date(s.navY, s.navM-1, 1).getDay();
  var cells = '';
  for (var b = 0; b < firstDow; b++) cells += '<button class="cal-day cal-other" disabled></button>';
  for (var d = 1; d <= daysInMon; d++) {
    var isTod = s.navY===t.getFullYear() && s.navM===t.getMonth()+1 && d===t.getDate();
    var isSel = s.y===s.navY && s.m===s.navM && s.d===d;
    cells += '<button class="cal-day' + (isSel?' cal-sel':isTod?' cal-today':'') + '" onclick="mdpSelect(\''+id+'\','+d+')">'+d+'</button>';
  }
  drop.innerHTML = '<div class="cal-head">' +
    '<button class="cal-nav-btn" onclick="mdpNav(\''+id+'\',-1)">‹</button>' +
    '<span class="cal-month-lbl">'+s.navY+' 年 '+s.navM+' 月</span>' +
    '<button class="cal-nav-btn" onclick="mdpNav(\''+id+'\',1)">›</button>' +
    '</div><div class="cal-grid">' +
    ['日','一','二','三','四','五','六'].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('') +
    cells + '</div>';
}
window.mdpToggle = function(id) {
  var drop = document.getElementById('drop-' + id + '-case');
  var btn  = document.getElementById('btn-' + id + '-case');
  if (drop.style.display === 'none') {
    if (!_mdp[id].y) _mdpTodayInit(_mdp[id]);
    _mdpRender(id);
    drop.style.display = '';
    btn.classList.add('open');
  } else {
    drop.style.display = 'none';
    btn.classList.remove('open');
  }
};
window.mdpNav = function(id, dir) {
  var s = _mdp[id]; s.navM += dir;
  if (s.navM > 12) { s.navM = 1; s.navY++; } else if (s.navM < 1) { s.navM = 12; s.navY--; }
  _mdpRender(id);
};
window.mdpSelect = function(id, d) {
  var s = _mdp[id]; s.y = s.navY; s.m = s.navM; s.d = d;
  s.iso = s.y + '-' + String(s.m).padStart(2,'0') + '-' + String(s.d).padStart(2,'0');
  _mdpDisp(id);
  document.getElementById('drop-' + id + '-case').style.display = 'none';
  document.getElementById('btn-' + id + '-case').classList.remove('open');
};
document.addEventListener('click', function(ev) {
  ['exclude','edit'].forEach(function(id) {
    var drop = document.getElementById('drop-' + id + '-case');
    var btn  = document.getElementById('btn-' + id + '-case');
    if (drop && btn && drop.style.display !== 'none' && !drop.contains(ev.target) && !btn.contains(ev.target)) {
      drop.style.display = 'none'; btn.classList.remove('open');
    }
  });
});
</script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _tab = 'return', _query = '', _stageFilter = '', _noteFilter = '', _reasonFilter = '';
  var _NOTE_TABS = ['hold', 'excluded'];
  var _return = [], _phone = [], _submittable = [], _submitted = [], _inactive = [], _contacted = [], _hold = [], _excluded = [];
  var _activeMap = {}, _contactedMap = {}, _holdMap = {}, _excludedMap = {};
  // entry stashed for modal confirm
  var _modalEntry = null, _excludeEntry = null, _submitEntry = null, _editExclEntry = null;
  var _filterOpen = false;

  function _filterBadgeCount() {
    return (_stageFilter ? 1 : 0) + (_noteFilter ? 1 : 0) + (_reasonFilter ? 1 : 0);
  }
  function _updateFilterBadge() {
    var n = _filterBadgeCount();
    var b = document.getElementById('filter-badge');
    b.textContent = n; b.style.display = n ? '' : 'none';
    document.getElementById('btn-filter').classList.toggle('on', _filterOpen || n > 0);
  }
  function _toggleFilter() {
    _filterOpen = !_filterOpen;
    document.getElementById('filter-panel').style.display = _filterOpen ? '' : 'none';
    document.getElementById('btn-filter').classList.toggle('on', _filterOpen || _filterBadgeCount() > 0);
  }
  document.getElementById('btn-filter').addEventListener('click', _toggleFilter);
  var _exclSort = { col: 'date', dir: 'desc' };
  // charts where all prior MSPT stages were tracked through dashboard
  var _completedSet = {};  // {chart_number: Set of completed stages}

  function _buildCompletedSet(msptCompleted) {
    var s = {};
    (msptCompleted || []).forEach(function(c) {
      var chart = c.patient ? c.patient.chart_number : c.chart_number;
      if (chart && c.mspt_stage) {
        if (!s[chart]) s[chart] = {};
        s[chart][c.mspt_stage] = true;
      }
    });
    return s;
  }

  function isPriorTracked(chart, stage) {
    var stages = _completedSet[chart] || {};
    if (stage === '追2') return !!stages['追1'];
    if (stage === '追3') return !!(stages['追1'] && stages['追2']);
    return false;
  }

  var ALL_TABS = ['return','phone','submittable','submitted','inactive','contacted','hold','excluded'];

  function applyReport(r) {
    _completedSet = _buildCompletedSet(r.mspt_completed);
    var allFollowups = r.mspt_followups || [];
    _return = allFollowups.filter(function (e) { return e.needs_blood_test; });
    _phone  = allFollowups.filter(function (e) { return !e.needs_blood_test; });
    _submittable = (r.mspt_submittable || []).slice().sort(function(a,b){ return String(b.blood_report_date||'').localeCompare(String(a.blood_report_date||'')); });
    _submitted   = (r.submitted || []).slice().sort(function(a,b){ return String(b.submitted_at||'').localeCompare(String(a.submitted_at||'')); });
    _inactive    = r.mspt_inactive    || [];
    _contacted   = (r.contacted || []).filter(function (e) { return e.category === '代謝症候群'; })
                    .concat((r.called || []).filter(function (e) { return e.category === '代謝症候群'; }))
                    .sort(function(a,b){
                      var ka = String(a.contacted_at||'') + (a.contacted_time||'');
                      var kb = String(b.contacted_at||'') + (b.contacted_time||'');
                      return kb < ka ? -1 : kb > ka ? 1 : 0;
                    });
    _hold        = (r.on_hold || []).filter(function (e) { return e.category === '代謝症候群'; });

    _activeMap = {};
    allFollowups.forEach(function (e) { _activeMap[e.patient.chart_number] = e; });
    _inactive.forEach(function (e)   { _activeMap[e.patient.chart_number] = e; });
    _contactedMap = {}; _contacted.forEach(function (e) { _contactedMap[e.patient.chart_number] = e; });
    _holdMap      = {}; _hold.forEach(function (e) { if (e.patient) _holdMap[e.patient.chart_number] = e; });

    var totalPending = allFollowups.length + _inactive.length;
    document.getElementById('page-date').textContent = L.fmtChineseDate() + '  ·  共 ' + totalPending + ' 人待追蹤';
    document.getElementById('cnt-return').textContent      = _return.length;
    document.getElementById('cnt-phone').textContent       = _phone.length;
    document.getElementById('cnt-submittable').textContent = _submittable.length;
    document.getElementById('cnt-submitted').textContent   = _submitted.length || '';
    document.getElementById('cnt-inactive').textContent    = _inactive.length;
    document.getElementById('cnt-contacted').textContent   = _contacted.length;
    _excluded = (r.excluded || []).filter(function (e) { return e.category === '代謝症候群'; });
    _excludedMap = {}; _excluded.forEach(function (e) { _excludedMap[e.patient.chart_number] = e; });
    document.getElementById('cnt-hold').textContent        = _hold.length;
    document.getElementById('cnt-excluded').textContent    = _excluded.length;

    var banner = document.getElementById('sub-banner');
    if (_submittable.length) { banner.style.display = 'flex'; document.getElementById('sub-count').textContent = _submittable.length; }
    else { banner.style.display = 'none'; }

    renderAll();
    L.updateBadges(r, null);
    L.updateLastUpdated();
  }

  function load() {
    L.hideError();
    var today = L.localDateStr();
    L.getReport(today, applyReport).then(applyReport)
      .catch(function (e) { L.showError('資料載入失敗 — ' + (e.message || '')); });
  }

  // After a successful write action: re-render immediately with current local
  // state, then fetch fresh data in the background to correct any discrepancy.
  function _refreshBg() {
    renderAll();
    L.clearReportCache();
    L.getReport(L.localDateStr(), applyReport).then(applyReport).catch(function(){});
  }

  function _removeFromActive(chartNum) {
    _return = _return.filter(function(e) { return e.patient.chart_number !== chartNum; });
    _phone  = _phone.filter(function(e)  { return e.patient.chart_number !== chartNum; });
    delete _activeMap[chartNum];
  }

  function match(entry) {
    if (_stageFilter && entry.mspt_stage !== _stageFilter) return false;
    if (_noteFilter) {
      var hasNote = !!(entry.note && entry.note.trim());
      if (_noteFilter === 'has' && !hasNote) return false;
      if (_noteFilter === 'none' && hasNote) return false;
    }
    if (!_query) return true;
    var q = _query.toLowerCase(), p = entry.patient || {};
    return (p.name && p.name.toLowerCase().includes(q)) ||
           (p.chart_number && String(p.chart_number).toLowerCase().includes(q));
  }

  function returnRow(e) {
    var tags = [];
    if (e.call_required) tags.push('<span class="pbadge b-call">第2次</span>');
    tags.push('<span class="pbadge b-prog">需抽血</span>');
    if (isPriorTracked(e.patient.chart_number, e.mspt_stage)) tags.push('<span class="pbadge b-done">已追蹤</span>');
    return L.patientRow({ entry: e, tags: tags,
      actions: [
        { label: '已聯繫', cls: 'act-primary', key: 'contact' },
        { label: '暫緩',   cls: 'act-warn',    key: 'hold' },
      ],
      more: [{ label: '排除', key: 'exclude', cls: 'item-danger' }],
    });
  }

  function phoneRow(e) {
    var tags = [];
    if (e.call_required) tags.push('<span class="pbadge b-call">第2次</span>');
    if (e.blood_draw_date) {
      tags.push('<span class="pbadge b-done" title="' + L.escHtml(e.blood_draw_date) + ' 有血液報告（是否可用請確認）">有血液報告</span>');
    }
    if (isPriorTracked(e.patient.chart_number, e.mspt_stage)) tags.push('<span class="pbadge b-done">已追蹤</span>');
    return L.patientRow({ entry: e, tags: tags, actions: [
      { label: '完成', cls: 'act-primary', key: 'phone-complete' },
      { label: '暫緩', cls: 'act-warn',    key: 'hold' },
    ], more: [
      { label: '送回需回診', key: 'blood-invalid', cls: '' },
      { label: '排除', key: 'exclude', cls: 'item-danger' },
    ]});
  }

  function submittableRow(e) {
    var adapted = {
      patient: e.patient, category: '代謝症候群',
      mspt_stage: e.mspt_stage, due_date: e.blood_report_date,
      days_overdue: 0, last_visit_date: null,
    };
    var tags = ['<span class="pbadge b-sub">' + L.escHtml(e.mspt_stage) + '</span>'];
    if (isPriorTracked(e.patient.chart_number, e.mspt_stage)) tags.push('<span class="pbadge b-done">已追蹤</span>');
    return L.patientRow({ entry: adapted, tags: tags,
      actions: [
        { label: '已登VPN', cls: 'act-purple', key: 'submit' },
        { label: '撤銷',    cls: '',           key: 'undo-phone' },
      ],
    });
  }

  function submittedRow(e) {
    return L.patientRow({
      entry: {
        patient: e.patient, category: '代謝症候群',
        mspt_stage: e.mspt_stage, due_date: e.submitted_at,
        days_overdue: 0, last_visit_date: null,
      },
      tags: ['<span class="pbadge b-sub">' + L.escHtml(e.mspt_stage) + '</span>'],
      actions: [],
    });
  }

  function inactiveRow(e) {
    var tags = [];
    if (e.call_required) tags.push('<span class="pbadge b-call">第2次</span>');
    tags.push('<span class="pbadge b-hold">未複診</span>');
    if (e.needs_blood_test) tags.push('<span class="pbadge b-prog">需抽血</span>');
    else if (e.blood_draw_date) tags.push('<span class="pbadge b-done">有血液報告</span>');
    return L.patientRow({ entry: e, tags: tags, actions: [
      { label: '已聯繫', cls: 'act-primary', key: 'contact' },
      { label: '暫緩',   cls: 'act-warn',    key: 'hold' },
    ], more: [{ label: '排除', key: 'exclude', cls: 'item-danger' }]});
  }

  function contactedRow(e) {
    return L.patientRow({ entry: e,
      tags: ['<span class="pbadge b-done">已聯繫</span>'],
      actions: [{ label: '撤銷', cls: '', key: 'undo-contact' }],
    });
  }

  function holdRow(e) {
    var note = e.note || '暫緩';
    var adapted = {
      patient: e.patient || { chart_number: 'hold-' + e.hold_id, name: e.manual_name || '?', birth_date: '' },
      category: '代謝症候群', mspt_stage: e.mspt_stage || null,
      due_date: e.due_date || null, last_visit_date: e.last_visit_date || null, days_overdue: e.days_overdue || 0,
    };
    return L.patientRow({ entry: adapted,
      tags: ['<span class="pbadge b-hold">' + L.escHtml(note.length > 14 ? note.slice(0,14)+'…' : note) + '</span>'],
      actions: [{ label: '解除暫緩', cls: '', key: 'undo-hold' }],
    });
  }

  function renderList(entries, renderFn, id, headerFix) {
    var filtered = entries.filter(match);
    var el = document.getElementById(id);
    if (!filtered.length) {
      el.innerHTML = '<div class="sec-empty">' + (entries.length ? '沒有符合搜尋條件' : '目前沒有記錄') + '</div>';
    } else {
      var html = L.patientTable(filtered.map(renderFn).join(''));
      if (headerFix) html = html.replace(headerFix[0], headerFix[1]);
      el.innerHTML = html;
    }
    if (_tab === id.replace('list-', ''))
      document.getElementById('result-count').textContent = '共 ' + filtered.length + ' 筆';
  }

  function renderHintTab(entries, renderFn, rowsId, emptyMsg) {
    var filtered = entries.filter(match);
    var el = document.getElementById(rowsId);
    if (!filtered.length) {
      el.innerHTML = '<div class="sec-empty">' + (entries.length ? '沒有符合搜尋條件' : emptyMsg) + '</div>';
    } else {
      el.innerHTML = L.patientTable(filtered.map(renderFn).join(''));
    }
    var tabKey = rowsId.replace('-rows', '').replace('list-', '');
    if (_tab === tabKey)
      document.getElementById('result-count').textContent = '共 ' + filtered.length + ' 筆';
  }


  function excludedRow(e) {
    var chart   = L.escHtml(e.patient.chart_number);
    var name    = L.escHtml(e.patient.name);
    var reason  = L.escHtml(e.reason || '');
    var note    = e.note ? ' <span style="color:var(--muted)">— ' + L.escHtml(e.note) + '</span>' : '';
    var autoTag = e.auto ? '<span class="pbadge b-hold" style="font-size:10px;padding:1px 6px;margin-right:4px">自動</span>' : '';
    var date    = e.excluded_at ? String(e.excluded_at).slice(0,10) : '';
    return '<tr class="pr" data-chart="' + chart + '">' +
      '<td style="color:var(--sub);font-size:12px"><span class="pr-copy" data-copy="' + chart + '" style="cursor:pointer;border-bottom:1px dashed var(--border)">' + chart + '</span></td>' +
      '<td style="font-weight:600">' + autoTag + name + '</td>' +
      '<td style="font-size:12px">' + reason + note + '</td>' +
      '<td style="font-size:12px;color:var(--sub)">' + date + '</td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="act-btn" data-action="edit-reason" style="margin-right:6px">編輯原因</button>' +
        '<button class="act-btn" data-action="restore">恢復追蹤</button>' +
      '</td>' +
      '</tr>';
  }
  function _exclSortArrow(col) {
    if (_exclSort.col !== col) return '<span style="opacity:.3;margin-left:3px">↕</span>';
    return '<span style="margin-left:3px">' + (_exclSort.dir === 'asc' ? '↑' : '↓') + '</span>';
  }
  function _sortExcluded(arr) {
    return arr.slice().sort(function(a, b) {
      var dir = _exclSort.dir === 'asc' ? 1 : -1;
      if (_exclSort.col === 'name') return dir * a.patient.name.localeCompare(b.patient.name, 'zh-TW');
      if (_exclSort.col === 'reason') return dir * (a.reason || '').localeCompare(b.reason || '', 'zh-TW');
      var da = String(a.excluded_at || ''), db = String(b.excluded_at || '');
      return dir * (da < db ? -1 : da > db ? 1 : 0);
    });
  }
  function renderExcluded() {
    var filtered = _sortExcluded(_excluded.filter(function(e) {
      if (!match(e)) return false;
      if (_reasonFilter) {
        var r = e.reason || '';
        if (_reasonFilter === '已結案' ? !r.startsWith('已結案') : r !== _reasonFilter) return false;
      }
      return true;
    }));
    var el = document.getElementById('list-excluded');
    if (!filtered.length) {
      el.innerHTML = '<div class="sec-empty">' + (_excluded.length ? '沒有符合搜尋條件的病患' : '尚無排除記錄') + '</div>';
    } else {
      el.innerHTML = '<div class="ptbl-wrap"><table class="p-table" style="table-layout:fixed">' +
        '<colgroup><col style="width:115px"><col><col style="width:160px"><col style="width:90px"><col style="width:200px"></colgroup>' +
        '<thead><tr>' +
          '<th>身份證</th>' +
          '<th data-sort-col="name" style="cursor:pointer;user-select:none">姓名' + _exclSortArrow('name') + '</th>' +
          '<th data-sort-col="reason" style="cursor:pointer;user-select:none">排除原因' + _exclSortArrow('reason') + '</th>' +
          '<th data-sort-col="date" style="cursor:pointer;user-select:none">排除日期' + _exclSortArrow('date') + '</th>' +
          '<th></th>' +
        '</tr></thead>' +
        '<tbody>' + filtered.map(excludedRow).join('') + '</tbody></table></div>';
    }
    if (_tab === 'excluded')
      document.getElementById('result-count').textContent = '共 ' + filtered.length + ' 筆';
  }
  function renderAll() {
    renderHintTab(_return, returnRow, 'list-return-rows', '目前沒有需要回診抽血的病患');
    renderHintTab(_phone,  phoneRow,  'list-phone-rows',  '目前沒有可電話完成的病患');
    renderList(_submittable, submittableRow, 'list-submittable', ['>到期日 <span', '>完成日期 <span']);
    renderList(_submitted, submittedRow, 'list-submitted', ['>到期日 <span', '>申報日 <span']);
    renderList(_inactive,    inactiveRow,    'list-inactive');
    renderList(_contacted,   contactedRow,   'list-contacted');
    renderList(_hold,        holdRow,        'list-hold');
    renderExcluded();
  }

  function _updateCtxFilters(tab) {
    var showNote = _NOTE_TABS.indexOf(tab) >= 0;
    document.getElementById('note-filter-group').style.display = showNote ? '' : 'none';
    document.getElementById('reason-filter-group').style.display = tab === 'excluded' ? '' : 'none';
  }

  function _resetCtxFilters() {
    _noteFilter = ''; _reasonFilter = '';
    document.querySelectorAll('#note-chips .type-chip').forEach(function(c){ c.classList.toggle('on', c.dataset.note === ''); });
    document.querySelectorAll('#reason-chips .type-chip').forEach(function(c){ c.classList.toggle('on', c.dataset.rfilter === ''); });
    _updateFilterBadge();
  }

  document.addEventListener('click', function(ev) {
    if (_filterOpen && !ev.target.closest('#filter-panel') && !ev.target.closest('#btn-filter') &&
        !ev.target.closest('.mdp-wrap')) {
      _filterOpen = false;
      document.getElementById('filter-panel').style.display = 'none';
      document.getElementById('btn-filter').classList.toggle('on', _filterBadgeCount() > 0);
    }
  });

  document.getElementById('filter-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-tab'); if (!btn) return;
    _tab = btn.dataset.tab;
    try { sessionStorage.setItem('mspt_active_tab', _tab); } catch(ex) {}
    document.querySelectorAll('.filter-tab').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    ALL_TABS.forEach(function (t) {
      document.getElementById('list-' + t).style.display = t === _tab ? '' : 'none';
    });
    _resetCtxFilters();
    _updateCtxFilters(_tab);
    var counts = {
      return: _return, phone: _phone, submittable: _submittable, submitted: _submitted,
      inactive: _inactive, contacted: _contacted, hold: _hold, excluded: _excluded,
    };
    document.getElementById('result-count').textContent = '共 ' + (counts[_tab] || []).filter(match).length + ' 筆';
  });

  document.getElementById('search-input').addEventListener('input', function (e) { _query = e.target.value.trim(); renderAll(); });

  document.getElementById('type-chips').addEventListener('click', function(ev) {
    var chip = ev.target.closest('.type-chip'); if (!chip) return;
    _stageFilter = chip.dataset.stage;
    document.querySelectorAll('#type-chips .type-chip').forEach(function(c){ c.classList.remove('on'); });
    chip.classList.add('on');
    _updateFilterBadge(); renderAll();
  });

  document.getElementById('note-chips').addEventListener('click', function(ev) {
    var chip = ev.target.closest('.type-chip'); if (!chip) return;
    _noteFilter = chip.dataset.note;
    document.querySelectorAll('#note-chips .type-chip').forEach(function(c){ c.classList.remove('on'); });
    chip.classList.add('on');
    _updateFilterBadge(); renderAll();
  });

  document.getElementById('reason-chips').addEventListener('click', function(ev) {
    var chip = ev.target.closest('.type-chip'); if (!chip) return;
    _reasonFilter = chip.dataset.rfilter;
    document.querySelectorAll('#reason-chips .type-chip').forEach(function(c){ c.classList.remove('on'); });
    chip.classList.add('on');
    _updateFilterBadge(); renderExcluded();
  });

  document.getElementById('list-scroll').addEventListener('click', function (ev) {
    var th = ev.target.closest('th[data-sort-col]');
    if (th) {
      var col = th.dataset.sortCol;
      if (_exclSort.col === col) _exclSort.dir = _exclSort.dir === 'asc' ? 'desc' : 'asc';
      else { _exclSort.col = col; _exclSort.dir = col === 'date' ? 'desc' : 'asc'; }
      renderExcluded(); return;
    }
    var btn = ev.target.closest('[data-action]'); if (!btn) return;
    var action = btn.dataset.action, row = btn.closest('.pr'); if (!row) return;
    var chart = row.dataset.chart;

    if (action === 'contact') {
      var entry = _activeMap[chart]; if (!entry) return;
      _modalEntry = entry;
      document.getElementById('modal-contact-title').textContent = '聯絡 ' + entry.patient.name;
      document.getElementById('modal-contact-sub').textContent =
        '身份證 #' + entry.patient.chart_number + ' · 階段 ' + (entry.mspt_stage || '') + '（需通知回診抽血）';
      document.getElementById('modal-contact-note').value = '';
      document.getElementById('contact-error').classList.remove('show');
      L.showModal('modal-contact');

    } else if (action === 'phone-complete') {
      var entry2 = _activeMap[chart]; if (!entry2) return;
      btn.disabled = true;
      L.apiAction('POST', '/api/mspt-phone-complete', { entry: entry2, nurse: L.getNurse() })
        .then(function () {
          L.showToast('已完成，進入可申報佇列');
          _removeFromActive(entry2.patient.chart_number);
          _refreshBg();
        })
        .catch(function (e) { L.showToast('操作失敗：' + (e.message || ''), 'error'); btn.disabled = false; });

    } else if (action === 'blood-invalid') {
      var bEntry = _activeMap[chart]; if (!bEntry) return;
      _modalEntry = bEntry;
      document.getElementById('modal-blood-invalid-sub').textContent = bEntry.patient.name + ' · ' + (bEntry.mspt_stage || '');
      document.getElementById('blood-invalid-error').classList.remove('show');
      document.getElementById('btn-blood-invalid-confirm').disabled = false;
      L.showModal('modal-blood-invalid');

    } else if (action === 'hold') {
      var entry3 = _activeMap[chart]; if (!entry3) return;
      _modalEntry = entry3;
      document.getElementById('modal-hold-sub').textContent = entry3.patient.name + ' · ' + (entry3.mspt_stage || '');
      document.getElementById('modal-hold-note').value = '';
      document.getElementById('hold-error').classList.remove('show');
      L.showModal('modal-hold');

    } else if (action === 'submit') {
      var se = _submittable.find(function (e) { return e.patient.chart_number === chart; });
      if (!se) return;
      _submitEntry = se;
      document.getElementById('modal-vpn-sub').textContent = se.patient.name + ' · ' + (se.mspt_stage || '');
      document.getElementById('modal-vpn-blood').checked = false;
      L.showModal('modal-vpn');

    } else if (action === 'undo-phone') {
      var se2 = _submittable.find(function (e) { return e.patient.chart_number === chart; });
      if (!se2) return;
      btn.disabled = true;
      L.apiAction('DELETE', '/api/submitted', { chart_number: se2.patient.chart_number, mspt_stage: se2.mspt_stage })
        .then(function () {
          L.showToast('已撤銷完成記錄');
          _submittable = _submittable.filter(function(e) { return e.patient.chart_number !== chart; });
          _refreshBg();
        })
        .catch(function (e) { L.showToast('撤銷失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });

    } else if (action === 'undo-contact') {
      var ce = _contactedMap[chart]; if (!ce) return;
      btn.disabled = true;
      L.apiAction('DELETE', '/api/contacted', { chart_number: ce.patient.chart_number, category: ce.category, due_date: ce.due_date })
        .then(function () {
          L.showToast('已撤銷聯絡記錄');
          _contacted = _contacted.filter(function(e) { return e.patient.chart_number !== chart; });
          delete _contactedMap[chart];
          _refreshBg();
        })
        .catch(function (e) { L.showToast('撤銷失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });

    } else if (action === 'undo-hold') {
      var he = _holdMap[chart]; if (!he) return;
      btn.disabled = true;
      L.apiAction('DELETE', '/api/on-hold', { hold_id: he.hold_id })
        .then(function () {
          L.showToast('已解除暫緩');
          _hold = _hold.filter(function(e) { return e.patient.chart_number !== chart; });
          delete _holdMap[chart];
          _refreshBg();
        })
        .catch(function (e) { L.showToast('解除失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });
    } else if (action === 'exclude') {
      var excEntry = _activeMap[chart]; if (!excEntry) return;
      _excludeEntry = excEntry;
      document.getElementById('modal-exclude-sub').textContent = excEntry.patient.name + ' — 排除後不再出現於追蹤清單';
      document.getElementById('modal-exclude-note').value = '';
      document.getElementById('exclude-error').classList.remove('show');
      document.querySelectorAll('#exclude-chips .reason-chip').forEach(function (c) { c.classList.remove('selected'); });
      document.getElementById('case-date-wrap').style.display = 'none';
      _mdpTodayInit(_mdp.exclude); _mdpDisp('exclude');
      L.showModal('modal-exclude');
    } else if (action === 'edit-reason') {
      var er = _excludedMap[chart]; if (!er) return;
      _editExclEntry = er;
      document.getElementById('modal-edit-reason-sub').textContent = er.patient.name + ' — 修改排除原因';
      document.getElementById('modal-edit-reason-note').value = er.note || '';
      document.getElementById('edit-reason-error').classList.remove('show');
      document.querySelectorAll('#edit-reason-chips .reason-chip').forEach(function (c) {
        c.classList.toggle('selected', c.dataset.reason === er.reason || er.reason.startsWith('已結案'));
      });
      var isCase = er.reason.startsWith('已結案');
      document.getElementById('edit-case-date-wrap').style.display = isCase ? '' : 'none';
      _mdpTodayInit(_mdp.edit); _mdpDisp('edit');
      L.showModal('modal-edit-reason');
    } else if (action === 'restore') {

      var rx = _excludedMap[chart]; if (!rx) return;
      btn.disabled = true;
      var restoreUrl = rx.auto ? '/api/auto-excluded' : '/api/excluded';
      L.apiAction('DELETE', restoreUrl, { chart_number: rx.patient.chart_number, category: rx.category })
        .then(function () {
          L.showToast('已恢復追蹤：' + rx.patient.name);
          _excluded = _excluded.filter(function(e) { return e.patient.chart_number !== chart; });
          delete _excludedMap[chart];
          _refreshBg();
        })
        .catch(function (e) { L.showToast('恢復失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });
    }
  });

  document.getElementById('btn-contact-confirm').addEventListener('click', function () {
    var entry = _modalEntry; if (!entry) return;
    var url = document.getElementById('modal-contact-type').value === 'called' ? '/api/called' : '/api/contacted';
    var confirmBtn = this, errEl = document.getElementById('contact-error');
    errEl.classList.remove('show'); confirmBtn.disabled = true;
    L.apiAction('POST', url, { entry: entry, nurse: L.getNurse() })
      .then(function () {
        L.hideModal('modal-contact'); L.showToast('聯絡記錄已儲存');
        var chart = entry.patient.chart_number;
        _removeFromActive(chart);
        var ce = { patient: entry.patient, category: '代謝症候群', due_date: entry.due_date, note: '' };
        _contacted.push(ce); _contactedMap[chart] = ce;
        _refreshBg();
      })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });


  document.getElementById('btn-blood-invalid-confirm').addEventListener('click', function () {
    var entry = _modalEntry; if (!entry) return;
    var confirmBtn = this, errEl = document.getElementById('blood-invalid-error');
    errEl.classList.remove('show'); confirmBtn.disabled = true;
    L.apiAction('POST', '/api/mspt-blood-invalid', { entry: entry, nurse: L.getNurse() })
      .then(function () {
        L.hideModal('modal-blood-invalid'); L.showToast('已送回需回診');
        _refreshBg();
      })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); confirmBtn.disabled = false; });
  });


  document.getElementById('btn-hold-confirm').addEventListener('click', function () {
    var entry = _modalEntry; if (!entry) return;
    var note = document.getElementById('modal-hold-note').value.trim() || '暫緩';
    var confirmBtn = this, errEl = document.getElementById('hold-error');
    errEl.classList.remove('show'); confirmBtn.disabled = true;
    L.apiAction('POST', '/api/on-hold', { entry: entry, note: note, nurse: L.getNurse() })
      .then(function (resp) {
        L.hideModal('modal-hold'); L.showToast('已設定暫緩');
        var chart = entry.patient.chart_number;
        _removeFromActive(chart);
        var he = { patient: entry.patient, category: '代謝症候群', due_date: entry.due_date, note: note, hold_id: resp && resp.hold_id };
        _hold.push(he); _holdMap[chart] = he;
        _refreshBg();
      })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });


  document.getElementById('btn-vpn-confirm').addEventListener('click', function () {
    var entry = _submitEntry; if (!entry) return;
    var confirmBtn = this;
    confirmBtn.disabled = true;
    var usedBlood = document.getElementById('modal-vpn-blood').checked;
    var payload = Object.assign({}, entry, { used_blood: usedBlood });
    L.apiAction('POST', '/api/submitted', payload)
      .then(function () {
        L.hideModal('modal-vpn'); L.showToast('待登VPN記錄已儲存');
        _submittable = _submittable.filter(function(e) { return e.patient.chart_number !== entry.patient.chart_number; });
        var archived = Object.assign({}, entry, { submitted_at: new Date().toISOString().slice(0, 10) });
        _submitted.unshift(archived);
        document.getElementById('cnt-submitted').textContent = _submitted.length || '';
        _submitEntry = null;
        _refreshBg();
      })
      .catch(function (e) { L.showToast('儲存失敗：' + (e.message||''), 'error'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  document.getElementById('exclude-chips').addEventListener('click', function (ev) {
    var chip = ev.target.closest('.reason-chip'); if (!chip) return;
    document.querySelectorAll('#exclude-chips .reason-chip').forEach(function (c) { c.classList.remove('selected'); });
    chip.classList.add('selected');
    document.getElementById('case-date-wrap').style.display = chip.dataset.reason === '已結案' ? '' : 'none';
  });

  document.getElementById('edit-reason-chips').addEventListener('click', function (ev) {
    var chip = ev.target.closest('.reason-chip'); if (!chip) return;
    document.querySelectorAll('#edit-reason-chips .reason-chip').forEach(function (c) { c.classList.remove('selected'); });
    chip.classList.add('selected');
    document.getElementById('edit-case-date-wrap').style.display = chip.dataset.reason === '已結案' ? '' : 'none';
  });

  document.getElementById('btn-edit-reason-confirm').addEventListener('click', function () {
    var selected = document.querySelector('#edit-reason-chips .reason-chip.selected');
    var errEl = document.getElementById('edit-reason-error');
    if (!selected) { errEl.textContent = '請選擇排除原因'; errEl.classList.add('show'); return; }
    var reason = selected.dataset.reason;
    if (reason === '已結案') {
      var iso = _mdp.edit.iso;
      if (!iso) { errEl.textContent = '請選擇結案日期'; errEl.classList.add('show'); return; }
      var p = iso.split('-'); reason = '已結案（' + (parseInt(p[0]) - 1911) + '/' + p[1] + '/' + p[2] + '）';
    }
    var note = document.getElementById('modal-edit-reason-note').value.trim();
    var confirmBtn = this, e = _editExclEntry;
    if (!e) return;
    errEl.classList.remove('show'); confirmBtn.disabled = true;
    L.apiAction('PATCH', '/api/excluded', {
      chart_number: e.patient.chart_number, category: e.category,
      reason: reason, note: note, nurse: L.getNurse(),
      name: e.patient.name,
      birth_date: e.patient.birth_date,
    })
      .then(function () {
        L.hideModal('modal-edit-reason'); L.showToast('排除原因已更新');
        var chart = e.patient.chart_number;
        var entry = _excludedMap[chart];
        if (entry) { entry.reason = reason; entry.note = note; entry.auto = false; }
        _editExclEntry = null;
        renderExcluded();
      })
      .catch(function (err) { errEl.textContent = err.message || '更新失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  document.getElementById('btn-exclude-confirm').addEventListener('click', function () {
    var selected = document.querySelector('#exclude-chips .reason-chip.selected');
    var errEl = document.getElementById('exclude-error');
    if (!selected) { errEl.textContent = '請選擇排除原因'; errEl.classList.add('show'); return; }
    var reason = selected.dataset.reason;
    if (reason === '已結案') {
      var iso = _mdp.exclude.iso;
      if (!iso) { errEl.textContent = '請選擇結案日期'; errEl.classList.add('show'); return; }
      var p = iso.split('-'); reason = '已結案（' + (parseInt(p[0]) - 1911) + '/' + p[1] + '/' + p[2] + '）';
    }
    var note = document.getElementById('modal-exclude-note').value.trim();
    var confirmBtn = this;
    errEl.classList.remove('show');
    confirmBtn.disabled = true;
    L.apiAction('POST', '/api/excluded', { entry: _excludeEntry, reason: reason, note: note, nurse: L.getNurse() })
      .then(function () {
        L.hideModal('modal-exclude'); L.showToast('已排除：' + _excludeEntry.patient.name);
        var chart = _excludeEntry.patient.chart_number;
        _removeFromActive(chart);
        delete _holdMap[chart]; delete _contactedMap[chart];
        _hold      = _hold.filter(function(e) { return e.patient.chart_number !== chart; });
        _contacted = _contacted.filter(function(e) { return e.patient.chart_number !== chart; });
        var xe = { patient: _excludeEntry.patient, category: '代謝症候群', reason: reason };
        _excluded.push(xe); _excludedMap[chart] = xe;
        _refreshBg();
      })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  // ── Workflow popup ───────────────────────────────────
  var _wfPopup = null;
  var _MSPT_TAB_DEFS = [
    { key: 'return',   label: '需回診',    list: function () { return _return; } },
    { key: 'phone',    label: '可電話完成', list: function () { return _phone; } },
    { key: 'inactive', label: '未複診',    list: function () { return _inactive; } },
  ];

  function _openWorkflow() {
    var allTabs = {};
    _MSPT_TAB_DEFS.forEach(function (def) {
      var items = def.list().filter(match).map(function (e) {
        var p = e.patient || { name: e.manual_name || '?', chart_number: '', birth_date: '', nat_id: '' };
        return {
          name:             p.name || '',
          chart_number:     p.chart_number || '',
          birth_date:       p.birth_date || '',
          nat_id:           p.nat_id || '',
          mspt_stage:       e.mspt_stage || '',
          needs_blood_test: !!e.needs_blood_test,
          call_required:    !!e.call_required,
          _entry: e,
          _mode:  'mspt',
          _tab:   def.key,
        };
      });
      if (items.length) allTabs[def.key] = { label: def.label, items: items };
    });
    if (!Object.keys(allTabs).length) { alert('目前沒有資料'); return; }
    try {
      localStorage.setItem('rx_workflow_tabs', JSON.stringify(allTabs));
      localStorage.setItem('rx_workflow_curtab', _tab);
    } catch (ex) {}
    if (_wfPopup && !_wfPopup.closed) {
      _wfPopup.postMessage('workflow_reload', '*');
      _wfPopup.focus();
    } else {
      _wfPopup = window.open('/workflow-popup', 'rx_workflow',
        'width=420,height=520,resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no');
      if (_wfPopup) _wfPopup.focus();
    }
  }

  document.getElementById('btn-workflow').addEventListener('click', _openWorkflow);

  window.addEventListener('message', function (ev) {
    if (ev.data === 'workflow_refresh') _refreshBg();
  });

  try {
    var _st = sessionStorage.getItem('mspt_active_tab');
    if (_st && ALL_TABS.indexOf(_st) !== -1) {
      _tab = _st;
      var _stBtn = document.querySelector('.filter-tab[data-tab="' + _st + '"]');
      if (_stBtn) {
        document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('on'); });
        _stBtn.classList.add('on');
        ALL_TABS.forEach(function(t){ document.getElementById('list-'+t).style.display = t===_st ? '' : 'none'; });
      }
    }
  } catch(ex) {}
  _updateCtxFilters(_tab);
  Layout.init({ activePage: 'mspt', onRefresh: load });
  load();
})();
</script>
</body>
</html>
