<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聯絡記錄 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=29">
<style>
.hs-search-bar{display:flex;gap:8px;align-items:center}
.hs-search-bar input{flex:1;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:var(--card);outline:none;transition:border-color .15s}
.hs-search-bar input:focus{border-color:#b5d7f5;box-shadow:0 0 0 3px rgba(181,215,245,.2)}

.hs-prompt{text-align:center;padding:56px 24px;color:var(--muted);font-size:14px}
.hs-loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.hs-empty{text-align:center;padding:48px;color:var(--muted);font-size:14px}
.hs-error{text-align:center;padding:40px;color:#991b1b;font-size:14px}

#hs-results{overflow-x:auto}

.hs-group{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.hs-group-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px}
.hs-group-name{font-weight:700;font-size:15px;color:var(--text)}
.hs-group-chart{font-size:12px;color:var(--muted);font-family:monospace}

.hs-event{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:start}
.hs-event:last-child{border-bottom:none}
.hs-event-date{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.hs-event-time{font-size:11px;color:var(--muted)}
.hs-event-body{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.hs-event-detail{font-size:13px;color:var(--sub);flex-basis:100%}
.hs-event-nurse{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}

.hs-chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.hs-cat{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;background:var(--bg);color:var(--sub);border:1px solid var(--border)}

/* Event type chip colors — light mode */
.chip-contacted{background:#DBEAFE;color:#1D4ED8}
.chip-called{background:#FEF3C7;color:#92400E}
.chip-line{background:#D1FAE5;color:#065F46}
.chip-hold{background:#FEF9C3;color:#713F12}
.chip-excluded{background:#FEE2E2;color:#991B1B}
.chip-mspt_completed{background:#EDE9FE;color:#5B21B6}
.chip-checkedin{background:#CCFBF1;color:#0F766E}
.chip-hep_completed{background:#E0E7FF;color:#3730A3}

/* Dark mode overrides — guard mirrors _layout.css convention */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) .chip-contacted{background:#1e3a5f;color:#93c5fd}
  :root:not([data-theme=light]) .chip-called{background:#451a03;color:#fcd34d}
  :root:not([data-theme=light]) .chip-line{background:#052e16;color:#6ee7b7}
  :root:not([data-theme=light]) .chip-hold{background:#3b2000;color:#fde68a}
  :root:not([data-theme=light]) .chip-excluded{background:#450a0a;color:#fca5a5}
  :root:not([data-theme=light]) .chip-mspt_completed{background:#2e1065;color:#c4b5fd}
  :root:not([data-theme=light]) .chip-checkedin{background:#042f2e;color:#5eead4}
  :root:not([data-theme=light]) .chip-hep_completed{background:#1e1b4b;color:#a5b4fc}
  :root:not([data-theme=light]) .hs-error{color:#fca5a5}
}
[data-theme=dark] .chip-contacted{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .chip-called{background:#451a03;color:#fcd34d}
[data-theme=dark] .chip-line{background:#052e16;color:#6ee7b7}
[data-theme=dark] .chip-hold{background:#3b2000;color:#fde68a}
[data-theme=dark] .chip-excluded{background:#450a0a;color:#fca5a5}
[data-theme=dark] .chip-mspt_completed{background:#2e1065;color:#c4b5fd}
[data-theme=dark] .chip-checkedin{background:#042f2e;color:#5eead4}
[data-theme=dark] .chip-hep_completed{background:#1e1b4b;color:#a5b4fc}
[data-theme=dark] .hs-error{color:#fca5a5}
</style>
</head>
<body>

<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="ph">
        <div><h1>聯絡記錄查詢</h1><p>依身份證或姓名查詢歷史聯絡紀錄</p></div>
      </div>

      <div class="hs-search-bar">
        <input type="text" id="search-input" placeholder="輸入身份證或姓名…" autocomplete="off">
        <button class="act-btn act-primary" id="btn-search">查詢</button>
      </div>

      <div id="hs-results">
        <div class="hs-prompt">請輸入身份證或姓名開始查詢</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/_layout.js?v=31"></script>
<script src="/static/auth-client.js"></script>
<script>
(function () {
  'use strict';
  var L = Layout;

  L.init({ activePage: 'history' });

  var searchInput = document.getElementById('search-input');
  var btnSearch   = document.getElementById('btn-search');
  var resultsEl   = document.getElementById('hs-results');
  var debounceTimer;

  var CHIP_LABELS = {
    contacted:      '一次通知',
    called:         '二次通知',
    line:           'LINE訊息',
    hold:           '暫緩',
    excluded:       '排除',
    mspt_completed: 'MSPT完成',
    checkedin:      'MSPT回診',
    hep_completed:  '肝炎回診',
  };

  function showPrompt() {
    resultsEl.innerHTML = '<div class="hs-prompt">請輸入身份證或姓名開始查詢</div>';
  }

  function showLoading() {
    resultsEl.innerHTML = '<div class="hs-loading">查詢中…</div>';
  }

  function showError() {
    resultsEl.innerHTML = '<div class="hs-error">查詢失敗，請稍後再試</div>';
  }

  function renderEvents(events) {
    if (!events || !events.length) {
      resultsEl.innerHTML = '<div class="hs-empty">查無相關紀錄</div>';
      return;
    }

    // Group by chart_number, preserving order of first appearance
    var order = [];
    var groups = {};
    events.forEach(function (ev) {
      var key = ev.chart_number || ('__' + ev.name);
      if (!groups[key]) {
        groups[key] = { name: ev.name, chart_number: ev.chart_number, events: [] };
        order.push(key);
      }
      groups[key].events.push(ev);
    });

    var html = order.map(function (key) {
      var g = groups[key];
      var rows = g.events.map(function (ev) {
        var chipCls = 'hs-chip chip-' + L.escHtml(ev.type || '');
        var chipLabel = L.escHtml(CHIP_LABELS[ev.type] || ev.type);
        var catHtml = ev.category ? '<span class="hs-cat">' + L.escHtml(ev.category) + '</span>' : '';
        var detailHtml = ev.detail ? '<span class="hs-event-detail">' + L.escHtml(ev.detail) + '</span>' : '';
        var timeHtml = ev.time ? '<div class="hs-event-time">' + L.escHtml(ev.time) + '</div>' : '';
        return '<div class="hs-event">'
          + '<div class="hs-event-date"><div>' + L.escHtml(ev.date || '') + '</div>' + timeHtml + '</div>'
          + '<div class="hs-event-body"><span class="' + chipCls + '">' + chipLabel + '</span>' + catHtml + detailHtml + '</div>'
          + '<div class="hs-event-nurse">' + L.escHtml(ev.nurse) + '</div>'
          + '</div>';
      }).join('');

      return '<div class="hs-group">'
        + '<div class="hs-group-header">'
        + '<span class="hs-group-name">' + L.escHtml(g.name) + '</span>'
        + '<span class="hs-group-chart">' + L.escHtml(g.chart_number || '') + '</span>'
        + '</div>'
        + rows
        + '</div>';
    }).join('');

    resultsEl.innerHTML = html;
  }

  function search() {
    var q = (searchInput.value || '').trim();
    if (!q) { showPrompt(); return; }
    showLoading();
    L.apiFetch('/api/history?q=' + encodeURIComponent(q))
      .then(function (data) { renderEvents(data.events); })
      .catch(function () { showError(); });
  }

  searchInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(search, 400);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); search(); }
  });
  btnSearch.addEventListener('click', function () {
    clearTimeout(debounceTimer); search();
  });
})();
</script>
</body>
</html>
