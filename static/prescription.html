<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>處方追蹤 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=57">
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>處方追蹤</h1><p id="page-date">所有處方 — 即將到期與需關懷</p></div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-tab on" data-tab="urgent">緊急 <span class="tc-count" id="cnt-urgent">…</span></button>
        <button class="filter-tab" data-tab="week">本週到期 <span class="tc-count" id="cnt-week">…</span></button>
        <button class="filter-tab" data-tab="later">後續 <span class="tc-count" id="cnt-later">…</span></button>
        <button class="filter-tab" data-tab="care">關懷 <span class="tc-count" id="cnt-care">…</span></button>
        <button class="act-btn" id="btn-workflow" style="margin-left:auto;gap:5px;flex-shrink:0;padding:6px 12px;font-size:13px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="11" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          逐一追蹤
        </button>
      </div>

      <div class="search-row">
        <input class="si" type="text" id="search-input" placeholder="搜尋姓名或身份證…">
        <span class="sr-count" id="result-count"></span>
      </div>

      <div class="list-area" id="list-scroll">
        <div id="list-urgent"><div class="sec-empty">載入中…</div></div>
        <div id="list-week"   style="display:none"></div>
        <div id="list-later"  style="display:none"></div>
        <div id="list-care"   style="display:none"></div>
      </div>

    </div>
  </div>
</div>

<script src="/static/_layout.js?v=53"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _all = [], _tab = 'urgent', _query = '';

  function _esc(s) { return L.escHtml(String(s || '')); }

  function _categorise(e) {
    if (e.is_care) return 'care';
    var d = e.days_until_due;
    if (d <= 1) return 'urgent';
    if (d <= 6) return 'week';
    return 'later';
  }

  function rxRow(e) {
    var d    = e.days_until_due;
    var dCls = d < 0 ? 'days-hi' : d <= 2 ? 'days-md' : 'days-lo';
    var dTxt = d < 0 ? (Math.abs(d) + '天逾期') : (d === 0 ? '今日到期' : d === 1 ? '明天到期' : d + '天後');

    var natId = _esc(e.nat_id);
    var name  = _esc(e.name);
    var birth = e.birth_date ? _esc(String(e.birth_date).slice(0, 10)) : '';
    var due   = e.due_date ? String(e.due_date).slice(5).replace('-', '/') : '—';
    var ps    = e.ps ? e.ps + '天' : '—';

    var htypeBadge = e.h_type === 'AE連續'
      ? '<span class="pbadge b-done">連續</span>'
      : '<span class="pbadge">一般</span>';
    var careBadge = e.is_care ? ' <span class="pbadge b-hold">關懷</span>' : '';
    var icdTxt    = e.icd_name ? _esc(e.icd_name) : '';

    return '<tr class="pr">' +
      '<td class="pr-num"><span class="pr-copy" data-copy="' + natId + '" title="點擊複製身份證">' + natId + '</span></td>' +
      '<td class="pr-pt">' +
        '<div class="pr-name">' + name + '</div>' +
        '<div class="pr-info">' + birth + '</div>' +
      '</td>' +
      '<td style="white-space:nowrap">' + htypeBadge + careBadge + '</td>' +
      '<td class="pr-days ' + dCls + '">' + dTxt + '</td>' +
      '<td class="pr-date">' + due + '</td>' +
      '<td class="pr-date">' + ps + '</td>' +
      '<td class="pr-note" style="color:var(--sub);font-size:12px">' + icdTxt + '</td>' +
      '</tr>';
  }

  function rxTable(rowsHtml) {
    return '<div class="ptbl-wrap"><table class="p-table">' +
      '<colgroup>' +
        '<col style="width:115px">' +
        '<col>' +
        '<col style="width:100px">' +
        '<col style="width:90px">' +
        '<col style="width:70px">' +
        '<col style="width:60px">' +
        '<col style="width:130px">' +
      '</colgroup>' +
      '<thead><tr>' +
        '<th>身份證</th><th>病患</th><th>處方類型</th><th>到期</th><th>到期日</th><th>開藥天</th><th>疾病</th>' +
      '</tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>';
  }

  function _updatePageDate() {
    var d = new Date();
    var wday = ['日','一','二','三','四','五','六'][d.getDay()];
    document.getElementById('page-date').textContent =
      d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' +
      String(d.getDate()).padStart(2,'0') + '（' + wday + '）— 共 ' + _all.length + ' 筆';
  }

  function _renderAll() {
    var lists = { urgent:[], week:[], later:[], care:[] };
    _all.forEach(function(e) { lists[_categorise(e)].push(e); });
    document.getElementById('cnt-urgent').textContent = lists.urgent.length || '';
    document.getElementById('cnt-week').textContent   = lists.week.length   || '';
    document.getElementById('cnt-later').textContent  = lists.later.length  || '';
    document.getElementById('cnt-care').textContent   = lists.care.length   || '';
    _render();
  }

  function _render() {
    var lists = { urgent:[], week:[], later:[], care:[] };
    _all.forEach(function(e) {
      if (!_query || e.name.toLowerCase().includes(_query) || e.nat_id.toLowerCase().includes(_query))
        lists[_categorise(e)].push(e);
    });

    var total = _all.filter(function(e){ return _categorise(e) === _tab; }).length;
    document.getElementById('result-count').textContent =
      _query ? '符合 ' + lists[_tab].length + ' / ' + total + ' 筆' : '共 ' + total + ' 筆';

    var el = document.getElementById('list-' + _tab);
    if (!lists[_tab].length) {
      el.innerHTML = '<div class="sec-empty">' + (total ? '沒有符合搜尋條件的病患' : '無資料') + '</div>';
      return;
    }
    el.innerHTML = rxTable(lists[_tab].map(rxRow).join(''));
  }

  function _load() {
    L.hideError();
    document.getElementById('list-urgent').innerHTML = '<div class="sec-empty">載入中…</div>';
    ['week','later','care'].forEach(function(t){ document.getElementById('list-'+t).innerHTML=''; });
    L.apiFetch('/api/report/prescriptions')
      .then(function(data) {
        _all = data;
        _updatePageDate();
        _renderAll();
        L.updateLastUpdated();
      })
      .catch(function(e){ L.showError('資料載入失敗 — ' + (e.message || '')); });
  }

  document.getElementById('filter-bar').addEventListener('click', function(ev) {
    var btn = ev.target.closest('.filter-tab'); if (!btn) return;
    _tab = btn.dataset.tab;
    document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    ['urgent','week','later','care'].forEach(function(t){
      document.getElementById('list-'+t).style.display = t===_tab ? '' : 'none';
    });
    _render();
  });

  document.getElementById('search-input').addEventListener('input', function(){
    _query = this.value.trim().toLowerCase();
    _render();
  });

  // ── Workflow popup ───────────────────────────────────
  var _wfPopup = null;
  var _RX_TAB_LABELS = { urgent:'緊急', week:'本週到期', later:'後續', care:'關懷' };

  function _openWorkflow() {
    var lists = { urgent:[], week:[], later:[], care:[] };
    _all.forEach(function(e) {
      if (!_query || e.name.toLowerCase().includes(_query) || e.nat_id.toLowerCase().includes(_query))
        lists[_categorise(e)].push(e);
    });
    var allTabs = {};
    ['urgent','week','later','care'].forEach(function(tab) {
      if (lists[tab].length) {
        allTabs[tab] = {
          label: _RX_TAB_LABELS[tab],
          items: lists[tab].map(function(e) {
            return Object.assign({}, e, { _entry: e, _mode: 'prescription', _tab: tab });
          }),
        };
      }
    });
    if (!Object.keys(allTabs).length) { alert('目前沒有資料'); return; }
    try {
      localStorage.setItem('rx_workflow_tabs', JSON.stringify(allTabs));
      localStorage.setItem('rx_workflow_curtab', _tab);
    } catch(ex){}
    if (_wfPopup && !_wfPopup.closed) {
      _wfPopup.postMessage('workflow_reload', '*');
      _wfPopup.focus();
    } else {
      _wfPopup = window.open('/workflow-popup', 'rx_workflow',
        'width=420,height=520,resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no');
      if (_wfPopup) _wfPopup.focus();
    }
  }

  document.getElementById('btn-workflow').addEventListener('click', _openWorkflow);
  window.addEventListener('message', function(ev){ if(ev.data==='workflow_refresh') _load(); });

  Layout.init({ activePage: 'prescription', onRefresh: _load });
  _load();
})();
</script>
</body>
</html>
