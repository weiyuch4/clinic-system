<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="診所追蹤">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>排班表 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=58">
<style>
.week-nav{display:flex;align-items:center;gap:12px;flex-shrink:0}
.week-label{font-size:14px;font-weight:600;color:var(--text);flex:1;text-align:center}
.wn-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wn-btn:hover{border-color:var(--sub);color:var(--text)}
.wn-today{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer}
.wn-today:hover{border-color:var(--sub);color:var(--text)}
.sched-grid{display:grid;grid-template-columns:100px repeat(7,1fr);border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);flex-shrink:0}
.sg-cell{padding:10px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px}
.sg-cell:nth-child(8n){border-right:none}
.sg-hdr{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;background:var(--bg);text-align:center}
.sg-lbl{font-size:12px;font-weight:600;color:var(--sub);background:var(--bg);display:flex;align-items:center;padding-left:14px}
.sg-day{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sg-date{font-size:11px;color:var(--muted);margin-bottom:4px}
.sg-name{font-size:13px;color:var(--text);font-weight:500}
.sg-today .sg-date{color:var(--sub);font-weight:700}
.sg-today-dot{width:5px;height:5px;border-radius:50%;background:var(--sub);display:inline-block;margin-bottom:2px}
.sg-today{background:var(--g0) !important}
.sg-empty{color:var(--border);font-size:11px}
.unpub-banner{background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted);font-size:13px}
.sg-cell.last-row{border-bottom:none}
.excl-row{display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.excl-lbl{font-size:12px;color:var(--sub);flex-shrink:0;margin-right:2px}
.excl-day{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;transition:background .12s,color .12s,border-color .12s}
.excl-day:hover{border-color:var(--sub)}
.excl-day.off{color:var(--muted);text-decoration:line-through;border-style:dashed}
.sg-mine{background:rgba(75,170,255,.08)}
.sg-entry{display:flex;flex-direction:column;gap:1px;padding:2px 0}
.sg-entry+.sg-entry{border-top:1px solid var(--border);margin-top:5px;padding-top:5px}
.sg-time{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sg-clean{font-size:10.5px;color:var(--muted)}
.sg-clean::before{content:'清潔 '}
.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:100px;overflow:hidden;flex-shrink:0}
.view-toggle button{padding:5px 14px;font-size:12.5px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--muted);font-family:inherit;transition:background .12s,color .12s}
.view-toggle button.on{background:#b5d7f5;color:#111827}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .view-toggle button.on{background:#1E3A5F;color:#93C5FD}}
:root[data-theme="dark"] .view-toggle button.on{background:#1E3A5F;color:#93C5FD}

/* ── Mobile: week-nav wraps, day-card list replaces grid ── */
@media(max-width:767px){
  .week-nav{flex-wrap:wrap;gap:8px}
  .week-nav .view-toggle{flex:1 0 calc(50% - 4px);justify-content:stretch}
  .week-nav .view-toggle button{flex:1}
  .excl-row{display:none}
  #btn-print-month{display:none}

  /* hide desktop grid, show mobile list */
  .sched-grid{display:none!important}
  #sched-area{overflow-x:visible}

  /* day-card list */
  .mob-day-list{display:flex;flex-direction:column;gap:10px}
  .mob-day-card{background:var(--card);border-radius:12px;border:1.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
  .mob-day-card.mob-today{border-color:#b5d7f5;border-width:2px}
  .mob-day-hd{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--border)}
  .mob-day-card.mob-today .mob-day-hd{background:rgba(181,215,245,.12)}
  .mob-day-dow{font-size:15px;font-weight:700;color:var(--text)}
  .mob-day-date{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .mob-today-badge{margin-left:auto;background:#b5d7f5;color:#111827;font-size:11px;font-weight:700;padding:2px 10px;border-radius:100px}
  .mob-day-slots{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .mob-slot-row{display:flex;align-items:flex-start;gap:10px;min-height:32px}
  .mob-slot-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:38px;flex-shrink:0;padding-top:5px}
  .mob-slot-entries{flex:1;display:flex;flex-direction:column;gap:4px}
  .mob-slot-entry{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:7px;background:var(--bg);min-height:32px}
  .mob-slot-entry.mob-mine{background:rgba(75,170,255,.10);border:1px solid rgba(75,170,255,.18)}
  .mob-slot-name{font-size:14px;font-weight:600;color:var(--text)}
  .mob-slot-time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .mob-slot-empty{font-size:12px;color:var(--border);padding:3px 0}
  .mob-day-empty{font-size:13px;color:var(--muted);padding:4px 0;text-align:center}
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>排班表</h1><p id="page-date">本週護理師班表</p></div>
        <button class="act-btn" id="btn-print-month" style="gap:6px;flex-shrink:0;margin-left:auto">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          列印月班表
        </button>
      </div>

      <div class="excl-row">
        <span class="excl-lbl">列印排除：</span>
        <button class="excl-day" data-dow="0">日</button>
        <button class="excl-day" data-dow="1">一</button>
        <button class="excl-day" data-dow="2">二</button>
        <button class="excl-day" data-dow="3">三</button>
        <button class="excl-day" data-dow="4">四</button>
        <button class="excl-day" data-dow="5">五</button>
        <button class="excl-day" data-dow="6">六</button>
      </div>

      <div class="week-nav">
        <button class="wn-btn" id="btn-prev" title="上週">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="week-label" id="week-label">本週</span>
        <button class="wn-btn" id="btn-next" title="下週">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wn-today" id="btn-this-week">本週</button>
        <div class="view-toggle" id="group-toggle">
          <button id="btn-group-nurse" class="on" onclick="setGroup('nurses')" style="min-width:52px">護理師</button>
          <button id="btn-group-pharm" onclick="setGroup('pharmacist')" style="min-width:52px">藥師</button>
        </div>
        <div class="view-toggle">
          <button id="btn-view-mine" class="on" onclick="setView(false)">我的班表</button>
          <button id="btn-view-all" onclick="setView(true)">全體班表</button>
        </div>
      </div>

      <div id="sched-area">
        <div style="text-align:center;padding:40px;color:var(--muted)">載入中…</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/_layout.js?v=58"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _mondayStr = L.getMondayStr();
  var TODAY = L.localDateStr();
  var DOW = ['一','二','三','四','五','六','日'];
  var SLOTS = [
    { key: '早診', label: '早診' },
    { key: '午診', label: '午診' },
    { key: '晚診', label: '晚診' },
  ];
  var _showAll = false;
  var _group = 'nurses';      // 'nurses' | 'pharmacist'
  var _pharmacists = [];      // populated on load
  var _lastIdx = null;  // cached schedule index for re-render without refetch

  // ── Day-of-week exclusion for monthly print ──────────
  var _exclDows = [];
  try { _exclDows = JSON.parse(localStorage.getItem('print_excl_dows') || '[]'); } catch (e) {}
  document.querySelectorAll('.excl-day').forEach(function (btn) {
    var dow = parseInt(btn.dataset.dow, 10);
    if (_exclDows.indexOf(dow) !== -1) btn.classList.add('off');
    btn.addEventListener('click', function () {
      btn.classList.toggle('off');
      _exclDows = [];
      document.querySelectorAll('.excl-day.off').forEach(function (b) {
        _exclDows.push(parseInt(b.dataset.dow, 10));
      });
      try { localStorage.setItem('print_excl_dows', JSON.stringify(_exclDows)); } catch (e) {}
    });
  });

  function setView(all) {
    _showAll = all;
    document.getElementById('btn-view-mine').className = all ? '' : 'on';
    document.getElementById('btn-view-all').className  = all ? 'on' : '';
    if (_lastIdx) renderGrid(_lastIdx);
  }
  window.setView = setView;

  function setGroup(g) {
    _group = g;
    document.getElementById('btn-group-nurse').className = g === 'nurses' ? 'on' : '';
    document.getElementById('btn-group-pharm').className = g === 'pharmacist' ? 'on' : '';
    document.getElementById('page-date').textContent = g === 'pharmacist' ? '本週藥師班表' : '本週護理師班表';
    // force "全體" when viewing pharmacists (pharmacists don't have user accounts)
    if (g === 'pharmacist' && !_showAll) setView(true);
    if (_lastIdx) renderGrid(_lastIdx);
  }
  window.setGroup = setGroup;

  function weekDates(mon) {
    var dates = [];
    for (var i = 0; i < 7; i++) dates.push(L.addDays(mon, i));
    return dates;
  }

  function setWeekLabel(mon) {
    var sun = L.addDays(mon, 6);
    var monYear = mon.slice(0, 4), sunYear = sun.slice(0, 4);
    var range;
    if (monYear !== sunYear) {
      range = monYear + '/' + mon.slice(5) + ' – ' + sunYear + '/' + sun.slice(5);
    } else {
      range = mon.slice(5) + ' – ' + sun.slice(5);
    }
    document.getElementById('week-label').textContent = monYear + '/' + mon.slice(5, 7) + ' 週（' + range + '）';
  }

  function entryHtml(e) {
    var h = '<div class="sg-entry"><div class="sg-name">' + L.escHtml(e.nurse) + '</div>';
    if (e.start_time || e.end_time) {
      h += '<div class="sg-time">' + (e.start_time || '') + (e.end_time ? '–' + e.end_time : '') + '</div>';
    }
    if (e.clean_start && e.clean_end) {
      h += '<div class="sg-clean">' + e.clean_start + '–' + e.clean_end + '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderMobileDays(idx) {
    var myNurse = L.getNurse();
    var dates = weekDates(_mondayStr);
    var area = document.getElementById('sched-area');
    var DOW_FULL = ['一','二','三','四','五','六','日'];

    var cards = dates.map(function(d, i) {
      var isToday = d === TODAY;
      var hd = '<div class="mob-day-hd">' +
        '<span class="mob-day-dow">週' + DOW_FULL[i] + '</span>' +
        '<span class="mob-day-date">' + d.slice(5) + '</span>' +
        (isToday ? '<span class="mob-today-badge">今日</span>' : '') +
      '</div>';

      var allDayEmpty = true;
      var slotsHtml = SLOTS.map(function(slot) {
        var allEntries = ((idx[d] && idx[d][slot.key]) || []).filter(function(e) {
          return _group === 'pharmacist'
            ? _pharmacists.indexOf(e.nurse) !== -1
            : _pharmacists.indexOf(e.nurse) === -1;
        });
        var entries = _showAll ? allEntries
          : (myNurse ? allEntries.filter(function(e){ return e.nurse === myNurse; }) : allEntries);
        if (entries.length) allDayEmpty = false;
        var entriesHtml = entries.length
          ? entries.map(function(e) {
              var isMine = myNurse && e.nurse === myNurse;
              var timeStr = (e.start_time || '') + (e.end_time ? '–' + e.end_time : '');
              return '<div class="mob-slot-entry' + (isMine ? ' mob-mine' : '') + '">' +
                '<span class="mob-slot-name">' + L.escHtml(e.nurse) + '</span>' +
                (timeStr ? '<span class="mob-slot-time">' + timeStr + '</span>' : '') +
              '</div>';
            }).join('')
          : '<span class="mob-slot-empty">—</span>';
        return '<div class="mob-slot-row">' +
          '<span class="mob-slot-label">' + L.escHtml(slot.key) + '</span>' +
          '<div class="mob-slot-entries">' + entriesHtml + '</div>' +
        '</div>';
      }).join('');

      // In "my shifts" mode, skip days with no entries (keep today always visible)
      if (!_showAll && !allDayEmpty === false && !isToday) {
        // all slots empty and not today — still show the card, just grayed
      }

      return '<div class="mob-day-card' + (isToday ? ' mob-today' : '') + '">' +
        hd +
        '<div class="mob-day-slots">' + slotsHtml + '</div>' +
      '</div>';
    }).join('');

    area.innerHTML = '<div class="mob-day-list">' + cards + '</div>';
  }

  function renderGrid(idx) {
    _lastIdx = idx;
    if (window.innerWidth < 768) { renderMobileDays(idx); return; }
    var myNurse = L.getNurse();
    var dates = weekDates(_mondayStr);
    var area = document.getElementById('sched-area');

    // header row
    var hdr = '<div class="sg-cell sg-hdr"></div>';
    dates.forEach(function (d, i) {
      var isToday = d === TODAY;
      hdr += '<div class="sg-cell sg-hdr' + (isToday ? ' sg-today' : '') + '">' +
        (isToday ? '<div class="sg-today-dot"></div>' : '') +
        DOW[i] + '<br><span class="sg-date">' + d.slice(5) + '</span>' +
      '</div>';
    });

    // slot rows
    var rows = SLOTS.map(function (slot, si) {
      var isLast = si === SLOTS.length - 1;
      var cells = '<div class="sg-cell sg-lbl' + (isLast ? ' last-row' : '') + '">' + L.escHtml(slot.label) + '</div>';
      dates.forEach(function (d) {
        var isToday = d === TODAY;
        var allEntries = ((idx[d] && idx[d][slot.key]) || []).filter(function(e) {
          return _group === 'pharmacist'
            ? _pharmacists.indexOf(e.nurse) !== -1
            : _pharmacists.indexOf(e.nurse) === -1;
        });
        var isMineDay = myNurse && allEntries.some(function(e){return e.nurse===myNurse;});
        var entries = _showAll ? allEntries : (myNurse ? allEntries.filter(function(e){return e.nurse===myNurse;}) : allEntries);
        var highlight = !_showAll && isMineDay ? ' sg-mine' : '';
        cells += '<div class="sg-cell sg-day' + (isToday ? ' sg-today' : '') + (isLast ? ' last-row' : '') + highlight + '">' +
          (entries.length
            ? entries.map(entryHtml).join('')
            : '<span class="sg-empty">—</span>') +
        '</div>';
      });
      return cells;
    }).join('');

    area.innerHTML = '<div class="sched-grid">' + hdr + rows + '</div>';
  }

  function load() {
    L.hideError();
    _lastIdx = null;
    setWeekLabel(_mondayStr);
    Promise.all([
      L.apiFetch('/api/schedule?week_start=' + _mondayStr),
      L.apiFetch('/api/pharmacists').catch(function() { return []; }),
    ]).then(function (res) {
      var data = res[0];
      _pharmacists = res[1] || [];
      // hide group toggle if no pharmacists
      document.getElementById('group-toggle').style.display = _pharmacists.length ? '' : 'none';
      if (!_pharmacists.length && _group === 'pharmacist') setGroup('nurses');
      L.updateLastUpdated();
      var area = document.getElementById('sched-area');
      if (!data.published) {
        area.innerHTML = '<div class="unpub-banner">本週班表尚未發布</div>';
        return;
      }
      var idx = {};
      (data.shifts || []).forEach(function (s) {
        if (!idx[s.shift_date]) idx[s.shift_date] = {};
        if (!idx[s.shift_date][s.slot]) idx[s.shift_date][s.slot] = [];
        idx[s.shift_date][s.slot].push({
          nurse: s.nurse,
          start_time: s.start_time || null,
          end_time: s.end_time || null,
          clean_start: s.clean_start || null,
          clean_end: s.clean_end || null,
        });
      });
      renderGrid(idx);
    }).catch(function (e) {
      L.showError('班表載入失敗 — ' + (e.message || ''));
    });
  }

  document.getElementById('btn-prev').addEventListener('click', function () {
    _mondayStr = L.addDays(_mondayStr, -7); load();
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    _mondayStr = L.addDays(_mondayStr, 7); load();
  });
  document.getElementById('btn-this-week').addEventListener('click', function () {
    _mondayStr = L.getMondayStr(); load();
  });

  // ── Print month ─────────────────────────────────────
  document.getElementById('btn-print-month').addEventListener('click', function () {
    var thursday = L.addDays(_mondayStr, 3);
    var year     = parseInt(thursday.slice(0, 4), 10);
    var month    = parseInt(thursday.slice(5, 7), 10);
    var monthStr = thursday.slice(0, 7);

    L.apiFetch('/api/schedule/month?month=' + monthStr).then(function (data) {
      var isPharmGroup = _group === 'pharmacist';
      var nurses = isPharmGroup ? _pharmacists : (data.nurses || []);
      var idx = {};
      (data.shifts || []).forEach(function (s) {
        // filter shifts to only the current group
        var inPharm = _pharmacists.indexOf(s.nurse) !== -1;
        if (isPharmGroup !== inPharm) return;
        if (!idx[s.shift_date]) idx[s.shift_date] = {};
        if (!idx[s.shift_date][s.nurse]) idx[s.shift_date][s.nurse] = [];
        idx[s.shift_date][s.nurse].push(s);
      });
      if (!nurses.length) {
        var seen = {};
        Object.keys(idx).forEach(function (d) {
          Object.keys(idx[d]).forEach(function (n) { seen[n] = 1; });
        });
        nurses = Object.keys(seen);
      }

      var daysInMonth = new Date(year, month, 0).getDate();
      var DOW_ZH = ['日', '一', '二', '三', '四', '五', '六'];

      function pad(n) { return String(n).padStart(2, '0'); }
      // Abbreviate time: strip leading zero from hour only — "08:00" → "8:00", "21:30" → "21:30"
      function fmtT(t) {
        if (!t) return '';
        var m = t.match(/^(\d+):(\d+)$/);
        if (!m) return t;
        return parseInt(m[1], 10) + ':' + m[2];
      }

      // Build column headers: one per day (skip excluded days of week)
      var dayHdrs = '';
      var printDays = []; // track which day numbers to include
      for (var d = 1; d <= daysInMonth; d++) {
        var dow = new Date(year + '-' + pad(month) + '-' + pad(d) + 'T00:00:00').getDay();
        if (_exclDows.indexOf(dow) !== -1) continue;
        printDays.push(d);
        var we  = dow === 0 || dow === 6;
        dayHdrs += '<th class="dh' + (we ? ' we' : '') + '">' +
          d + '<br><span class="dow">' + DOW_ZH[dow] + '</span></th>';
      }

      // Build one row per nurse
      var rows = '';
      nurses.forEach(function (nurse) {
        var cells = '';
        printDays.forEach(function (d) {
          var dateStr = year + '-' + pad(month) + '-' + pad(d);
          var dow = new Date(dateStr + 'T00:00:00').getDay();
          var we  = dow === 0 || dow === 6;
          var shifts = (idx[dateStr] && idx[dateStr][nurse]) || [];
          if (!shifts.length) {
            cells += '<td class="ec' + (we ? ' we' : '') + '"></td>';
          } else {
            var content = shifts.map(function (s) {
              var clean = s.clean_start && s.clean_end;
              return '<div class="sh">' +
                '<span class="st">' + fmtT(s.start_time) + '</span>' +
                '<span class="vb">│</span>' +
                '<span class="et">' + fmtT(s.end_time) + (clean ? ' ★' : '') + '</span>' +
              '</div>';
            }).join('');
            cells += '<td class="sc' + (we ? ' we' : '') + '">' + content + '</td>';
          }
        });
        rows += '<tr><td class="nc">' + nurse + '</td>' + cells + '</tr>';
      });

      var groupLabel = isPharmGroup ? '藥師' : '護理師';
      var title = year + ' 年 ' + month + ' 月' + groupLabel + '排班表 — 魏宏杰診所';
      var html = '<!DOCTYPE html><html lang="zh-TW"><head>' +
        '<meta charset="UTF-8"><title>' + title + '</title><style>' +
        '@page{size:A4 landscape;margin:8mm 6mm}' +
        'body{font-family:system-ui,-apple-system,sans-serif;font-size:9pt;color:#111;margin:0}' +
        'h1{font-size:12pt;margin:0 0 6px;text-align:center;font-weight:700}' +
        'table{width:100%;border-collapse:collapse;table-layout:fixed}' +
        'th,td{border:1px solid #c9cdd4;vertical-align:middle;padding:4px 3px;text-align:center;line-height:1.4}' +
        '.nc{text-align:left;font-weight:700;font-size:11pt;width:18mm;padding-left:5px;white-space:nowrap}' +
        '.dh{font-weight:700;font-size:9pt;line-height:1.3;background:#f3f4f6;padding:4px 2px}' +
        '.dow{font-size:7.5pt;color:#6b7280}' +
        '.sc{font-variant-numeric:tabular-nums;font-size:9pt;padding:4px 3px}' +
        '.sh{padding:2px 0;margin-bottom:5px;line-height:1.4}' +
        '.sh:last-child{margin-bottom:0}' +
        '.st,.vb,.et{display:block;text-align:center}' +
        '.vb{color:#9ca3af;line-height:1;font-size:8pt;margin:1px 0}' +
        '.et{color:#4b5563}' +
        '.ec{background:#fafafa}' +
        '.we{background:#eef2ff}' +
        '.we.dh .dow{color:#818cf8}' +
        '</style></head><body>' +
        '<h1>' + title + '</h1>' +
        '<table><thead><tr><th class="nc">' + groupLabel + '</th>' + dayHdrs + '</tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
        '</body></html>';

      var win = window.open('', '_blank', 'width=960,height=720');
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(function () { win.print(); }, 400);
    });
  });

  Layout.init({ activePage: 'schedule', onRefresh: load });
  load();
})();
</script>
