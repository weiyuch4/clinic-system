<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳號管理 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=27">
<style>
.nm-toolbar{display:flex;align-items:center;gap:10px}
.nm-table-wrap{overflow-x:auto;flex:1}
.nmtable{width:100%;border-collapse:collapse;font-size:13.5px}
.nmtable th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1.5px solid var(--border);white-space:nowrap}
.nmtable td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--sub);vertical-align:middle}
.nmtable tr:last-child td{border-bottom:none}
.nmtable td.nm-name{color:var(--text);font-weight:600}
.nm-role{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--sub);display:inline-block}
.nm-role.admin{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.nm-inactive{opacity:.45}
.nm-status{font-size:12px;font-weight:500}
.nm-status.active{color:#059669}
.nm-status.inactive{color:var(--muted)}
.section-title{font-size:16px;font-weight:700;color:var(--text);margin:0}
.nm-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.nm-empty{text-align:center;padding:48px;color:var(--muted);font-size:14px}

/* Form modal */
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-row.single{grid-template-columns:1fr}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12.5px;font-weight:500;color:var(--sub)}
.form-field input,.form-field select{
  padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);
  outline:none;transition:border-color .15s}
.form-field input:focus,.form-field select:focus{border-color:#b5d7f5;box-shadow:0 0 0 3px rgba(181,215,245,.2)}
.form-note{font-size:12px;color:var(--muted);margin-top:2px}
.modal-error{display:none;color:#991b1b;font-size:12.5px;margin-top:8px;background:#fef2f2;border-radius:6px;padding:7px 10px}
.modal-error.show{display:block}
</style>
</head>
<body>

<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>帳號管理</h1><p>護理師帳號與權限設定</p></div>
        <div class="nm-toolbar">
          <button class="act-btn act-primary" id="btn-add" style="display:none">＋ 新增帳號</button>
        </div>
      </div>

      <div class="nm-table-wrap">
        <table class="nmtable" id="nm-table">
          <thead><tr>
            <th>姓名</th><th>帳號</th><th>角色</th><th>狀態</th><th></th>
          </tr></thead>
          <tbody id="nm-body">
            <tr><td colspan="5" class="nm-empty">載入中…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- PIN management section -->
      <div class="ph" style="margin-top:12px" id="pin-section">
        <div><h2 class="section-title">護理師 PIN 設定</h2><p>每位護理師需設定 4 位數 PIN，切換身份時使用</p></div>
      </div>
      <div class="nm-table-wrap" id="pin-table-wrap">
        <table class="nmtable" id="pin-table">
          <thead><tr><th>護理師</th><th>PIN 狀態</th><th></th></tr></thead>
          <tbody id="pin-body"><tr><td colspan="3" class="nm-empty">載入中…</td></tr></tbody>
        </table>
      </div>
      <div id="pin-no-access" style="display:none;padding:24px;color:var(--muted);font-size:14px;text-align:center">此功能需要管理員權限</div>

    </div>
  </div>
</div>

<!-- create user modal -->
<div class="modal-overlay" id="modal-create">
  <div class="modal-box">
    <div class="modal-title">新增帳號</div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:4px">
      <div class="field-row">
        <div class="form-field">
          <label>顯示名稱（護理師姓名）</label>
          <input type="text" id="f-display" placeholder="例：媛淩" autocomplete="off">
        </div>
        <div class="form-field">
          <label>帳號（登入用）</label>
          <input type="text" id="f-username" placeholder="例：yuanling" autocomplete="off" autocapitalize="none">
        </div>
      </div>
      <div class="field-row">
        <div class="form-field">
          <label>角色</label>
          <select id="f-role">
            <option value="nurse">護理師</option>
            <option value="admin">管理員</option>
          </select>
        </div>
        <div class="form-field">
          <label>初始密碼</label>
          <input type="password" id="f-pass" placeholder="至少 6 個字元" autocomplete="new-password">
          <span class="form-note">護理師首次登入時須更改密碼</span>
        </div>
      </div>
    </div>
    <div class="modal-error" id="create-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-create')">取消</button>
      <button class="act-btn act-primary" id="btn-create-confirm">新增</button>
    </div>
  </div>
</div>

<!-- rename username modal -->
<div class="modal-overlay" id="modal-rename">
  <div class="modal-box">
    <div class="modal-title">修改帳號</div>
    <div class="modal-sub" id="rename-sub"></div>
    <div style="margin-top:12px" class="form-field">
      <label>新帳號</label>
      <input type="text" id="f-new-username" placeholder="英數字，不含空格" autocomplete="off" autocapitalize="none">
    </div>
    <div class="modal-error" id="rename-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-rename')">取消</button>
      <button class="act-btn act-primary" id="btn-rename-confirm">儲存</button>
    </div>
  </div>
</div>

<!-- reset password modal -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <div class="modal-title">重設密碼</div>
    <div class="modal-sub" id="reset-sub"></div>
    <div style="margin-top:12px" class="form-field">
      <label>新密碼</label>
      <input type="password" id="f-new-pass" placeholder="至少 6 個字元" autocomplete="new-password">
      <span class="form-note">護理師下次登入後可自行更改</span>
    </div>
    <div class="modal-error" id="reset-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-reset')">取消</button>
      <button class="act-btn act-primary" id="btn-reset-confirm">儲存</button>
    </div>
  </div>
</div>

<!-- set PIN modal -->
<div class="modal-overlay" id="modal-set-pin">
  <div class="modal-box" style="max-width:340px">
    <div class="modal-title">設定 PIN</div>
    <div class="modal-sub" id="set-pin-sub"></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <div class="form-field">
        <label>新 PIN（4 位數字）</label>
        <input type="password" inputmode="numeric" maxlength="4" id="set-pin-val" placeholder="例：1234" autocomplete="off"
          style="letter-spacing:6px;text-align:center;font-size:20px">
      </div>
      <div class="modal-error" id="set-pin-err"></div>
    </div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-set-pin')">取消</button>
      <button class="act-btn act-primary" id="btn-set-pin-confirm">儲存 PIN</button>
    </div>
  </div>
</div>

<!-- deactivate confirm modal -->
<div class="modal-overlay" id="modal-deact">
  <div class="modal-box">
    <div class="modal-title">停用帳號</div>
    <div class="modal-sub" id="deact-sub"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-deact')">取消</button>
      <button class="act-btn act-danger" id="btn-deact-confirm">停用</button>
    </div>
  </div>
</div>

<script src="/static/_layout.js?v=26"></script>
<script>
(function () {
  'use strict';
  var L = Layout;

  function getRole() {
    var t = localStorage.getItem('clinic_token');
    if (!t) return null;
    try {
      var b64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(atob(b64)).role;
    } catch (e) { return null; }
  }

  L.init({ activePage: '' });

  var role = getRole();
  if (role !== 'admin') {
    document.getElementById('nm-body').innerHTML =
      '<tr><td colspan="5" class="nm-empty">此頁面需要管理員權限</td></tr>';
  } else {
    document.getElementById('btn-add').style.display = '';
    document.getElementById('btn-add').addEventListener('click', openCreate);
    loadUsers();
  }

  var _users = [];
  var _selectedId = null;

  function loadUsers() {
    L.apiFetch('/api/admin/users').then(function (rows) {
      _users = rows;
      renderTable(rows);
    }).catch(function () {
      document.getElementById('nm-body').innerHTML =
        '<tr><td colspan="5" class="nm-empty">載入失敗</td></tr>';
    });
  }

  function renderTable(rows) {
    var tbody = document.getElementById('nm-body');
    if (!tbody) return;
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="nm-empty">尚無帳號</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (u) {
      var inactive = !u.is_active;
      var trCls = inactive ? ' class="nm-inactive"' : '';
      var roleLabel = u.role === 'admin'
        ? '<span class="nm-role admin">管理員</span>'
        : '<span class="nm-role">護理師</span>';
      var statusEl = inactive
        ? '<span class="nm-status inactive">已停用</span>'
        : '<span class="nm-status active">使用中</span>';
      var actions = '';
      if (!inactive) {
        actions += '<button class="act-btn nm-rename" data-id="' + u.id + '" data-name="' + L.escHtml(u.display_name) + '" data-username="' + L.escHtml(u.username) + '">改帳號</button>';
        actions += '<button class="act-btn act-warn nm-reset" data-id="' + u.id + '" data-name="' + L.escHtml(u.display_name) + '">重設密碼</button>';
        actions += '<button class="act-btn act-danger nm-deact" data-id="' + u.id + '" data-name="' + L.escHtml(u.display_name) + '">停用</button>';
      } else {
        actions += '<button class="act-btn nm-react" data-id="' + u.id + '">重新啟用</button>';
      }
      return '<tr' + trCls + '>'
        + '<td class="nm-name">' + L.escHtml(u.display_name) + '</td>'
        + '<td>' + L.escHtml(u.username) + '</td>'
        + '<td>' + roleLabel + '</td>'
        + '<td>' + statusEl + '</td>'
        + '<td><div class="nm-actions">' + actions + '</div></td>'
        + '</tr>';
    }).join('');
  }

  // ── Create ──────────────────────────────────────────────────────────────────
  function openCreate() {
    document.getElementById('f-display').value = '';
    document.getElementById('f-username').value = '';
    document.getElementById('f-pass').value = '';
    document.getElementById('f-role').value = 'nurse';
    document.getElementById('create-error').classList.remove('show');
    L.showModal('modal-create');
    setTimeout(function () { document.getElementById('f-display').focus(); }, 80);
  }

  document.getElementById('btn-create-confirm').addEventListener('click', function () {
    var display  = document.getElementById('f-display').value.trim();
    var username = document.getElementById('f-username').value.trim();
    var role     = document.getElementById('f-role').value;
    var pass     = document.getElementById('f-pass').value;
    var errEl    = document.getElementById('create-error');
    errEl.classList.remove('show');

    if (!display || !username || !pass) { errEl.textContent = '請填寫所有欄位'; errEl.classList.add('show'); return; }
    if (pass.length < 6) { errEl.textContent = '密碼至少需要 6 個字元'; errEl.classList.add('show'); return; }

    L.apiAction('POST', '/api/admin/users', { username: username, display_name: display, role: role, initial_password: pass })
      .then(function () {
        L.hideModal('modal-create');
        loadUsers();
      }).catch(function (e) {
        errEl.textContent = e.message || '新增失敗';
        errEl.classList.add('show');
      });
  });

  document.getElementById('nm-body').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var id = parseInt(btn.dataset.id);
    var name = btn.dataset.name || '';
    var username = btn.dataset.username || '';
    if (btn.classList.contains('nm-rename')) openRename(id, name, username);
    else if (btn.classList.contains('nm-reset')) openReset(id, name);
    else if (btn.classList.contains('nm-deact')) openDeact(id, name);
    else if (btn.classList.contains('nm-react')) doReactivate(id);
  });

  // ── Rename username ─────────────────────────────────────────────────────────
  function openRename(id, name, currentUsername) {
    _selectedId = id;
    document.getElementById('rename-sub').textContent = '為「' + name + '」修改登入帳號（目前：' + currentUsername + '）';
    document.getElementById('f-new-username').value = currentUsername;
    document.getElementById('rename-error').classList.remove('show');
    L.showModal('modal-rename');
    setTimeout(function () { document.getElementById('f-new-username').focus(); }, 80);
  }

  document.getElementById('btn-rename-confirm').addEventListener('click', function () {
    var username = document.getElementById('f-new-username').value.trim();
    var errEl = document.getElementById('rename-error');
    errEl.classList.remove('show');
    if (!username) { errEl.textContent = '帳號不能為空'; errEl.classList.add('show'); return; }

    L.apiAction('PATCH', '/api/admin/users/' + _selectedId + '/username', { new_username: username })
      .then(function () { L.hideModal('modal-rename'); loadUsers(); })
      .catch(function (e) { errEl.textContent = e.message || '修改失敗'; errEl.classList.add('show'); });
  });

  // ── Reset password ──────────────────────────────────────────────────────────
  function openReset(id, name) {
    _selectedId = id;
    document.getElementById('reset-sub').textContent = '為「' + name + '」設定新密碼';
    document.getElementById('f-new-pass').value = '';
    document.getElementById('reset-error').classList.remove('show');
    L.showModal('modal-reset');
    setTimeout(function () { document.getElementById('f-new-pass').focus(); }, 80);
  }

  document.getElementById('btn-reset-confirm').addEventListener('click', function () {
    var pass  = document.getElementById('f-new-pass').value;
    var errEl = document.getElementById('reset-error');
    errEl.classList.remove('show');
    if (pass.length < 6) { errEl.textContent = '密碼至少需要 6 個字元'; errEl.classList.add('show'); return; }

    L.apiAction('PATCH', '/api/admin/users/' + _selectedId + '/password', { new_password: pass })
      .then(function () { L.hideModal('modal-reset'); })
      .catch(function (e) { errEl.textContent = e.message || '重設失敗'; errEl.classList.add('show'); });
  });

  // ── Deactivate ──────────────────────────────────────────────────────────────
  function openDeact(id, name) {
    _selectedId = id;
    document.getElementById('deact-sub').textContent = '停用後「' + name + '」將無法登入，可隨時重新啟用。';
    L.showModal('modal-deact');
  }

  document.getElementById('btn-deact-confirm').addEventListener('click', function () {
    L.apiAction('DELETE', '/api/admin/users/' + _selectedId)
      .then(function () { L.hideModal('modal-deact'); loadUsers(); })
      .catch(function (e) { L.showToast(e.message || '操作失敗', 'error'); });
  });

  // ── Reactivate ──────────────────────────────────────────────────────────────
  function doReactivate(id) {
    L.apiAction('POST', '/api/admin/users/' + id + '/reactivate')
      .then(function () { loadUsers(); })
      .catch(function (e) { L.showToast(e.message || '操作失敗', 'error'); });
  }

  // ── PIN management ──────────────────────────────────────────────────────────
  var _pinTargetName = '';

  function loadPins() {
    L.apiFetch('/api/nurses/with-pin-status').then(function (nurses) {
      var tbody = document.getElementById('pin-body');
      if (!nurses.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="nm-empty">尚無護理師記錄</td></tr>';
        return;
      }
      tbody.innerHTML = nurses.map(function (n) {
        var hasPin = n.has_pin;
        var status = hasPin
          ? '<span class="nm-status active">已設定</span>'
          : '<span class="nm-status" style="color:#B45309">未設定</span>';
        var actions = '<button class="act-btn nm-set-pin" data-name="' + L.escHtml(n.name) + '">' + (hasPin ? '重設 PIN' : '設定 PIN') + '</button>';
        if (hasPin) actions += '<button class="act-btn act-danger nm-clear-pin" data-name="' + L.escHtml(n.name) + '">清除 PIN</button>';
        return '<tr><td class="nm-name">' + L.escHtml(n.name) + '</td><td>' + status + '</td><td><div class="nm-actions">' + actions + '</div></td></tr>';
      }).join('');

      document.querySelectorAll('.nm-set-pin').forEach(function (btn) {
        btn.addEventListener('click', function () {
          _pinTargetName = btn.dataset.name;
          document.getElementById('set-pin-sub').textContent = '為 ' + _pinTargetName + ' 設定新的 PIN';
          document.getElementById('set-pin-val').value = '';
          document.getElementById('set-pin-err').classList.remove('show');
          L.showModal('modal-set-pin');
          setTimeout(function () { document.getElementById('set-pin-val').focus(); }, 80);
        });
      });

      document.querySelectorAll('.nm-clear-pin').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var name = btn.dataset.name;
          L.apiAction('DELETE', '/api/admin/nurses/' + encodeURIComponent(name) + '/pin')
            .then(function () { L.showToast(name + ' 的 PIN 已清除'); loadPins(); })
            .catch(function (e) { L.showToast(e.message || '清除失敗', 'error'); });
        });
      });
    }).catch(function (e) {
      document.getElementById('pin-body').innerHTML = '<tr><td colspan="3" class="nm-empty">載入失敗</td></tr>';
    });
  }

  document.getElementById('btn-set-pin-confirm').addEventListener('click', function () {
    var pin = document.getElementById('set-pin-val').value.trim();
    var errEl = document.getElementById('set-pin-err');
    errEl.classList.remove('show');
    if (!/^\d{4}$/.test(pin)) {
      errEl.textContent = 'PIN 必須是 4 位數字';
      errEl.classList.add('show');
      return;
    }
    L.apiAction('PUT', '/api/admin/nurses/' + encodeURIComponent(_pinTargetName) + '/pin', { pin: pin })
      .then(function () {
        L.hideModal('modal-set-pin');
        L.showToast(_pinTargetName + ' 的 PIN 已設定');
        loadPins();
      })
      .catch(function (e) {
        errEl.textContent = e.message || '設定失敗';
        errEl.classList.add('show');
      });
  });

  document.getElementById('set-pin-val').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('btn-set-pin-confirm').click();
  });

  if (role === 'admin') {
    loadPins();
  } else {
    document.getElementById('pin-table-wrap').style.display = 'none';
    document.getElementById('pin-no-access').style.display = '';
  }
})();
</script>
</body>
</html>
