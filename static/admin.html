<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理員後台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

:root {
  --bg:           #F1F5F9;
  --surface:      #FFFFFF;
  --border:       #E2E8F0;
  --border-mid:   #CBD5E1;
  --text-1:       #0F172A;
  --text-2:       #475569;
  --text-3:       #94A3B8;
  --blue:         #2563EB;
  --blue-bg:      #EFF6FF;
  --emerald:      #059669;
  --amber:        #D97706;
  --red:          #DC2626;
  --header:       #0F172A;
  --radius-s:     6px;
  --radius:       10px;
  --radius-l:     14px;
  --shadow-s:     0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow:       0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --font:         -apple-system, 'Microsoft JhengHei', 'Segoe UI', system-ui, sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header);
  height: 56px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand-icon {
  width: 30px; height: 30px;
  background: var(--blue);
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}
.brand-name {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,.9);
  white-space: nowrap;
}
.topbar-divider {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,.12);
}
.topbar-sub {
  font-size: 12px;
  color: rgba(255,255,255,.35);
  white-space: nowrap;
}

/* month picker (light, inside sections) */
.section-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.month-picker, .week-picker {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  padding: 3px;
  box-shadow: var(--shadow-s);
}
.mp-btn {
  background: none;
  border: none;
  width: 28px; height: 28px;
  color: var(--text-2);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  transition: background .12s, color .12s;
}
.mp-btn:hover { background: var(--bg); color: var(--text-1); }
.month-display, .week-display {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  padding: 0 10px;
  min-width: 80px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
.tabbar {
  position: sticky;
  top: 56px;
  z-index: 99;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
}
.tab {
  padding: 15px 2px;
  margin-right: 28px;
  border: none;
  background: none;
  font: 600 13px/1 var(--font);
  color: var(--text-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* ── Layout ──────────────────────────────────────────────────────────────── */
main {
  padding: 28px 32px 48px;
  max-width: 1280px;
  margin: 0 auto;
}
.section { display: none; }
.section.active { display: block; animation: fadeUp .2s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

#back-to-top {
  position: fixed; bottom: 28px; right: 28px; z-index: 200;
  width: 42px; height: 42px;
  background: var(--blue); color: #fff;
  border: none; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,235,0.35);
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(8px);
  transition: opacity .2s, visibility .2s, transform .2s, background .15s;
}
#back-to-top.visible { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
#back-to-top:hover { background: #1d4ed8; }
#back-to-top:active { transform: translateY(1px); }

/* ── KPI row ─────────────────────────────────────────────────────────────── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 16px;
  box-shadow: var(--shadow-s);
}
.kpi-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10px;
}
.kpi-value {
  font-size: 30px;
  font-weight: 800;
  color: var(--text-1);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-value.blue   { color: var(--blue); }
.kpi-value.green  { color: var(--emerald); }
.kpi-value.amber  { color: var(--amber); }

/* ── Card ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-s);
  overflow: hidden;
}
.card-head {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-1);
}
.card-badge {
  font-size: 11px;
  font-weight: 600;
  background: var(--bg);
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 8px;
}
.card-spacer { flex: 1; }
.card-meta {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ── Table ───────────────────────────────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
thead th {
  padding: 10px 20px;
  background: #FAFBFC;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  text-align: right;
  white-space: nowrap;
  user-select: none;
}
thead th.l { text-align: left; }
tbody td {
  padding: 13px 20px;
  border-bottom: 1px solid #F1F5F9;
  text-align: right;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
}
tbody td.l { text-align: left; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #F7F9FF; }
.total-row td {
  background: #F8FAFC;
  border-top: 1px solid var(--border-mid);
  border-bottom: none;
  font-weight: 700;
  color: var(--text-1);
}
.total-row:hover td { background: #F8FAFC; }
.zero { color: var(--text-3); }

/* nurse name chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
}
.avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue-bg);
  color: var(--blue);
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.nurse-name { font-weight: 500; }

/* ── Rate bar ────────────────────────────────────────────────────────────── */
.rate-cell {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}
.bar-track {
  width: 100px;
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  flex-shrink: 0;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
.bar-fill.hi { background: var(--emerald); }
.bar-fill.md { background: var(--amber); }
.bar-fill.lo { background: var(--red); }
.rate-pct {
  font-size: 13.5px;
  font-weight: 700;
  min-width: 46px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.rate-pct.hi { color: var(--emerald); }
.rate-pct.md { color: var(--amber); }
.rate-pct.lo { color: var(--red); }

/* ── States ──────────────────────────────────────────────────────────────── */
.empty {
  padding: 52px 24px;
  text-align: center;
  color: var(--text-3);
}
.empty-icon { font-size: 32px; margin-bottom: 12px; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.empty-sub { font-size: 12.5px; }
.err { color: var(--red); }

/* ── Shimmer ─────────────────────────────────────────────────────────────── */
@keyframes shimmer {
  from { background-position: -500px 0; }
  to   { background-position:  500px 0; }
}
.shim {
  background: linear-gradient(90deg, #EEF2F7 25%, #E2E8F0 50%, #EEF2F7 75%);
  background-size: 500px 100%;
  animation: shimmer 1.3s infinite linear;
  border-radius: 4px;
  display: inline-block;
}
.shim-kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 16px;
}

/* ── Footer note ─────────────────────────────────────────────────────────── */
.foot-note {
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  background: #FAFBFC;
}

/* ── Lab report tab ──────────────────────────────────────────────────────── */
.upload-zone {
  border: 2px dashed var(--border-mid);
  border-radius: var(--radius);
  padding: 32px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  background: #FAFBFC;
  margin-bottom: 22px;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--blue); background: var(--blue-bg); }
.upload-zone input[type=file] { display: none; }
.upload-icon { font-size: 28px; margin-bottom: 10px; }
.upload-label { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.upload-sub { font-size: 12px; color: var(--text-3); }
.upload-btn {
  display: inline-block;
  margin-top: 14px;
  padding: 8px 20px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-s);
  font: 600 13px/1 var(--font);
  cursor: pointer;
  transition: opacity .15s;
}
.upload-btn:hover { opacity: .88; }
.upload-btn:disabled { opacity: .5; cursor: not-allowed; }

.lab-layout {
  display: grid;
  grid-template-columns: 224px 1fr;
  gap: 16px;
  align-items: start;
}
.report-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-s);
  overflow: hidden;
  position: sticky;
  top: 116px;
}
.rp-header {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.rp-item {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 3px solid transparent;
}
.rp-item:last-child { border-bottom: none; }
.rp-item:hover { background: var(--bg); }
.rp-item.active { background: var(--blue-bg); border-left-color: var(--blue); }
.rp-info { flex: 1; min-width: 0; }
.rp-period { font-weight: 700; font-size: 13px; color: var(--text-1); }
.rp-item.active .rp-period { color: var(--blue); }
.rp-date { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.rp-del {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity .12s, color .12s, background .12s;
}
.rp-item:hover .rp-del { opacity: 1; }
.rp-del:hover { color: var(--red); background: #FEF2F2; }

/* verify cards */
.verify-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.verify-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 16px;
  box-shadow: var(--shadow-s);
  position: relative;
}
.verify-card.ok   { border-top: 3px solid var(--emerald); }
.verify-card.warn { border-top: 3px solid var(--amber); }
.verify-card.fail { border-top: 3px solid var(--red); }
.verify-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.verify-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 5px; }
.verify-card.ok   .verify-value { color: var(--emerald); }
.verify-card.warn .verify-value { color: var(--amber); }
.verify-card.fail .verify-value { color: var(--red); }
.verify-stated { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.verify-badge {
  position: absolute;
  top: 16px; right: 16px;
  font-size: 16px;
}

/* note breakdown */
.note-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.note-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}
.note-pill.np { background: #EFF6FF; color: var(--blue); }
.note-pill.n  { background: #F0FDF4; color: var(--emerald); }
.note-pill.p  { background: #FFFBEB; color: var(--amber); }
.note-pill.other { background: var(--bg); color: var(--text-2); }

/* ── Bonus calculator ─────────────────────────────────────────────────────── */
.bonus-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 10px;
}
.btn-sm {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  background: var(--surface);
  color: var(--text-1);
  font: 600 13px/1 var(--font);
  cursor: pointer;
  transition: background .12s, border-color .12s;
  white-space: nowrap;
}
.btn-sm:hover { background: var(--bg); border-color: var(--blue); color: var(--blue); }
.btn-sm.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-sm.primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.bonus-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: 16px;
  align-items: start;
}
.bc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-s);
  display: flex;
  flex-direction: column;
}
.bc-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-l) var(--radius-l) 0 0;
  cursor: grab;
  user-select: none;
}
.bc-hd:active { cursor: grabbing; }
.bc-grip {
  color: var(--text-3);
  font-size: 13px;
  line-height: 1;
  flex-shrink: 0;
  letter-spacing: -1px;
}
.bc.bc-dragging { opacity: 0.4; }
.bc.bc-over { outline: 2px solid var(--blue); outline-offset: -2px; border-radius: var(--radius-l); }
.bonus-std-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--blue-bg);
  border: 1px solid #BFDBFE;
  border-radius: var(--radius);
  padding: 11px 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.bonus-std-bar label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--blue);
  white-space: nowrap;
}
.bonus-std-input {
  border: 1px solid #93C5FD;
  border-radius: var(--radius-s);
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  color: var(--text-1);
  width: 108px;
}
.bonus-std-input:focus { outline: none; border-color: var(--blue); }
.bonus-std-select {
  border: 1px solid #93C5FD;
  border-radius: var(--radius-s);
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--surface);
  color: var(--text-1);
  cursor: pointer;
}
.bc-auto-amt {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  padding: 5px 0 2px;
}
.bc-auto-formula { font-size: 11px; color: var(--text-3); }
.bc-parttime-row { display: flex; align-items: center; gap: 8px; }
.bc-pt-btn {
  font-size: 12px; font-weight: 600;
  padding: 4px 11px;
  border: 1px solid var(--border-mid);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-3);
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
  white-space: nowrap;
}
.bc-pt-btn.active { background: #FFFBEB; border-color: var(--amber); color: var(--amber); }
.bc-pt-wrap { display: flex; align-items: center; gap: 4px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.bc-pt-input-num {
  width: 52px;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  padding: 5px 6px;
  font-size: 13px; text-align: right;
  font-variant-numeric: tabular-nums;
  background: var(--surface); color: var(--text-1);
  font-family: var(--font);
}
.bc-pt-input-num:focus { outline: none; border-color: var(--amber); }
.bc-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.bc-name { font-weight: 700; font-size: 14px; flex: 1; }
.bc-del {
  background: none; border: none; cursor: pointer;
  color: var(--text-3); font-size: 17px; line-height: 1;
  padding: 2px 5px; border-radius: 4px;
  transition: background .12s, color .12s;
}
.bc-del:hover { background: var(--border); color: var(--text-1); }
.bc-body {
  padding: 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.bc-field-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 7px;
}
.bc-dates {
  display: flex;
  align-items: center;
  gap: 5px;
}
.bc-dates input[type=date] {
  flex: 1; min-width: 0;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  padding: 6px 8px;
  font-size: 12.5px;
  background: var(--surface);
  color: var(--text-1);
  font-family: var(--font);
}
.bc-dates input[type=date]:focus { outline: none; border-color: var(--blue); }
.bc-dates-sep { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
.bc-days {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.bc-money-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  overflow: hidden;
}
.bc-currency {
  padding: 0 10px;
  font-size: 12px;
  color: var(--text-2);
  background: var(--bg);
  border-right: 1px solid var(--border-mid);
  display: flex; align-items: center;
  white-space: nowrap;
  flex-shrink: 0;
}
.bc-money-row input[type=number] {
  flex: 1; border: none; padding: 7px 10px;
  font-size: 13px; background: transparent;
  color: var(--text-1); font-family: var(--font);
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.bc-money-row input[type=number]:focus { outline: none; }
.bc-score-rows { display: flex; flex-direction: column; gap: 9px; }
.bc-score-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bc-score-name {
  flex: 1;
  font-size: 13px;
  color: var(--text-2);
}
.bc-score-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
}
.bc-score-input {
  width: 54px;
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  padding: 5px 6px;
  font-size: 13px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  color: var(--text-1);
  font-family: var(--font);
}
.bc-score-input:focus { outline: none; border-color: var(--blue); }
.bc-pct { font-size: 12px; color: var(--text-3); }
.bc-result {
  border-top: 2px solid var(--border);
  padding: 15px 16px;
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 0 0 var(--radius-l) var(--radius-l);
}
.bc-result-item { display: flex; flex-direction: column; gap: 3px; }
.bc-result-item:last-child { text-align: right; }
.bc-result-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.bc-avg-val {
  font-size: 22px; font-weight: 800;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.bc-final-val {
  font-size: 22px; font-weight: 800;
  color: var(--blue);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

/* ── Schedule ────────────────────────────────────────────────────────────── */
.sched-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
  gap: 16px;
  align-items: start;
}
.sched-nurse-card .card-head { padding: 13px 18px; }
.sched-total-badge { font-size: 13.5px; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; }
.sched-mini { width: 100%; border-collapse: collapse; }
.sched-mini th, .sched-mini td { padding: 7px 3px; text-align: center; }
.sched-mini thead th {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.sched-mini thead th.l, .sched-mini tbody td.l {
  text-align: left;
  padding-left: 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  white-space: nowrap;
}
.sched-mini tbody tr:not(:last-child) td { border-bottom: 1px solid #F1F5F9; }
.sched-day-head .dow { display: block; font-size: 11px; }
.sched-day-head .dnum { display: block; font-size: 9.5px; color: var(--text-3); font-weight: 600; margin-top: 1px; }
.sched-time-pair {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.sched-time-select {
  width: 60px;
  border: 1px solid var(--border-mid);
  border-radius: 5px;
  padding: 3px 1px;
  font-size: 10.5px;
  font-family: var(--font);
  background: var(--surface);
  color: var(--text-1);
  text-align: center;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.sched-time-select:focus { outline: none; border-color: var(--blue); }
.sched-fill-btn {
  margin-left: 4px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-3);
  font-size: 11px;
  padding: 1px 4px;
  border-radius: 4px;
  vertical-align: middle;
  transition: background .12s, color .12s;
}
.sched-fill-btn:hover { background: var(--bg); color: var(--blue); }

@media print {
  .topbar, .tabbar, #back-to-top, .bonus-toolbar { display: none !important; }
  main { padding: 0; max-width: none; }
  .section { display: none !important; }
  .section.active { display: block !important; }
  .bonus-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .bc { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  #schedule tbody tr { break-inside: avoid; }
}

/* ── LINE notification ──────────────────────────────────────────────────────── */
.ln-form { padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.ln-field { display: flex; flex-direction: column; gap: 4px; }
.ln-field label { font-size: 11px; font-weight: 700; color: var(--text-2); }
.ln-input {
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-s);
  padding: 7px 10px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--surface);
  color: var(--text-1);
}
.ln-input:focus { outline: none; border-color: var(--blue); }
.ln-check { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-2); cursor: pointer; padding-bottom: 7px; }
.ln-progress { padding: 0 24px 18px; }
.ln-progress-status { font-size: 12.5px; color: var(--text-2); margin: 0 0 8px; }
.ln-progress-track { background: var(--bg); border-radius: 999px; height: 7px; overflow: hidden; }
.ln-progress-bar { background: var(--blue); height: 100%; width: 0%; transition: width .3s; }
.ln-detail { font-size: 11px; color: var(--text-3); }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-icon">診</div>
    <span class="brand-name">診所管理後台</span>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-sub">管理員專用</span>
</header>

<div class="tabbar">
  <button class="tab active" data-section="nurses">護理師統計</button>
  <button class="tab"        data-section="doctors">醫師回診率</button>
  <button class="tab"        data-section="labreport">代檢對帳單</button>
  <button class="tab"        data-section="bonus">不定期獎金</button>
  <button class="tab"        data-section="linenotify">LINE 通知</button>

</div>

<main>

  <!-- ── Nurses ── -->
  <section id="nurses" class="section active">
    <div class="section-bar">
      <div class="month-picker">
        <button class="mp-btn prev-month">&#8592;</button>
        <span class="month-display">—</span>
        <button class="mp-btn next-month">&#8594;</button>
      </div>
    </div>
    <div class="kpi-row" id="nurse-kpis"></div>
    <div class="card">
      <div class="card-head">
        <span class="card-title">護理師活動明細</span>
        <span class="card-spacer"></span>
        <span class="card-meta" id="nurse-meta"></span>
      </div>
      <div class="tbl-wrap" id="nurses-body"></div>
    </div>
  </section>

  <!-- ── Lab Report ── -->
  <section id="labreport" class="section">

    <!-- Upload zone -->
    <div class="upload-zone" id="upload-zone" onclick="$('file-input').click()">
      <input type="file" id="file-input" accept=".xlsx">
      <div class="upload-icon">📊</div>
      <div class="upload-label">拖曳 xlsx 檔案至此，或點擊上傳</div>
      <div class="upload-sub">院所明申報暨代檢費對帳單</div>
      <div id="upload-status" style="margin-top:10px;font-size:12.5px;color:var(--text-3)"></div>
    </div>

    <!-- Two-panel: report list + detail -->
    <div class="lab-layout" id="lab-layout" style="display:none">
      <div class="report-panel" id="report-list"></div>
      <div id="labreport-body"></div>
    </div>

  </section>

  <!-- ── Doctors ── -->
  <section id="doctors" class="section">
    <div class="section-bar">
      <div class="month-picker">
        <button class="mp-btn prev-month">&#8592;</button>
        <span class="month-display">—</span>
        <button class="mp-btn next-month">&#8594;</button>
      </div>
    </div>
    <div class="kpi-row" id="doctor-kpis"></div>
    <div class="card">
      <div class="card-head">
        <span class="card-title">醫師回診率</span>
        <span class="card-badge">90天・同一醫師</span>
        <span class="card-spacer"></span>
        <span class="card-meta" id="doctor-meta"></span>
      </div>
      <div class="tbl-wrap" id="doctors-body"></div>
      <div class="foot-note">
        統計方式：計算該月每位患者最後一次就診日，90天內回診同一醫師即計入。
        近期月份因後續IC檔案尚未到齊，回診率可能偏低屬正常現象。
      </div>
    </div>
  </section>

  <!-- ── Bonus ── -->
  <section id="bonus" class="section">
    <div class="bonus-toolbar">
      <div style="display:flex;gap:8px">
        <button class="btn-sm primary" onclick="addBonusCardPrompt()">＋ 新增護理師</button>
        <button class="btn-sm" id="btn-prorata" onclick="toggleProrata()">依比例計算</button>
      </div>
      <button class="btn-sm" onclick="window.print()">列印</button>
    </div>
    <div class="bonus-std-bar" id="bonus-std-bar" style="display:none">
      <label>標準金額</label>
      <div class="bc-money-row" style="width:150px">
        <span class="bc-currency">NT$</span>

               style="border:none;width:100%" oninput="recalcAllBonus()">

    </div>
    <div class="bonus-grid" id="bonus-grid"></div>
  </section>

  <!-- ── LINE 通知 ── -->
  <section id="linenotify" class="section">
    <div class="card" style="margin-bottom:20px">
      <div class="card-head">
        <span class="card-title">批次發送LINE通知</span>
        <span class="card-spacer"></span>
        <button class="btn-sm" style="border-color:var(--red);color:var(--red)" onclick="stopLineAutomation()">停止／重啟瀏覽器</button>
        <span class="card-meta">尚未在 PC1 完整驗證，謹慎使用</span>
      </div>
      <div class="ln-form">
        <div class="ln-field">
          <label>類別</label>
          <select id="ln-category" class="ln-input">
            <option value="慢簽">慢簽</option>
            <option value="代謝症候群">代謝症候群</option>
            <option value="B肝">B肝</option>
          </select>
        </div>
        <div class="ln-field">
          <label>限制人數（留空＝全部）</label>
          <input type="number" id="ln-limit" class="ln-input" min="1" placeholder="全部" style="width:110px">
        </div>
        <label class="ln-check"><input type="checkbox" id="ln-dryrun" checked> 測試模式（不會真的發送）</label>
        <button class="btn-sm primary" onclick="startLineBatch()">發送</button>
      </div>
      <div class="ln-progress" id="ln-progress-wrap" style="display:none">
        <p class="ln-progress-status" id="ln-status"></p>
        <div class="ln-progress-track"><div class="ln-progress-bar" id="ln-progress-bar"></div></div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">發送記錄</span>
        <span class="card-spacer"></span>
        <button class="btn-sm" onclick="loadLineLog()">重新整理</button>

  <!-- ── Schedule ── -->
  <section id="schedule" class="section">
    <div class="bonus-toolbar sched-toolbar">
      <div class="week-picker">
        <button class="mp-btn prev-week">&#8592;</button>
        <span class="week-display" id="sched-week-display">—</span>
        <button class="mp-btn next-week">&#8594;</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-sm" onclick="copyLastWeek()">複製上週</button>
        <button class="btn-sm" onclick="window.print()">列印</button>

</main>

<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂端">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
    <path fill-rule="evenodd" d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"/>
  </svg>
</button>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
const today = new Date();
let month = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
let activeSection = 'nurses';

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function shiftMonth(m, delta) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toISO(d);
}
function mondayOf(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  return toISO(m);
}
function fmtMD(iso) {
  const [, m, d] = iso.split('-').map(Number);
  return `${m}/${d}`;
}
const DOW_LABELS = ['一', '二', '三', '四', '五', '六', '日'];
let weekStart = mondayOf(today);

async function api(path) {
  const r = await fetch(path, { credentials: 'include' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function rateLevel(r) { return r >= 70 ? 'hi' : r >= 40 ? 'md' : 'lo'; }

function shimBlock(w, h) {
  return `<span class="shim" style="width:${w};height:${h}px"></span>`;
}
function shimKPI(n) {
  return Array.from({length: n}, () =>
    `<div class="shim-kpi">${shimBlock('55%',10)}<br><br>${shimBlock('35%',26)}</div>`
  ).join('');
}
function shimTable(rows, cols) {
  const ws = ['38%','13%','13%','13%','13%','13%','13%'];
  const td = (i) => `<td class="${i===0?'l':''}">${shimBlock(ws[i]||'13%', 14)}</td>`;
  const tr = `<tr>${Array.from({length:cols},(_,i)=>td(i)).join('')}</tr>`;
  return `<table><tbody>${tr.repeat(rows)}</tbody></table>`;
}

// ── Month nav ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.prev-month').forEach(b => b.onclick = () => { month = shiftMonth(month, -1); refresh(); });
document.querySelectorAll('.next-month').forEach(b => b.onclick = () => { month = shiftMonth(month, +1); refresh(); });

// ── Week nav (schedule) ──────────────────────────────────────────────────────
document.querySelectorAll('.prev-week').forEach(b => b.onclick = () => { weekStart = addDays(weekStart, -7); loadSchedule(); });
document.querySelectorAll('.next-week').forEach(b => b.onclick = () => { weekStart = addDays(weekStart, 7); loadSchedule(); });

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    activeSection = btn.dataset.section;
    $(activeSection).classList.add('active');
    load(activeSection);
  };
});

// ── Nurse constants ───────────────────────────────────────────────────────────
const COLS = [
  ['contacted', '已通知'],
  ['called',    '再次通知'],
  ['mspt',      '完成MSPT'],
  ['excluded',  '排除'],
  ['pickup',    '手動取藥'],
];

// ── Nurses ────────────────────────────────────────────────────────────────────
async function loadNurses() {
  $('nurse-kpis').innerHTML = shimKPI(4);
  $('nurses-body').innerHTML = shimTable(5, 7);
  $('nurse-meta').textContent = '';

  try {
    const { stats } = await api(`/api/admin/stats?month=${month}`);
    renderNurses(stats);
  } catch(e) {
    $('nurse-kpis').innerHTML = '';
    $('nurses-body').innerHTML = errState(e.message);
  }
}

function renderNurses(stats) {
  // totals
  const tot = Object.fromEntries(COLS.map(([k]) => [k, 0]));
  Object.values(stats).forEach(s => COLS.forEach(([k]) => { tot[k] += s[k] || 0; }));
  const grand = Object.values(tot).reduce((a,b)=>a+b, 0);

  // KPIs
  const kpiDefs = [
    { label: '已通知',   value: tot.contacted, cls: 'blue'  },
    { label: '再次通知', value: tot.called,    cls: ''      },
    { label: '完成MSPT', value: tot.mspt,      cls: 'green' },
    { label: '手動取藥', value: tot.pickup,    cls: ''      },
  ];
  $('nurse-kpis').innerHTML = kpiDefs.map(k =>
    `<div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value ${k.cls}">${k.value}</div>
    </div>`
  ).join('');

  $('nurse-meta').textContent = grand ? `共 ${grand} 筆` : '';

  // sort nurses: alphabetical, （未選擇） last
  const nurses = Object.keys(stats).sort((a, b) =>
    (a === '（未選擇）') - (b === '（未選擇）') || a.localeCompare(b, 'zh-TW')
  );

  if (!nurses.length) {
    $('nurses-body').innerHTML = emptyState('📭', '本月尚無紀錄', '');
    return;
  }

  const rows = nurses.map(n => {
    const s = stats[n] || {};
    const rowTot = COLS.reduce((a,[k]) => a + (s[k]||0), 0);
    const initial = n === '（未選擇）' ? '?' : n[0];
    return `<tr>
      <td class="l">
        <span class="chip">
          <span class="avatar">${initial}</span>
          <span class="nurse-name">${n}</span>
        </span>
      </td>
      ${COLS.map(([k]) => {
        const v = s[k] || 0;
        return `<td class="${v===0?'zero':''}">${v}</td>`;
      }).join('')}
      <td><strong>${rowTot}</strong></td>
    </tr>`;
  }).join('');

  const totalRow = `<tr class="total-row">
    <td class="l">合計</td>
    ${COLS.map(([k]) => `<td>${tot[k]}</td>`).join('')}
    <td>${grand}</td>
  </tr>`;

  const thead = `<tr>
    <th class="l">護理師</th>
    ${COLS.map(([,l]) => `<th>${l}</th>`).join('')}
    <th>合計</th>
  </tr>`;

  $('nurses-body').innerHTML =
    `<table><thead>${thead}</thead><tbody>${rows}${totalRow}</tbody></table>`;
}

// ── Doctors ───────────────────────────────────────────────────────────────────
async function loadDoctors() {
  $('doctor-kpis').innerHTML = shimKPI(3);
  $('doctors-body').innerHTML = shimTable(4, 4);
  $('doctor-meta').textContent = '';

  try {
    const { doctors } = await api(`/api/admin/doctors?month=${month}`);
    renderDoctors(doctors);
  } catch(e) {
    $('doctor-kpis').innerHTML = '';
    $('doctors-body').innerHTML = errState(e.message);
  }
}

function renderDoctors(doctors) {
  if (!doctors.length) {
    $('doctor-kpis').innerHTML = '';
    $('doctors-body').innerHTML = emptyState(
      '📊', '本月暫無資料',
      'IC檔案可能尚未生成，或該月份無診次'
    );
    return;
  }

  const totalPts = doctors.reduce((a,d) => a + d.total, 0);
  const totalRet = doctors.reduce((a,d) => a + d.returned, 0);
  const avg = totalPts ? (totalRet / totalPts * 100).toFixed(1) : '—';
  const avgLevel = totalPts ? rateLevel(+avg) : '';

  $('doctor-kpis').innerHTML = [
    { label: '整體回診率', value: totalPts ? `${avg}%` : '—', cls: avgLevel === 'hi' ? 'green' : avgLevel === 'md' ? 'amber' : 'blue' },
    { label: '總看診人次', value: totalPts, cls: '' },
    { label: '已回診人次', value: totalRet, cls: '' },
  ].map(k =>
    `<div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value ${k.cls}">${k.value}</div>
    </div>`
  ).join('');

  $('doctor-meta').textContent = `${doctors.length} 位醫師`;

  const rows = doctors.map(d => {
    const lv = rateLevel(d.rate);
    return `<tr>
      <td class="l"><strong>${d.doctor || '（未知）'}</strong></td>
      <td>${d.total}</td>
      <td>${d.returned}</td>
      <td>
        <div class="rate-cell">
          <div class="bar-track">
            <div class="bar-fill ${lv}" style="width:${Math.min(d.rate,100)}%"></div>
          </div>
          <span class="rate-pct ${lv}">${d.rate}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  const thead = `<tr>
    <th class="l">醫師</th>
    <th>看診人次</th>
    <th>回診人次</th>
    <th style="min-width:190px">回診率</th>
  </tr>`;

  $('doctors-body').innerHTML =

async function loadLabReport() {
  try {
    const reports = await api('/api/admin/lab-reports');
    if (!reports.length) {
      $('lab-layout').style.display = 'none';
      $('labreport-body').innerHTML = '';
      return;
    }
    $('lab-layout').style.display = 'grid';
    $('report-list').innerHTML =
      `<div class="rp-header">已儲存報告 <span style="font-weight:400">(${reports.length})</span></div>` +
      reports.map(r => {
        const label = formatPeriod(r.period) || r.filename;
        const date  = (r.uploaded_at || '').slice(0, 10);
        return `<div class="rp-item" data-id="${r.id}" onclick="selectReport(${r.id})">
          <div class="rp-info">
            <div class="rp-period">${label}</div>
            <div class="rp-date">${date}</div>
          </div>
          <button class="rp-del" onclick="deleteReport(event,${r.id})" title="刪除">×</button>
        </div>`;
      }).join('');
    selectReport(reports[0].id);
  } catch(e) {
    $('labreport-body').innerHTML = errState(e.message);

function selectReport(id) {
  document.querySelectorAll('.rp-item').forEach(el =>
    el.classList.toggle('active', +el.dataset.id === +id)
  );
  showReport(id);
}

async function showReport(id) {
  $('labreport-body').innerHTML = shimTable(4, 6);
  try {
    const r = await api(`/api/admin/lab-report/${id}`);
    $('labreport-body').innerHTML = renderLabReport(r);
  } catch(e) {
    $('labreport-body').innerHTML = errState(e.message);
  }
}

async function deleteReport(e, id) {
  e.stopPropagation();
  if (!confirm('確定刪除此報告？')) return;
  try {
    const res = await fetch(`/api/admin/lab-report/${id}`, { method: 'DELETE', credentials: 'include' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await loadLabReport();
  } catch(e2) {
    alert(`刪除失敗：${e2.message}`);
  }
}

// Upload
const fileInput = $('file-input');
const uploadZone = $('upload-zone');
const uploadStatus = $('upload-status');

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) doUpload(fileInput.files[0]);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.xlsx')) doUpload(f);
  else uploadStatus.textContent = '請選擇 .xlsx 檔案';
});

async function doUpload(file) {
  uploadZone.style.pointerEvents = 'none';
  uploadStatus.textContent = `正在解析 ${file.name}…`;
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/admin/lab-report', {
      method: 'POST', credentials: 'include', body: fd,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    uploadStatus.textContent = '上傳成功！';
    await loadLabReport();
  } catch(e) {
    uploadStatus.textContent = `上傳失敗：${e.message}`;
  } finally {
    uploadZone.style.pointerEvents = '';
    fileInput.value = '';
  }
}

function fmt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('zh-TW');
}

function formatPeriod(period) {
  if (!period) return null;
  const m = period.match(/^(\d+)-(\d+)$/);
  if (!m) return period;
  return `${m[1]}年${parseInt(m[2])}月`;
}

function verifyCard(label, computed, stated, opts = {}) {
  if (stated == null) return '';
  const diff = Math.abs(computed - stated);
  const roundingOnly = diff < 1 && diff > 0;
  const match = diff === 0;
  const cls = match ? 'ok' : roundingOnly ? 'warn' : 'fail';
  const icon = match ? '✓' : roundingOnly ? '≈' : '✗';
  const statedNote = opts.statedLabel || `申報值 ${fmt(stated)}`;
  const diffNote = (!match && !roundingOnly) ? `　差 ${fmt(diff)}` : roundingOnly ? '　（小數四捨五入）' : '';
  return `<div class="verify-card ${cls}">
    <div class="verify-badge">${icon}</div>
    <div class="verify-label">${label}</div>
    <div class="verify-value">${fmt(computed)}</div>
    <div class="verify-stated">${statedNote}${diffNote}</div>
  </div>`;
}

function renderLabReport(r) {
  const { stated, computed, summary, top_tests_freq, top_tests_pts } = r;
  const s = stated;

  // Verification cards
  const verifySection = `
    <div class="verify-grid">
      ${verifyCard('申報點數', computed['申報點數'], s['申報點數'])}
      ${verifyCard('代收稅額', computed['代收稅額'], s['代收稅額'])}
      ${verifyCard('代檢費用', computed['代檢費用'], s['代檢費用'])}
      ${verifyCard('申報件數', computed['申報件數'], s['申報件數'])}
    </div>`;

  // Summary KPIs
  const summaryKPIs = `
    <div class="kpi-row" style="margin-bottom:22px">
      <div class="kpi-card">
        <div class="kpi-label">應收金額</div>
        <div class="kpi-value" style="font-size:22px">${fmt(s['應收金額'])}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">暫收款</div>
        <div class="kpi-value" style="font-size:22px">${fmt(s['暫收款'])}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">受檢患者數</div>
        <div class="kpi-value blue" style="font-size:22px">${summary.unique_patients}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">工作天數</div>
        <div class="kpi-value" style="font-size:22px">${summary.working_days}</div>
      </div>
    </div>`;

  // 備註 pills
  const nc = summary.note_counts || {};
  const pills = Object.entries(nc).map(([k, v]) => {
    const cls = k === 'NP' ? 'np' : k === 'N' ? 'n' : k === 'P' ? 'p' : 'other';
    const desc = k === 'NP' ? '申報＋代檢' : k === 'N' ? '申報' : k === 'P' ? '代檢' : k;
    return `<span class="note-pill ${cls}">${desc} ${v} 筆</span>`;
  }).join('');

  // Top tests tables
  const freqRows = (top_tests_freq || []).map(t =>
    `<tr><td class="l">${t.name}</td><td>${t.count}</td></tr>`).join('');
  const ptsRows = (top_tests_pts || []).map(t =>
    `<tr><td class="l">${t.name}</td><td>${fmt(t.pts)}</td></tr>`).join('');

  const testTables = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px">
      <div class="card">
        <div class="card-head"><span class="card-title">最多申請項目</span><span class="card-meta">依件數</span></div>
        <div class="tbl-wrap"><table><thead><tr><th class="l">項目名稱</th><th>件數</th></tr></thead>
        <tbody>${freqRows}</tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">最多申報點數項目</span><span class="card-meta">依點數</span></div>
        <div class="tbl-wrap"><table><thead><tr><th class="l">項目名稱</th><th>點數</th></tr></thead>
        <tbody>${ptsRows}</tbody></table></div>
      </div>
    </div>`;

  const meta = `<div style="font-size:12px;color:var(--text-3);margin-bottom:16px">
    ${s['院所名稱'] || ''}&ensp;${s['院所代號'] ? `(${s['院所代號']})` : ''}&ensp;
    ${r.period ? `期間：${formatPeriod(r.period)}` : ''}&ensp;
    上傳日：${(r.uploaded_at || '').slice(0,10)}
  </div>`;

  const noteCard = `<div class="card" style="margin-bottom:0">
    <div class="card-head"><span class="card-title">項目類型分布</span></div>
    <div style="padding:16px 24px">
      <div class="note-pills">${pills}</div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-3)">
        NP = 同時申報健保＋代檢費　N = 僅健保申報　P = 僅代檢費
      </div>
    </div>
  </div>`;

  return meta + verifySection + summaryKPIs + noteCard + testTables;
}

function _refDays() {
  const refName = ($('bonus-std-ref') || {}).value || '';
  if (!refName) return 0;
  const refCard = [...document.querySelectorAll('#bonus-grid > .bc')]
    .find(c => c.querySelector('.bc-name').textContent === refName);
  if (!refCard) return 0;
  const rs = refCard.querySelector('.bc-start').value;
  const re = refCard.querySelector('.bc-end').value;
  return (rs && re && re >= rs)
    ? Math.round((new Date(re) - new Date(rs)) / 86400000) + 1
    : 0;
}

function _recalcOne(card) {
  // Days
  const start  = card.querySelector('.bc-start').value;
  const end    = card.querySelector('.bc-end').value;
  const daysEl = card.querySelector('.bc-days');
  let days = 0;
  if (start && end && end >= start) {
    days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
    daysEl.textContent = `共 ${days} 天`;
  } else {
    daysEl.textContent = '';
  }

  // Base amount
  let base = 0;
  if (_prorataMode) {
    const stdAmt = parseFloat(($('bonus-std-amt') || {}).value) || 0;
    const refD   = _refDays();
    const refName = ($('bonus-std-ref') || {}).value || '';
    if (refD > 0 && days > 0) {
      base = stdAmt * days / refD;
      card.querySelector('.bc-auto-amt').textContent =
        'NT$ ' + Math.round(base).toLocaleString('zh-TW');
      card.querySelector('.bc-auto-formula').textContent =
        `${stdAmt.toLocaleString('zh-TW')} × ${days} ÷ ${refD} 天（${refName}）`;
    } else {
      card.querySelector('.bc-auto-amt').textContent = '—';
      card.querySelector('.bc-auto-formula').textContent =
        refName ? '請確認基準護理師的日期範圍' : '請選擇基準護理師';
    }
  } else {
    base = parseFloat(card.querySelector('.bc-base-amt').value) || 0;
  }

  // Scores
  const scores = [...card.querySelectorAll('.bc-score-input')]
    .map(i => Math.min(100, Math.max(0, parseFloat(i.value) || 0)));
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;

  // Part-time multiplier
  const ptBtn    = card.querySelector('.bc-pt-btn');
  const ptActive = ptBtn && ptBtn.classList.contains('active');
  const ptPct    = ptActive ? (parseFloat(card.querySelector('.bc-pt-input-num').value) || 50) : 100;

  const avgLabel = card.querySelector('.bc-result-label');
  const avgVal   = card.querySelector('.bc-avg');
  if (ptActive) {
    avgLabel.textContent = '兼職 × 分數';
    avgVal.textContent   = `${ptPct}% × ${avg.toFixed(1)}%`;
  } else {
    avgLabel.textContent = '平均分數';
    avgVal.textContent   = avg.toFixed(1) + '%';
  }

  // Final
  const final = base * (ptPct / 100) * (avg / 100);
  card.querySelector('.bc-final').textContent =
    base > 0 ? 'NT$ ' + Math.round(final).toLocaleString('zh-TW') : '—';
}

function recalcCard(el) {
  const card = el.closest('.bc');
  if (!card) return;
  _recalcOne(card);
  // If this card is the reference nurse, ripple to all other cards
  if (_prorataMode) {
    const refName = ($('bonus-std-ref') || {}).value || '';
    if (refName && card.querySelector('.bc-name').textContent === refName) {
      document.querySelectorAll('#bonus-grid > .bc').forEach(c => { if (c !== card) _recalcOne(c); });
    }
  }
}

function recalcAllBonus() {

let _dragSrc = null;

function initBonusDrag(card) {
  card.setAttribute('draggable', 'true');

  card.addEventListener('dragstart', e => {
    _dragSrc = card;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => card.classList.add('bc-dragging'), 0);
  });

  card.addEventListener('dragend', () => {
    card.classList.remove('bc-dragging');
    document.querySelectorAll('.bc-over').forEach(c => c.classList.remove('bc-over'));
    _dragSrc = null;
  });

  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });

  card.addEventListener('dragenter', e => {
    e.preventDefault();
    if (_dragSrc && _dragSrc !== card) card.classList.add('bc-over');
  });

  card.addEventListener('dragleave', e => {
    if (!card.contains(e.relatedTarget)) card.classList.remove('bc-over');
  });

  card.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    if (!_dragSrc || _dragSrc === card) return;
    const grid = $('bonus-grid');
    const all  = [...grid.querySelectorAll(':scope > .bc')];
    const si   = all.indexOf(_dragSrc);
    const ti   = all.indexOf(card);
    grid.insertBefore(_dragSrc, si < ti ? card.nextSibling : card);
    card.classList.remove('bc-over');
  });
}

const LN_STATUS_LABEL = {
  sent: '已發送', dry_run_ok: '測試通過', not_found: '找不到病患',
  template_not_found: '找不到範本', tag_not_found: '找不到標籤', error: '錯誤',
};
const LN_STATUS_COLOR = {
  sent: 'var(--emerald)', dry_run_ok: 'var(--blue)', not_found: 'var(--amber)',
  template_not_found: 'var(--amber)', tag_not_found: 'var(--amber)', error: 'var(--red)',
};

let _lnPolling = null;

async function startLineBatch() {
  const category = $('ln-category').value;
  const limitVal = $('ln-limit').value.trim();
  const limit = limitVal ? parseInt(limitVal, 10) : null;
  const dryRun = $('ln-dryrun').checked;

  const modeLabel = dryRun ? '測試模式（不會真的發送）' : '正式發送';
  const countLabel = limit ? `最多 ${limit} 位` : '全部待聯絡';
  if (!confirm(`即將以「${modeLabel}」處理 ${category}（${countLabel}）病患的LINE通知，確定繼續嗎？`)) return;

  $('ln-progress-wrap').style.display = 'block';
  $('ln-status').textContent = '啟動中…';
  $('ln-progress-bar').style.width = '0%';

  try {
    const res = await fetch('/api/send-line-notifications', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, nurse: 'admin', dry_run: dryRun, limit }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    if (!data.started) {
      $('ln-status').textContent = data.detail || '沒有符合條件的病患';
      return;
    }
    _pollLineBatch();
  } catch (err) {
    $('ln-status').textContent = '啟動失敗：' + err.message;
  }
}

async function _pollLineBatch() {
  try {
    const res = await fetch('/api/send-line-notifications/status', { credentials: 'include' });
    const state = await res.json();
    const total = state.total || 0;
    const done = (state.results || []).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $('ln-progress-bar').style.width = pct + '%';

    let label = state.running ? `處理中… ${done}/${total}` : `完成：${done}/${total}`;
    if (state.dry_run) label = `[測試模式] ${label}`;
    if (state.error) label += ` — 發生錯誤：${state.error}`;
    $('ln-status').textContent = label;

    if (state.running) {
      _lnPolling = setTimeout(_pollLineBatch, 2000);
    } else {
      _lnPolling = null;
      loadLineLog();
    }
  } catch (err) {
    $('ln-status').textContent = '查詢進度失敗：' + err.message;
  }
}

async function stopLineAutomation() {
  if (!confirm('確定要停止目前的批次發送並關閉自動化瀏覽器嗎？\n注意：瀏覽器關閉後，下次使用可能需要重新登入 Alleypin。')) return;
  try {
    const res = await fetch('/api/send-line-notifications/cancel', { method: 'POST', credentials: 'include' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);

    if (_lnPolling) { clearTimeout(_lnPolling); _lnPolling = null; }

    let msg = data.cancelled ? '已取消目前的批次發送。' : '目前沒有正在執行的批次。';
    msg += data.browser_stopped ? ' 自動化瀏覽器已關閉，下次使用會重新開啟一個新的。' : ' 自動化瀏覽器目前不是執行中的狀態。';
    alert(msg);

    $('ln-status').textContent = '已停止';
    loadLineLog();
  } catch (err) {
    alert('停止失敗：' + err.message);
  }
}

async function loadLineLog() {
  $('linenotify-body').innerHTML = shimTable(8, 8);
  try {
    const rows = await api('/api/admin/line-notification-log');
    renderLineLog(rows);
  } catch (err) {
    $('linenotify-body').innerHTML = errState(err.message);
  }
}

function renderLineLog(rows) {
  if (!rows.length) {
    $('linenotify-body').innerHTML = emptyState('📨', '尚無發送記錄', '');
    return;
  }
  const trs = rows.map(r => {
    const canUndo = r.status === 'sent' && !r.dry_run && !r.undone_at;
    const statusHtml = r.undone_at
      ? `<span style="color:var(--text-3)">已復原</span>`
      : `<span style="color:${LN_STATUS_COLOR[r.status] || 'var(--text-2)'};font-weight:600">${LN_STATUS_LABEL[r.status] || r.status}</span>`;
    return `<tr>
      <td class="l">${r.name} <span style="color:var(--text-3);font-size:11px">${r.chart_number}</span></td>
      <td class="l">${r.category}</td>
      <td class="l">${r.template}</td>
      <td class="l">${statusHtml}<div class="ln-detail">${r.detail || ''}</div></td>
      <td>${r.dry_run ? '測試' : '正式'}</td>
      <td class="l">${r.sent_at} ${r.sent_time || ''}</td>
      <td class="l">${r.nurse || ''}</td>
      <td>${canUndo ? `<button class="btn-sm" onclick="undoLineLog(${r.id}, this)">復原</button>` : ''}</td>
    </tr>`;
  }).join('');
  const thead = `<tr>
    <th class="l">病患</th><th class="l">類別</th><th class="l">範本</th><th class="l">狀態</th>
    <th>模式</th><th class="l">發送時間</th><th class="l">操作人員</th><th></th>
  </tr>`;
  $('linenotify-body').innerHTML = `<table><thead>${thead}</thead><tbody>${trs}</tbody></table>`;
}

async function undoLineLog(id, btn) {
  if (!confirm('確定要從 Alleypin 移除這則通知標籤嗎？')) return;
  btn.disabled = true;
  btn.textContent = '處理中…';
  try {
    const res = await fetch(`/api/admin/line-notification-log/${id}/undo`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nurse: 'admin', dry_run: false }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    if (data.status !== 'sent') throw new Error(data.detail || data.status);
    await loadLineLog();
  } catch (err) {
    alert('復原失敗：' + err.message);
    btn.disabled = false;
    btn.textContent = '復原';
  }
}

// ── Schedule ──────────────────────────────────────────────────────────────────
let nursesCache = [];
let shiftsCache = [];
const SLOTS = ['早診', '午診', '晚診'];

const SLOT_RANGE = {
  '早診': ['08:00', '13:00'],
  '午診': ['15:00', '20:00'],
  '晚診': ['18:00', '21:30'],
};

function timeRangeOptions([startStr, endStr]) {
  const [sh, sm] = startStr.split(':').map(Number);
  const [eh, em] = endStr.split(':').map(Number);
  const startMin = sh * 60 + sm, endMin = eh * 60 + em;
  const opts = [];
  for (let t = startMin; t <= endMin; t += 15) {
    opts.push(`${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`);
  }
  return opts;
}

const SLOT_TIME_OPTIONS = Object.fromEntries(SLOTS.map(slot => [slot, timeRangeOptions(SLOT_RANGE[slot])]));

function timeSelectOptions(selected, slot) {
  const opts = SLOT_TIME_OPTIONS[slot]
    .map(t => `<option value="${t}"${t === selected ? ' selected' : ''}>${t}</option>`).join('');
  return `<option value=""></option>${opts}`;
}

function timeDiffHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;  // safety for an overnight entry, not expected in practice
  return diff / 60;
}

function calcWeeklyHours(nurse) {
  return shiftsCache
    .filter(s => s.nurse === nurse && s.start_time && s.end_time)
    .reduce((sum, s) => sum + timeDiffHours(s.start_time, s.end_time), 0);
}

async function loadSchedule() {
  $('sched-week-display').textContent = `${fmtMD(weekStart)} – ${fmtMD(addDays(weekStart, 6))}`;
  $('sched-grid').innerHTML = shimTable(4, 8);
  try {
    const [nurses, shifts] = await Promise.all([
      api('/api/nurses'),
      api(`/api/admin/shifts?week_start=${weekStart}`),
    ]);
    nursesCache = nurses;
    shiftsCache = shifts;
    renderGrid(nurses);
  } catch (e) {
    $('sched-grid').innerHTML = errState(e.message);
  }
}

function renderGrid(nurses) {
  if (!nurses.length) {
    $('sched-grid').innerHTML = emptyState('🗓️', '尚無護理師名單', '');
    return;
  }

  const cellMap = {};
  shiftsCache.forEach(s => { cellMap[`${s.nurse}|${s.shift_date}|${s.slot}`] = s; });

  const days = Array.from({length: 7}, (_, i) => addDays(weekStart, i));
  const dayHeadCells = days.map((d, i) =>
    `<th class="sched-day-head"><span class="dow">${DOW_LABELS[i]}</span><span class="dnum">${fmtMD(d)}</span></th>`
  ).join('');

  const cards = nurses.map(nurse => {
    const rows = SLOTS.map(slot => {
      const cells = days.map(d => {
        const entry = cellMap[`${nurse}|${d}|${slot}`] || {};
        return `<td>
          <div class="sched-time-pair" data-nurse="${nurse}" data-date="${d}" data-slot="${slot}">
            <select class="sched-time-select start">${timeSelectOptions(entry.start_time, slot)}</select>
            <select class="sched-time-select end">${timeSelectOptions(entry.end_time, slot)}</select>
          </div>
        </td>`;
      }).join('');
      return `<tr><td class="l">${slot}<button class="sched-fill-btn" title="將週一的時間套用到本週其他天" onclick="applyRowToWeek('${nurse}','${slot}')">⤵</button></td>${cells}</tr>`;
    }).join('');

    return `<div class="card sched-nurse-card">
      <div class="card-head">
        <span class="card-title">${nurse}</span>
        <span class="card-spacer"></span>
        <span class="sched-total-badge" data-nurse-total="${nurse}">${calcWeeklyHours(nurse).toFixed(2)} 小時</span>
      </div>
      <table class="sched-mini">
        <thead><tr><th class="l"></th>${dayHeadCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  $('sched-grid').innerHTML = `<div class="sched-cards">${cards}</div>`;
}

$('sched-grid').addEventListener('change', (e) => {
  if (!e.target.classList.contains('sched-time-select')) return;
  const pair = e.target.closest('.sched-time-pair');
  const start = pair.querySelector('.start').value;
  const end = pair.querySelector('.end').value;
  saveShiftEntry(pair.dataset.nurse, pair.dataset.date, pair.dataset.slot, start, end);
});

async function saveShiftEntry(nurse, shiftDate, slot, start, end) {
  try {
    const res = await fetch('/api/admin/shifts', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nurse, shift_date: shiftDate, slot, start_time: start || null, end_time: end || null }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    shiftsCache = shiftsCache.filter(s => !(s.nurse === nurse && s.shift_date === shiftDate && s.slot === slot));
    if (start && end) shiftsCache.push({ nurse, shift_date: shiftDate, slot, start_time: start, end_time: end });
    const totalCell = document.querySelector(`[data-nurse-total="${nurse}"]`);
    if (totalCell) totalCell.textContent = `${calcWeeklyHours(nurse).toFixed(2)} 小時`;
  } catch (e) {
    alert('儲存排班失敗：' + e.message);
  }
}

function applyRowToWeek(nurse, slot) {
  const monday = weekStart;
  const sourcePair = document.querySelector(
    `.sched-time-pair[data-nurse="${nurse}"][data-slot="${slot}"][data-date="${monday}"]`
  );
  const start = sourcePair.querySelector('.start').value;
  const end = sourcePair.querySelector('.end').value;
  if (!start || !end) {
    alert('請先在週一設定好這一格的時間，再套用到本週其他天。');
    return;
  }
  if (!confirm(`將週一的時間（${start}–${end}）套用到本週剩下的天數，確定？`)) return;

  for (let i = 1; i < 7; i++) {
    const d = addDays(weekStart, i);
    const pair = document.querySelector(
      `.sched-time-pair[data-nurse="${nurse}"][data-slot="${slot}"][data-date="${d}"]`
    );
    pair.querySelector('.start').value = start;
    pair.querySelector('.end').value = end;
    saveShiftEntry(nurse, d, slot, start, end);
  }
}

async function copyLastWeek() {
  if (!confirm('此操作將覆蓋本週已輸入的時段，確定？')) return;
  try {
    const res = await fetch('/api/admin/shifts/copy-week', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from_week_start: addDays(weekStart, -7), to_week_start: weekStart }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    await loadSchedule();
  } catch (e) {
    alert('複製失敗：' + e.message);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
function load(section) {
  if (section === 'nurses')    loadNurses();
  else if (section === 'doctors')   loadDoctors();
  else if (section === 'labreport') loadLabReport();
  else if (section === 'bonus')     loadBonus();
  else if (section === 'linenotify') loadLineLog();
  else if (section === 'schedule')   loadSchedule();
}

function refresh() {
  document.querySelectorAll('.month-display').forEach(el => el.textContent = month);
  load(activeSection);
}

window.addEventListener('scroll', () => {
  document.getElementById('back-to-top').classList.toggle('visible', window.scrollY > 300);
});

refresh();
</script>
