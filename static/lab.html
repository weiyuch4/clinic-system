<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>檢驗追蹤 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=34">
<style>
/* ── tabs ────────────────────────────────────────────────────────── */
.lab-tabs{display:flex;gap:2px;background:var(--border);border-radius:9px;padding:3px;margin-bottom:14px;width:fit-content}
.lab-tab{font-size:13px;font-weight:600;padding:6px 18px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;background:transparent;color:var(--sub);transition:background .15s,color .15s}
.lab-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lab-panel{display:none}
.lab-panel.active{display:flex;flex-direction:column;gap:12px;flex:1}

/* ── group card ──────────────────────────────────────────────────── */
.lab-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.lab-ghead{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--border)}
.lab-gdate{font-size:14px;font-weight:700;color:var(--text)}
.lab-gcount{font-size:11px;background:var(--border);color:var(--muted);border-radius:10px;padding:2px 8px;font-weight:600}
.lab-goverdue{font-size:11px;background:#FEF3C7;color:#92400E;border-radius:10px;padding:2px 8px;font-weight:700}
.lab-gnotify{font-size:11px;background:#D1FAE5;color:#065F46;border-radius:10px;padding:2px 8px;font-weight:700}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .lab-goverdue{background:#2A1600;color:#FBD38D}
  :root:not([data-theme="light"]) .lab-gnotify{background:#042B18;color:#6EE7B7}
}
:root[data-theme="dark"] .lab-goverdue{background:#2A1600;color:#FBD38D}
:root[data-theme="dark"] .lab-gnotify{background:#042B18;color:#6EE7B7}

/* ── patient row ─────────────────────────────────────────────────── */
.lab-row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--border)}
.lab-row:last-child{border-bottom:none}
.lab-row.needs-notify{background:#EFF6FF;border-left:3px solid #3B82F6;padding-left:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lab-row.needs-notify{background:#0C1829;border-left-color:#60A5FA}}
:root[data-theme="dark"] .lab-row.needs-notify{background:#0C1829;border-left-color:#60A5FA}

/* ── patient info ────────────────────────────────────────────────── */
.lab-pt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab-name{font-size:14px;font-weight:600;color:var(--text)}
.lab-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab-meta .pr-copy{font-size:11.5px;color:var(--muted);cursor:pointer;border-radius:3px;padding:0 2px;transition:background .1s,color .1s}
.lab-meta .pr-copy:hover{background:var(--border);color:var(--text)}
.lab-meta-sep{font-size:11px;color:var(--border)}
.lab-codes{font-size:12px;color:var(--sub);flex:1;flex-wrap:wrap;display:flex;gap:5px;min-width:0}
.lab-code-chip{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--sub)}
.allergy-chip{background:#FFE4E6;color:#9F1239;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .allergy-chip{background:#2A0A0F;color:#FCA5A5}}
:root[data-theme="dark"] .allergy-chip{background:#2A0A0F;color:#FCA5A5}

/* ── right side: status + action ────────────────────────────────── */
.lab-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.lab-back{font-size:12px;color:#047857;font-weight:600;display:flex;align-items:center;gap:4px}
.lab-back svg{flex-shrink:0}
.lab-pending{font-size:12px;color:#B45309;font-weight:600;display:flex;align-items:center;gap:4px}
.lab-overdue{font-size:12px;color:#B45309;font-weight:700;display:flex;align-items:center;gap:4px}
.lab-notified{font-size:12px;color:#6B7280;font-weight:600;display:flex;align-items:center;gap:4px}
.lab-physical-tag{font-size:12px;color:#7C3AED;font-weight:600;display:flex;align-items:center;gap:4px}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .lab-back{color:#34D399}
  :root:not([data-theme="light"]) .lab-pending{color:#FBBF24}
  :root:not([data-theme="light"]) .lab-overdue{color:#FCA5A5}
  :root:not([data-theme="light"]) .lab-notified{color:#9CA3AF}
  :root:not([data-theme="light"]) .lab-physical-tag{color:#A78BFA}
}
:root[data-theme="dark"] .lab-back{color:#34D399}
:root[data-theme="dark"] .lab-pending{color:#FBBF24}
:root[data-theme="dark"] .lab-overdue{color:#FCA5A5}
:root[data-theme="dark"] .lab-notified{color:#9CA3AF}
:root[data-theme="dark"] .lab-physical-tag{color:#A78BFA}

/* ── action buttons ──────────────────────────────────────────────── */
.lab-btn{font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.lab-btn:disabled{opacity:.5;cursor:default}
.lab-btn-notify{background:#D1FAE5;color:#065F46}
.lab-btn-notify:hover:not(:disabled){background:#A7F3D0}
.lab-btn-physical{background:#EDE9FE;color:#6D28D9;font-size:11.5px;padding:4px 10px}
.lab-btn-physical:hover:not(:disabled){background:#DDD6FE}
.lab-btn-undo{background:var(--border);color:var(--muted);font-size:11px;padding:3px 9px}
.lab-btn-undo:hover:not(:disabled){background:var(--sub);color:var(--card)}
.lab-btn-done{background:#D1FAE5;color:#065F46}
.lab-btn-done:hover:not(:disabled){background:#A7F3D0}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .lab-btn-notify{background:#042B18;color:#6EE7B7}
  :root:not([data-theme="light"]) .lab-btn-notify:hover:not(:disabled){background:#064E2D;color:#6EE7B7}
  :root:not([data-theme="light"]) .lab-btn-physical{background:#2E1065;color:#C4B5FD}
  :root:not([data-theme="light"]) .lab-btn-physical:hover:not(:disabled){background:#3B0F80;color:#C4B5FD}
  :root:not([data-theme="light"]) .lab-btn-done{background:#042B18;color:#6EE7B7}
  :root:not([data-theme="light"]) .lab-btn-done:hover:not(:disabled){background:#064E2D;color:#6EE7B7}
}
:root[data-theme="dark"] .lab-btn-notify{background:#042B18;color:#6EE7B7}
:root[data-theme="dark"] .lab-btn-notify:hover:not(:disabled){background:#064E2D;color:#6EE7B7}
:root[data-theme="dark"] .lab-btn-physical{background:#2E1065;color:#C4B5FD}
:root[data-theme="dark"] .lab-btn-physical:hover:not(:disabled){background:#3B0F80;color:#C4B5FD}
:root[data-theme="dark"] .lab-btn-done{background:#042B18;color:#6EE7B7}
:root[data-theme="dark"] .lab-btn-done:hover:not(:disabled){background:#064E2D;color:#6EE7B7}

/* ── physical tab cards ──────────────────────────────────────────── */
.phys-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.phys-ghead{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--border)}
.phys-gdate{font-size:14px;font-weight:700;color:var(--text)}
.phys-waiting-badge{font-size:11px;background:#EDE9FE;color:#6D28D9;border-radius:10px;padding:2px 8px;font-weight:700}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .phys-waiting-badge{background:#2E1065;color:#C4B5FD}
}
:root[data-theme="dark"] .phys-waiting-badge{background:#2E1065;color:#C4B5FD}
.phys-row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--border)}
.phys-row:last-child{border-bottom:none}
.phys-days{font-size:12px;color:#6B7280;font-style:italic}

/* ── layout ──────────────────────────────────────────────────────── */
.scroll-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.lab-section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding:0 2px;margin-bottom:-4px}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>檢驗追蹤</h1><p id="page-date">外送抽血結果追蹤</p></div>
      </div>

      <!-- Tab switcher -->
      <div class="lab-tabs">
        <button class="lab-tab active" id="tab-digital" onclick="switchTab('digital')">數位追蹤</button>
        <button class="lab-tab" id="tab-physical" onclick="switchTab('physical')">實體報告 <span id="phys-badge" style="display:none"></span></button>
      </div>

      <!-- Digital tab -->
      <div class="lab-panel active" id="panel-digital">
        <div class="scroll-area" id="lab-list">
          <div style="text-align:center;padding:30px;color:var(--muted)">載入中…</div>
        </div>
      </div>

      <!-- Physical tab -->
      <div class="lab-panel" id="panel-physical">
        <div class="scroll-area" id="phys-list">
          <div style="text-align:center;padding:30px;color:var(--muted)">載入中…</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/static/_layout.js?v=34"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _days = [];
  var _physical = [];
  var _currentTab = 'digital';

  function switchTab(tab) {
    _currentTab = tab;
    document.getElementById('tab-digital').classList.toggle('active', tab === 'digital');
    document.getElementById('tab-physical').classList.toggle('active', tab === 'physical');
    document.getElementById('panel-digital').classList.toggle('active', tab === 'digital');
    document.getElementById('panel-physical').classList.toggle('active', tab === 'physical');
  }

  // Expose for onclick
  window.switchTab = switchTab;

  // ── helpers ───────────────────────────────────────────────────────

  function daysSince(isoDate) {
    var d = new Date(isoDate), now = new Date();
    return Math.floor((now - d) / 86400000);
  }

  function makeMeta(natId, birthDate) {
    var parts = [];
    if (natId) parts.push('<span class="pr-copy" data-copy="' + L.escHtml(natId) + '" title="點擊複製身份證">' + L.escHtml(natId) + '</span>');
    if (birthDate) {
      var bp = birthDate.split('-');
      var roc = bp.length === 3 ? ((parseInt(bp[0], 10) - 1911) + '/' + bp[1] + '/' + bp[2]) : birthDate;
      parts.push('<span class="pr-copy" data-copy="' + L.escHtml(birthDate) + '" title="點擊複製生日（ISO）">' + L.escHtml(roc) + '</span>');
    }
    return parts.length ? '<div class="lab-meta">' + parts.join('<span class="lab-meta-sep">·</span>') + '</div>' : '';
  }

  function bindCopyClicks(container) {
    container.querySelectorAll('.pr-copy').forEach(function (el) {
      el.addEventListener('click', function () {
        navigator.clipboard && navigator.clipboard.writeText(el.dataset.copy);
        L.showToast('已複製：' + el.dataset.copy);
      });
    });
  }

  // ── Digital tab render ────────────────────────────────────────────

  function renderDays(days) {
    var container = document.getElementById('lab-list');

    var needsNotify = 0;
    days.forEach(function (d) {
      (d.patients || []).forEach(function (p) {
        if (p.results_back && !p.notified) needsNotify++;
      });
    });

    document.getElementById('page-date').textContent =
      needsNotify > 0 ? '待通知：' + needsNotify + ' 人' : '外送抽血結果追蹤';

    if (!days.length || days.every(function (d) { return !(d.patients || []).length; })) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">近期無外送抽血記錄</div>';
      return;
    }

    container.innerHTML = days.map(function (day) {
      var pts = day.patients || [];
      if (!pts.length) return '';

      var needNotifyCount = pts.filter(function (p) { return p.results_back && !p.notified; }).length;
      var overdueCount    = pts.filter(function (p) { return p.overdue; }).length;

      return '<div class="lab-group">' +
        '<div class="lab-ghead">' +
          '<span class="lab-gdate">抽血日：' + L.escHtml(day.date) + '</span>' +
          '<span class="lab-gcount">' + pts.length + ' 人</span>' +
          (overdueCount ? '<span class="lab-goverdue">超時待出 ' + overdueCount + '</span>' : '') +
          (needNotifyCount ? '<span class="lab-gnotify">待通知 ' + needNotifyCount + '</span>' : '') +
        '</div>' +
        pts.map(function (p) {
          var codes = Array.isArray(p.draw_codes)
            ? p.draw_codes.map(String).filter(Boolean)
            : (p.draw_codes || '').split(',').map(function (c) { return c.trim(); }).filter(Boolean);
          var names = Array.isArray(p.draw_code_names) ? p.draw_code_names : [];
          var codeHtml = codes.map(function (c, i) {
            return '<span class="lab-code-chip" title="' + L.escHtml(c) + '">' + L.escHtml(names[i] || c) + '</span>';
          }).join('');

          var allergyHtml = p.is_allergy ? '<span class="allergy-chip">過敏</span>' : '';

          var statusHtml;
          if (p.notified) {
            statusHtml = '<div class="lab-notified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>已通知</div>';
          } else if (p.results_back) {
            statusHtml = '<div class="lab-back"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>已出報告</div>';
          } else if (p.overdue) {
            statusHtml = '<div class="lab-overdue"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>超時待出</div>';
          } else {
            statusHtml = '<div class="lab-pending"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>待出報告</div>';
          }

          var actionHtml = '';
          if (!p.notified) {
            // 其他檢驗所: only when results haven't arrived digitally yet
            if (!p.results_back) {
              actionHtml += '<button class="lab-btn lab-btn-physical" data-action="to-physical" data-nat="' + L.escHtml(p.nat_id) + '" data-date="' + L.escHtml(day.date) + '" data-name="' + L.escHtml(p.name) + '" title="移至實體報告追蹤">其他檢驗所</button>';
            }
            actionHtml += '<button class="lab-btn lab-btn-notify" data-action="notify" data-nat="' + L.escHtml(p.nat_id) + '" data-date="' + L.escHtml(day.date) + '">已通知病患</button>';
          } else {
            actionHtml += '<button class="lab-btn lab-btn-undo" data-action="undo-notify" data-nat="' + L.escHtml(p.nat_id) + '" data-date="' + L.escHtml(day.date) + '">撤銷</button>';
          }

          var rowClass = 'lab-row' + (p.results_back && !p.notified ? ' needs-notify' : '');
          return '<div class="' + rowClass + '">' +
            '<div class="lab-pt"><span class="lab-name">' + L.escHtml(p.name) + '</span>' + makeMeta(p.nat_id, p.birth_date) + '</div>' +
            allergyHtml +
            '<div class="lab-codes">' + codeHtml + '</div>' +
            '<div class="lab-right">' + statusHtml + actionHtml + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');

    bindCopyClicks(container);
  }

  // ── Physical tab render ───────────────────────────────────────────

  function renderPhysical(items) {
    var container = document.getElementById('phys-list');
    var badge = document.getElementById('phys-badge');

    if (items.length) {
      badge.textContent = items.length;
      badge.style.display = 'inline';
      badge.style.background = '#EDE9FE';
      badge.style.color = '#6D28D9';
      badge.style.borderRadius = '10px';
      badge.style.padding = '1px 7px';
      badge.style.fontSize = '11px';
      badge.style.fontWeight = '700';
      badge.style.marginLeft = '4px';
    } else {
      badge.style.display = 'none';
    }

    if (!items.length) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">目前無等待實體報告的患者</div>';
      return;
    }

    // Group by draw_date
    var byDate = {};
    var dateOrder = [];
    items.forEach(function (item) {
      if (!byDate[item.draw_date]) { byDate[item.draw_date] = []; dateOrder.push(item.draw_date); }
      byDate[item.draw_date].push(item);
    });
    dateOrder.sort(function (a, b) { return b.localeCompare(a); });

    container.innerHTML = dateOrder.map(function (drawDate) {
      var pts = byDate[drawDate];
      return '<div class="phys-group">' +
        '<div class="phys-ghead">' +
          '<span class="phys-gdate">抽血日：' + L.escHtml(drawDate) + '</span>' +
          '<span class="phys-waiting-badge">待收報告 ' + pts.length + ' 人</span>' +
        '</div>' +
        pts.map(function (item) {
          var daysWaiting = daysSince(item.draw_date);
          var daysLabel = daysWaiting === 0 ? '今天抽血' : '等待 ' + daysWaiting + ' 天';
          return '<div class="phys-row">' +
            '<div class="lab-pt"><span class="lab-name">' + L.escHtml(item.name || item.nat_id) + '</span>' +
              '<div class="lab-meta"><span class="pr-copy" data-copy="' + L.escHtml(item.nat_id) + '" title="點擊複製">' + L.escHtml(item.nat_id) + '</span></div>' +
            '</div>' +
            '<div class="lab-codes"><span class="phys-days">' + L.escHtml(daysLabel) + '</span></div>' +
            '<div class="lab-right">' +
              '<button class="lab-btn lab-btn-undo" data-action="phys-back" data-nat="' + L.escHtml(item.nat_id) + '" data-date="' + L.escHtml(item.draw_date) + '" title="移回數位追蹤">移回</button>' +
              '<button class="lab-btn lab-btn-done" data-action="phys-done" data-nat="' + L.escHtml(item.nat_id) + '" data-date="' + L.escHtml(item.draw_date) + '" data-name="' + L.escHtml(item.name || '') + '">已通知病患</button>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');

    bindCopyClicks(container);
  }

  // ── Delegated event handler on digital tab ────────────────────────

  document.getElementById('lab-list').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-action]'); if (!btn) return;
    var action = btn.dataset.action, nat = btn.dataset.nat, drawDate = btn.dataset.date, name = btn.dataset.name || '';
    btn.disabled = true;

    if (action === 'to-physical') {
      L.apiAction('POST', '/api/blood-physical', { nat_id: nat, draw_date: drawDate, name: name, nurse: L.getNurse() })
        .then(function () {
          // Optimistic: remove from digital list
          _days.forEach(function (d) {
            if (d.date !== drawDate) return;
            d.patients = (d.patients || []).filter(function (p) { return p.nat_id !== nat; });
          });
          _days = _days.filter(function (d) { return (d.patients || []).length; });
          renderDays(_days);
          // Add to physical list
          _physical.push({ nat_id: nat, draw_date: drawDate, name: name });
          renderPhysical(_physical);
          L.showToast('已移至實體報告追蹤');
        })
        .catch(function (e) {
          L.showToast('操作失敗：' + (e.message || ''), 'error');
          btn.disabled = false;
        });
      return;
    }

    var method = action === 'notify' ? 'POST' : 'DELETE';
    L.apiAction(method, '/api/blood-notified', { nat_id: nat, draw_date: drawDate, nurse: L.getNurse() })
      .then(function () {
        _days.forEach(function (d) {
          if (d.date !== drawDate) return;
          (d.patients || []).forEach(function (p) {
            if (p.nat_id === nat) p.notified = (action === 'notify');
          });
        });
        renderDays(_days);
        L.showToast(action === 'notify' ? '已標記通知' : '已撤銷通知');
      })
      .catch(function (e) {
        L.showToast('操作失敗：' + (e.message || ''), 'error');
        btn.disabled = false;
      });
  });

  // ── Delegated event handler on physical tab ───────────────────────

  document.getElementById('phys-list').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-action]'); if (!btn) return;
    var action = btn.dataset.action, nat = btn.dataset.nat, drawDate = btn.dataset.date, name = btn.dataset.name || '';
    btn.disabled = true;

    if (action === 'phys-back') {
      L.apiAction('DELETE', '/api/blood-physical', { nat_id: nat, draw_date: drawDate, nurse: L.getNurse() })
        .then(function () {
          _physical = _physical.filter(function (i) { return !(i.nat_id === nat && i.draw_date === drawDate); });
          renderPhysical(_physical);
          L.showToast('已移回數位追蹤');
          // Refresh digital list so the patient reappears
          load();
        })
        .catch(function (e) {
          L.showToast('操作失敗：' + (e.message || ''), 'error');
          btn.disabled = false;
        });
      return;
    }

    if (action === 'phys-done') {
      L.apiAction('POST', '/api/blood-physical/done', { nat_id: nat, draw_date: drawDate, name: name, nurse: L.getNurse() })
        .then(function () {
          _physical = _physical.filter(function (i) { return !(i.nat_id === nat && i.draw_date === drawDate); });
          renderPhysical(_physical);
          L.showToast('已標記完成，病患已通知');
        })
        .catch(function (e) {
          L.showToast('操作失敗：' + (e.message || ''), 'error');
          btn.disabled = false;
        });
      return;
    }
  });

  // ── Load ──────────────────────────────────────────────────────────

  function load() {
    L.hideError();
    Promise.all([
      L.apiFetch('/api/blood-pending'),
      L.apiFetch('/api/blood-physical'),
      L.getReport(),
    ]).then(function (results) {
      var days = results[0], physical = results[1], report = results[2];
      L.updateLastUpdated();
      _days = days;
      _physical = physical;

      var pending = 0;
      days.forEach(function (d) {
        (d.patients || []).forEach(function (p) { if (!p.results_back) pending++; });
      });
      L.updateBadges(report, pending);
      renderDays(days);
      renderPhysical(physical);
    }).catch(function (e) {
      L.showError('檢驗資料載入失敗 — ' + (e.message || e));
    });
  }

  Layout.init({ activePage: 'lab', onRefresh: load });
  load();
})();
</script>
</body>
</html>
