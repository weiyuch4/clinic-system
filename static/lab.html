<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>???? — ??????</title>
<link rel="stylesheet" href="/static/_layout.css?v=34">
<style>
.lab-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.lab-ghead{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--border)}
.lab-gdate{font-size:14px;font-weight:700;color:var(--text)}
.lab-gcount{font-size:11px;background:var(--border);color:var(--muted);border-radius:10px;padding:2px 8px;font-weight:600}
.lab-row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--border)}
.lab-row:last-child{border-bottom:none}
.lab-pt{display:flex;flex-direction:column;gap:2px}
.lab-name{font-size:14px;font-weight:600;color:var(--text)}
.lab-meta{display:flex;gap:6px;align-items:center}
.lab-meta .pr-copy{font-size:11.5px;color:var(--muted);cursor:pointer;border-radius:3px;padding:0 2px;transition:background .1s,color .1s}
.lab-meta .pr-copy:hover{background:var(--border);color:var(--text)}
.lab-meta-sep{font-size:11px;color:var(--border)}
.lab-codes{font-size:12px;color:var(--sub);flex:1;flex-wrap:wrap;display:flex;gap:5px}
.lab-code-chip{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--sub)}
.lab-status{margin-left:auto;flex-shrink:0}
.lab-back{font-size:12px;color:#047857;font-weight:600;display:flex;align-items:center;gap:4px}
.lab-back svg{flex-shrink:0}
.lab-pending{font-size:12px;color:#B45309;font-weight:600;display:flex;align-items:center;gap:4px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lab-back{color:#34D399}:root:not([data-theme="light"]) .lab-pending{color:#FBBF24}}
:root[data-theme="dark"] .lab-back{color:#34D399}
:root[data-theme="dark"] .lab-pending{color:#FBBF24}
.scroll-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.allergy-chip{background:#FFE4E6;color:#9F1239;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .allergy-chip{background:#2A0A0F;color:#FCA5A5}}
:root[data-theme="dark"] .allergy-chip{background:#2A0A0F;color:#FCA5A5}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>????</h1><p id="page-date">????????(?5?)</p></div>
      </div>

      <div class="scroll-area" id="lab-list">
        <div style="text-align:center;padding:30px;color:var(--muted)">???…</div>
      </div>

    </div>
  </div>
</div>


<script src="/static/_layout.js?v=34"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  function load() {
    L.hideError();
    Promise.all([
      L.apiFetch('/api/blood-pending'),
      L.getReport(),
    ]).then(function (results) {
      var days = results[0], report = results[1];
      L.updateLastUpdated();
      var container = document.getElementById('lab-list');
      if (!days.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">?????????</div>';
        document.getElementById('page-date').textContent = '?5??????';
        L.updateBadges(report, 0);
        return;
      }
      var pending = 0;
      days.forEach(function (d) {
        (d.patients || []).forEach(function (p) { if (!p.results_back) pending++; });
      });
      document.getElementById('page-date').textContent = '?????:' + pending + ' ?';
      L.updateBadges(report, pending);

      container.innerHTML = days.map(function (day) {
        var pts = (day.patients || []);
        if (!pts.length) return '';
        return '<div class="lab-group">' +
          '<div class="lab-ghead">' +
            '<span class="lab-gdate">???:' + L.escHtml(day.date) + '</span>' +
            '<span class="lab-gcount">' + pts.length + ' ?</span>' +
          '</div>' +
          pts.map(function (p) {
            var codes = Array.isArray(p.draw_codes) ? p.draw_codes.map(String).filter(Boolean) : (p.draw_codes || '').split(',').map(function (c) { return c.trim(); }).filter(Boolean);
            var names = Array.isArray(p.draw_code_names) ? p.draw_code_names : [];
            var codeHtml = codes.map(function (c, i) {
              var label = names[i] || c;
              return '<span class="lab-code-chip" title="' + L.escHtml(c) + '">' + L.escHtml(label) + '</span>';
            }).join('');
            var allergyHtml = p.is_allergy ? '<span class="allergy-chip">??</span>' : '';
            var statusHtml = p.results_back
              ? '<div class="lab-back"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>????</div>'
              : '<div class="lab-pending"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>????</div>';
            var metaParts = [];
            if (p.nat_id) metaParts.push('<span class="pr-copy" data-copy="' + L.escHtml(p.nat_id) + '" title="???????">' + L.escHtml(p.nat_id) + '</span>');
            if (p.birth_date) {
              var bParts = p.birth_date.split('-');
              var rocYear = bParts.length === 3 ? (parseInt(bParts[0], 10) - 1911) : '';
              var rocDisplay = rocYear ? (rocYear + '/' + bParts[1] + '/' + bParts[2]) : p.birth_date;
              metaParts.push('<span class="pr-copy" data-copy="' + L.escHtml(p.birth_date) + '" title="??????(ISO)">' + L.escHtml(rocDisplay) + '</span>');
            }
            var metaHtml = metaParts.length ? '<div class="lab-meta">' + metaParts.join('<span class="lab-meta-sep">·</span>') + '</div>' : '';
            return '<div class="lab-row">' +
              '<div class="lab-pt"><span class="lab-name">' + L.escHtml(p.name) + '</span>' + metaHtml + '</div>' +
              allergyHtml +
              '<div class="lab-codes">' + codeHtml + '</div>' +
              '<div class="lab-status">' + statusHtml + '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');
    }).catch(function (e) {
      L.showError('???????? — ' + (e.message || e));
    });
  }

  Layout.init({ activePage: 'lab', onRefresh: load });
  load();
})();
</script>
</body>
</html>
