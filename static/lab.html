<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>檢驗追蹤 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=28">
<style>
.lab-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.lab-ghead{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--border)}
.lab-gdate{font-size:14px;font-weight:700;color:var(--text)}
.lab-gcount{font-size:11px;background:var(--border);color:var(--muted);border-radius:10px;padding:2px 8px;font-weight:600}
.lab-row{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--border)}
.lab-row:last-child{border-bottom:none}
.lab-name{font-size:14px;font-weight:600;color:var(--text);min-width:60px}
.lab-codes{font-size:12px;color:var(--sub);flex:1;flex-wrap:wrap;display:flex;gap:5px}
.lab-code-chip{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--sub)}
.lab-status{margin-left:auto;flex-shrink:0}
.lab-back{font-size:12px;color:#047857;font-weight:600;display:flex;align-items:center;gap:4px}
.lab-back svg{flex-shrink:0}
.lab-pending{font-size:12px;color:#B45309;font-weight:600;display:flex;align-items:center;gap:4px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lab-back{color:#34D399}:root:not([data-theme="light"]) .lab-pending{color:#FBBF24}}
:root[data-theme="dark"] .lab-back{color:#34D399}
:root[data-theme="dark"] .lab-pending{color:#FBBF24}
.lab-dismiss{margin-left:8px;font-size:11px;color:var(--muted);border:1.5px solid var(--border);border-radius:100px;padding:3px 9px;cursor:pointer;background:transparent;flex-shrink:0}
.lab-dismiss:hover{color:var(--text);border-color:var(--sub)}
.scroll-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.allergy-chip{background:#FFE4E6;color:#9F1239;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .allergy-chip{background:#2A0A0F;color:#FCA5A5}}
:root[data-theme="dark"] .allergy-chip{background:#2A0A0F;color:#FCA5A5}
/* settings gear */
.lab-gear{display:flex;align-items:center;gap:6px;margin-left:auto;background:transparent;border:1.5px solid var(--border);border-radius:100px;padding:6px 12px;cursor:pointer;color:var(--sub);font-size:13px;font-weight:600}
.lab-gear:hover{color:var(--text);border-color:var(--sub)}
/* settings modal */
.lc-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.lc-row:last-child{border-bottom:none}
.lc-label{flex:1;font-size:13px;color:var(--text)}
.lc-sub{font-size:11px;color:var(--muted)}
.lc-custom{display:flex;gap:8px;margin-top:12px}
.lc-custom input{flex:1;border:1.5px solid var(--border);border-radius:var(--r);padding:6px 10px;background:var(--bg);color:var(--text);font-size:13px}
.lc-custom input:focus{outline:none;border-color:#b5d7f5}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>檢驗追蹤</h1><p id="page-date">外送抽血結果追蹤（近5日）</p></div>
        <button class="lab-gear" id="btn-lab-settings" style="display:none" onclick="openLabSettings()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          代碼設定
        </button>
      </div>

      <div class="scroll-area" id="lab-list">
        <div style="text-align:center;padding:30px;color:var(--muted)">載入中…</div>
      </div>

    </div>
  </div>
</div>

<!-- lab code settings modal (admin only) -->
<div class="modal-overlay" id="modal-lab-settings">
  <div class="modal-box" style="max-width:440px">
    <div class="modal-title">外送檢驗代碼設定</div>
    <div class="modal-sub">勾選要追蹤的 NHI 章別。凡屬選取章別的醫令代碼，都會被納入今日外送抽血清單。</div>
    <div id="lc-chapter-list" style="margin-top:12px;max-height:calc(100vh - 280px);overflow-y:auto"></div>
    <div class="lc-custom">
      <input type="text" id="lc-custom-input" placeholder="自訂章別前綴，例：70" maxlength="6">
      <button class="act-btn" onclick="addCustomPrefix()">新增</button>
    </div>
    <div class="modal-footer" style="margin-top:16px">
      <button class="act-btn" onclick="Layout.hideModal('modal-lab-settings')">取消</button>
      <button class="act-btn act-primary" id="btn-lab-settings-save" onclick="saveLabSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- dismiss modal -->
<div class="modal-overlay" id="modal-dismiss">
  <div class="modal-box">
    <div class="modal-title">移除追蹤記錄</div>
    <div class="modal-sub" id="modal-dismiss-sub">確認要從今日追蹤清單移除此筆記錄？</div>
    <div class="modal-field">
      <label class="modal-label">原因（選填）</label>
      <textarea class="modal-input" id="modal-dismiss-reason" rows="2" placeholder="例：改至大醫院抽血"></textarea>
    </div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-dismiss')">取消</button>
      <button class="act-btn act-danger" id="btn-dismiss-confirm">確認移除</button>
    </div>
  </div>
</div>

<script src="/static/_layout.js?v=28"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _dismissTarget = null;

  function load() {
    L.hideError();
    Promise.all([
      L.apiFetch('/api/blood-pending'),
      L.apiFetch('/api/report?report_date=' + L.localDateStr()),
    ]).then(function (results) {
      var days = results[0], report = results[1];
      L.updateLastUpdated();
      var container = document.getElementById('lab-list');
      if (!days.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">近期無外送抽血記錄</div>';
        document.getElementById('page-date').textContent = '近5日無外送抽血';
        L.updateBadges(report, 0);
        return;
      }
      var pending = 0;
      days.forEach(function (d) {
        (d.patients || []).forEach(function (p) { if (!p.results_back) pending++; });
      });
      document.getElementById('page-date').textContent = '待確認結果：' + pending + ' 件';
      L.updateBadges(report, pending);

      container.innerHTML = days.map(function (day) {
        var pts = (day.patients || []);
        if (!pts.length) return '';
        return '<div class="lab-group">' +
          '<div class="lab-ghead">' +
            '<span class="lab-gdate">抽血日：' + L.escHtml(day.date) + '</span>' +
            '<span class="lab-gcount">' + pts.length + ' 人</span>' +
          '</div>' +
          pts.map(function (p) {
            var codes = Array.isArray(p.draw_codes) ? p.draw_codes.map(String).filter(Boolean) : (p.draw_codes || '').split(',').map(function (c) { return c.trim(); }).filter(Boolean);
            var codeHtml = codes.map(function (c) {
              return '<span class="lab-code-chip">' + L.escHtml(c) + '</span>';
            }).join('');
            var allergyHtml = p.is_allergy ? '<span class="allergy-chip">過敏</span>' : '';
            var statusHtml = p.results_back
              ? '<div class="lab-back"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>已出報告</div>'
              : '<div class="lab-pending"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>待出報告</div>';
            return '<div class="lab-row">' +
              '<span class="lab-name">' + L.escHtml(p.name) + '</span>' +
              allergyHtml +
              '<div class="lab-codes">' + codeHtml + '</div>' +
              '<div class="lab-status">' + statusHtml + '</div>' +
              (p.results_back ? '' :
                '<button class="lab-dismiss" data-natid="' + L.escHtml(p.nat_id) + '" data-date="' + L.escHtml(day.date) + '" data-name="' + L.escHtml(p.name) + '">移除</button>') +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');
    }).catch(function (e) {
      L.showError('檢驗資料載入失敗 — ' + (e.message || e));
    });
  }

  document.getElementById('lab-list').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.lab-dismiss');
    if (!btn) return;
    _dismissTarget = { nat_id: btn.dataset.natid, draw_date: btn.dataset.date, name: btn.dataset.name };
    document.getElementById('modal-dismiss-sub').textContent =
      '移除 ' + _dismissTarget.name + '（' + _dismissTarget.draw_date + '）的追蹤記錄？';
    document.getElementById('modal-dismiss-reason').value = '';
    L.showModal('modal-dismiss');
  });

  document.getElementById('btn-dismiss-confirm').addEventListener('click', function () {
    if (!_dismissTarget) return;
    var reason = document.getElementById('modal-dismiss-reason').value.trim();
    L.hideModal('modal-dismiss');
    L.apiAction('POST', '/api/blood-dismiss', {
      nat_id: _dismissTarget.nat_id,
      draw_date: _dismissTarget.draw_date,
      name: _dismissTarget.name,
      reason: reason || '手動移除',
    }).then(function () { L.showToast('已移除追蹤記錄'); load(); })
      .catch(function (e) { L.showToast('移除失敗：' + (e.message || ''), 'error'); });
  });

  // ── Admin role detection ─────────────────────────────
  function getRole() {
    var t = localStorage.getItem('clinic_token');
    if (!t) return null;
    try {
      var b64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(atob(b64)).role;
    } catch (e) { return null; }
  }

  // ── Lab settings modal ───────────────────────────────
  var KNOWN_CHAPTERS = [
    { prefix: '08', label: '尿液／糞便檢查', sub: '08xxx' },
    { prefix: '09', label: '血液生化檢查',   sub: '09xxx' },
    { prefix: '12', label: '細菌／病毒培養', sub: '12xxx' },
    { prefix: '14', label: '病理切片',       sub: '14xxx' },
    { prefix: '25', label: '特殊功能檢查',   sub: '25xxx' },
    { prefix: '28', label: '其他外送檢查',   sub: '28xxx' },
    { prefix: '30', label: '過敏原測試',     sub: '30xxx' },
  ];
  var _activePrefixes = [];

  function renderChapterList() {
    var known = new Set(KNOWN_CHAPTERS.map(function (c) { return c.prefix; }));
    var custom = _activePrefixes.filter(function (p) { return !known.has(p); });
    var rows = KNOWN_CHAPTERS.map(function (c) {
      var checked = _activePrefixes.indexOf(c.prefix) !== -1 ? ' checked' : '';
      return '<div class="lc-row">' +
        '<input type="checkbox" id="lc-' + c.prefix + '" value="' + c.prefix + '"' + checked + ' style="accent-color:#b5d7f5;width:16px;height:16px;cursor:pointer">' +
        '<label for="lc-' + c.prefix + '" class="lc-label">' + L.escHtml(c.label) +
          ' <span class="lc-sub">(' + c.sub + ')</span></label>' +
        '</div>';
    });
    custom.forEach(function (p) {
      rows.push('<div class="lc-row">' +
        '<input type="checkbox" id="lc-c-' + L.escHtml(p) + '" value="' + L.escHtml(p) + '" checked style="accent-color:#b5d7f5;width:16px;height:16px;cursor:pointer">' +
        '<label for="lc-c-' + L.escHtml(p) + '" class="lc-label">自訂：' + L.escHtml(p) + '</label>' +
        '</div>');
    });
    document.getElementById('lc-chapter-list').innerHTML = rows.join('');
  }

  document.getElementById('lc-custom-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addCustomPrefix();
  });

  function openLabSettings() {
    L.apiFetch('/api/admin/settings/lab-codes').then(function (data) {
      _activePrefixes = data.prefixes || [];
      renderChapterList();
      L.showModal('modal-lab-settings');
    }).catch(function (e) {
      L.showToast('讀取設定失敗：' + (e.message || ''), 'error');
    });
  }

  function addCustomPrefix() {
    var val = document.getElementById('lc-custom-input').value.trim();
    if (!val) return;
    if (_activePrefixes.indexOf(val) !== -1) { L.showToast('該章別前綴已存在', 'error'); return; }
    _activePrefixes.push(val);
    document.getElementById('lc-custom-input').value = '';
    renderChapterList();
  }

  function saveLabSettings() {
    var checkboxes = document.querySelectorAll('#lc-chapter-list input[type=checkbox]');
    var selected = [];
    checkboxes.forEach(function (cb) { if (cb.checked) selected.push(cb.value); });
    if (!selected.length) { L.showToast('至少需選擇一個章別', 'error'); return; }
    var btn = document.getElementById('btn-lab-settings-save');
    btn.disabled = true;
    L.apiAction('PUT', '/api/admin/settings/lab-codes', { prefixes: selected })
      .then(function () {
        L.hideModal('modal-lab-settings');
        L.showToast('代碼設定已儲存');
        load();
      })
      .catch(function (e) { L.showToast('儲存失敗：' + (e.message || ''), 'error'); })
      .finally(function () { btn.disabled = false; });
  }

  Layout.init({ activePage: 'lab', onRefresh: load });
  if (getRole() === 'admin') {
    document.getElementById('btn-lab-settings').style.display = 'flex';
  }
  load();
})();
</script>
</body>
</html>
