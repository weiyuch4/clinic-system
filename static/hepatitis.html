<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B/C型肝炎 — 診所追蹤系統</title>
<link rel="stylesheet" href="/static/_layout.css?v=25">
<style>
.search-row{display:flex;align-items:center;gap:10px;flex-shrink:0}
.si{flex:1;border:1.5px solid var(--border);border-radius:9px;padding:8px 13px;font-size:13.5px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.si:focus{border-color:#b5d7f5}
.sr-count{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
.list-area{flex:1;overflow-y:auto}
.vpn-banner{background:#EDE9FE;border:1px solid #DDD6FE;border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:11px;flex-shrink:0}
.vpn-banner-icon{width:32px;height:32px;border-radius:8px;background:#6D28D9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vpn-banner-title{font-size:13.5px;font-weight:700;color:#4C1D95}
.vpn-banner-sub{font-size:12px;color:#6D28D9;margin-top:2px}
.vpn-count{margin-left:auto;font-size:22px;font-weight:700;color:#6D28D9;font-variant-numeric:tabular-nums;flex-shrink:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .vpn-banner{background:#1A0B35;border-color:#4C1D95;color:#C4B5FD}}
:root[data-theme="dark"] .vpn-banner{background:#1A0B35;border-color:#4C1D95;color:#C4B5FD}
.modal-error{display:none;color:#991b1b;font-size:12.5px;margin-top:8px;background:#fef2f2;border-radius:6px;padding:7px 10px}
.modal-error.show{display:block}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <div id="topbar"></div>
    <div class="ct">

      <div class="err-bar" id="error-bar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <div class="ph">
        <div><h1>B/C型肝炎追蹤</h1><p id="page-date">定期追蹤 — 逾期待聯繫</p></div>
      </div>

      <div class="vpn-banner" id="vpn-banner" style="display:none">
        <div class="vpn-banner-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="vpn-banner-title">B肝待輸入VPN</div>
          <div class="vpn-banner-sub">近期回診病患尚未在健保署VPN系統登錄</div>
        </div>
        <div class="vpn-count" id="vpn-count">0</div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-tab on" data-tab="pending">待聯絡 <span class="tc-count" id="cnt-pending">…</span></button>
        <button class="filter-tab" data-tab="returned">待登VPN <span class="tc-count" id="cnt-returned">…</span></button>
        <button class="filter-tab" data-tab="contacted">已聯繫 <span class="tc-count" id="cnt-contacted">…</span></button>
        <button class="filter-tab" data-tab="hold">暫緩中 <span class="tc-count" id="cnt-hold">…</span></button>
      </div>

      <div class="search-row">
        <input class="si" type="text" id="search-input" placeholder="搜尋姓名或病歷號…">
        <span class="sr-count" id="result-count"></span>
      </div>

      <div class="list-area" id="list-scroll">
        <div id="list-pending"><div class="sec-empty">載入中…</div></div>
        <div id="list-returned" style="display:none"></div>
        <div id="list-contacted" style="display:none"></div>
        <div id="list-hold" style="display:none"></div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-contact">
  <div class="modal-box">
    <div class="modal-title" id="modal-contact-title">聯絡病患</div>
    <div class="modal-sub" id="modal-contact-sub"></div>
    <div class="modal-field">
      <label class="modal-label">聯絡方式</label>
      <select class="modal-select" id="modal-contact-type">
        <option value="contacted">已聯繫（直接通知）</option>
        <option value="called">已二次確認（電話通話）</option>
      </select>
    </div>
    <div class="modal-field">
      <label class="modal-label">備註（選填）</label>
      <textarea class="modal-input" id="modal-contact-note" rows="2" placeholder="例：預約下週回診抽血"></textarea>
    </div>
    <div class="modal-error" id="contact-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-contact')">取消</button>
      <button class="act-btn act-primary" id="btn-contact-confirm">確認送出</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-vpn">
  <div class="modal-box">
    <div class="modal-title" id="modal-vpn-title">確認VPN登錄</div>
    <div class="modal-sub" id="modal-vpn-sub">確認已在健保署VPN系統完成登錄？</div>
    <div class="modal-error" id="vpn-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-vpn')">取消</button>
      <button class="act-btn act-purple" id="btn-vpn-confirm">確認已登錄</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-hold">
  <div class="modal-box">
    <div class="modal-title">設定暫緩</div>
    <div class="modal-sub" id="modal-hold-sub"></div>
    <div class="modal-field">
      <label class="modal-label">備註</label>
      <textarea class="modal-input" id="modal-hold-note" rows="2" placeholder="例：出國旅遊，三個月後聯絡"></textarea>
    </div>
    <div class="modal-error" id="hold-error"></div>
    <div class="modal-footer">
      <button class="act-btn" onclick="Layout.hideModal('modal-hold')">取消</button>
      <button class="act-btn act-warn" id="btn-hold-confirm">設定暫緩</button>
    </div>
  </div>
</div>

<script src="/static/_layout.js?v=25"></script>
<script>
(function () {
  'use strict';
  var L = Layout;
  var _tab = 'pending', _query = '';
  var _pending = [], _returned = [], _contacted = [], _hold = [];
  var _pendingMap = {}, _returnedMap = {}, _contactedMap = {}, _holdMap = {};
  var _actionChart = null, _actionEntry = null;

  function load() {
    L.hideError();
    var today = L.localDateStr();
    L.apiFetch('/api/report?report_date=' + today).then(function (r) {
      _pending   = r.hep_followups  || [];
      _returned  = r.hep_returned   || [];
      _contacted = (r.contacted || []).filter(function (e) { return e.category === 'B肝' || e.category === 'C肝'; })
                    .concat((r.called || []).filter(function (e) { return e.category === 'B肝' || e.category === 'C肝'; }));
      _hold      = (r.on_hold   || []).filter(function (e) { return e.category === 'B肝' || e.category === 'C肝'; });
      _pendingMap   = {}; _pending.forEach(function (e) { _pendingMap[e.patient.chart_number]   = e; });
      _returnedMap  = {}; _returned.forEach(function (e) { _returnedMap[e.patient.chart_number]  = e; });
      _contactedMap = {}; _contacted.forEach(function (e) { _contactedMap[e.patient.chart_number] = e; });
      _holdMap      = {}; _hold.forEach(function (e) { if (e.patient) _holdMap[e.patient.chart_number] = e; });
      document.getElementById('page-date').textContent = today + '  ·  共 ' + _pending.length + ' 人待聯絡';
      document.getElementById('cnt-pending').textContent   = _pending.length;
      document.getElementById('cnt-returned').textContent  = _returned.length;
      document.getElementById('cnt-contacted').textContent = _contacted.length;
      document.getElementById('cnt-hold').textContent      = _hold.length;
      var banner = document.getElementById('vpn-banner');
      if (_returned.length) { banner.style.display = 'flex'; document.getElementById('vpn-count').textContent = _returned.length; }
      else { banner.style.display = 'none'; }
      renderAll();
      L.updateBadges(r, null);
      L.updateLastUpdated();
    }).catch(function (e) { L.showError('資料載入失敗 — ' + (e.message || '')); });
  }

  function match(entry) {
    if (!_query) return true;
    var q = _query.toLowerCase(), p = entry.patient || {};
    return (p.name && p.name.toLowerCase().includes(q)) ||
           (p.chart_number && String(p.chart_number).toLowerCase().includes(q));
  }

  function pendingRow(e) {
    return L.patientRow({ entry: e, actions: [
      { label: '已聯繫', cls: 'act-primary', key: 'contact' },
      { label: '暫緩',   cls: 'act-warn',    key: 'hold' },
    ]});
  }
  function returnedRow(e) {
    return L.patientRow({ entry: e,
      tags: ['<span class="pbadge b-sub">待登VPN</span>'],
      actions: [{ label: '已登錄VPN', cls: 'act-purple', key: 'vpn-done' }],
    });
  }
  function contactedRow(e) {
    return L.patientRow({ entry: e,
      tags: ['<span class="pbadge b-done">已聯繫</span>'],
      actions: [{ label: '撤銷', cls: '', key: 'undo-contact' }],
    });
  }
  function holdRow(e) {
    var note = e.note || '暫緩';
    var adapted = {
      patient: e.patient || { chart_number: 'hold-' + e.hold_id, name: e.manual_name || '?', birth_date: '' },
      category: e.category || 'B肝', mspt_stage: null,
      due_date: e.due_date || null, last_visit_date: e.last_visit_date || null, days_overdue: e.days_overdue || 0,
    };
    return L.patientRow({ entry: adapted,
      tags: ['<span class="pbadge b-hold">' + L.escHtml(note.length > 14 ? note.slice(0,14)+'…' : note) + '</span>'],
      actions: [{ label: '解除暫緩', cls: '', key: 'undo-hold' }],
    });
  }

  function renderList(entries, renderFn, id) {
    var filtered = entries.filter(match);
    var el = document.getElementById(id);
    if (!filtered.length) {
      el.innerHTML = '<div class="sec-empty">' + (entries.length ? '沒有符合搜尋條件的病患' : '目前沒有記錄') + '</div>';
    } else {
      el.innerHTML = L.patientTable(filtered.map(renderFn).join(''));
    }
    if (_tab === id.replace('list-', ''))
      document.getElementById('result-count').textContent = '共 ' + filtered.length + ' 筆';
  }
  function renderAll() {
    renderList(_pending,   pendingRow,   'list-pending');
    renderList(_returned,  returnedRow,  'list-returned');
    renderList(_contacted, contactedRow, 'list-contacted');
    renderList(_hold,      holdRow,      'list-hold');
  }

  document.getElementById('filter-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-tab'); if (!btn) return;
    _tab = btn.dataset.tab;
    document.querySelectorAll('.filter-tab').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    ['pending','returned','contacted','hold'].forEach(function (t) {
      document.getElementById('list-' + t).style.display = t === _tab ? '' : 'none';
    });
    var arr = {pending:_pending,returned:_returned,contacted:_contacted,hold:_hold}[_tab] || [];
    document.getElementById('result-count').textContent = '共 ' + arr.filter(match).length + ' 筆';
  });

  document.getElementById('search-input').addEventListener('input', function (e) { _query = e.target.value.trim(); renderAll(); });

  document.getElementById('list-scroll').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-action]'); if (!btn) return;
    var action = btn.dataset.action, row = btn.closest('.pr'); if (!row) return;
    _actionChart = row.dataset.chart;
    if (action === 'contact') {
      var entry = _pendingMap[_actionChart]; if (!entry) return;
      document.getElementById('modal-contact-title').textContent = '聯絡 ' + entry.patient.name;
      document.getElementById('modal-contact-sub').textContent = '病歷號 #' + entry.patient.chart_number + ' · 逾期 ' + (entry.days_overdue||0) + ' 天';
      document.getElementById('modal-contact-note').value = '';
      document.getElementById('contact-error').classList.remove('show');
      L.showModal('modal-contact');
    } else if (action === 'hold') {
      var entry2 = _pendingMap[_actionChart]; if (!entry2) return;
      document.getElementById('modal-hold-sub').textContent = entry2.patient.name + ' #' + entry2.patient.chart_number;
      document.getElementById('modal-hold-note').value = '';
      document.getElementById('hold-error').classList.remove('show');
      L.showModal('modal-hold');
    } else if (action === 'vpn-done') {
      _actionEntry = _returnedMap[_actionChart]; if (!_actionEntry) return;
      document.getElementById('modal-vpn-title').textContent = _actionEntry.patient.name + ' 已登錄VPN';
      document.getElementById('modal-vpn-sub').textContent = '確認已在健保署VPN系統完成登錄？此操作不可撤銷。';
      document.getElementById('vpn-error').classList.remove('show');
      L.showModal('modal-vpn');
    } else if (action === 'undo-contact') {
      var ce = _contactedMap[_actionChart]; if (!ce) return;
      btn.disabled = true;
      L.apiAction('DELETE', '/api/contacted', { chart_number: ce.patient.chart_number, category: ce.category, due_date: ce.due_date })
        .then(function () { L.showToast('已撤銷聯絡記錄'); load(); })
        .catch(function (e) { L.showToast('撤銷失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });
    } else if (action === 'undo-hold') {
      var he = _holdMap[_actionChart]; if (!he) return;
      btn.disabled = true;
      L.apiAction('DELETE', '/api/on-hold', { hold_id: he.hold_id })
        .then(function () { L.showToast('已解除暫緩'); load(); })
        .catch(function (e) { L.showToast('解除失敗：' + (e.message||''), 'error'); })
        .finally(function () { btn.disabled = false; });
    }
  });

  document.getElementById('btn-contact-confirm').addEventListener('click', function () {
    var entry = _pendingMap[_actionChart]; if (!entry) return;
    var url = document.getElementById('modal-contact-type').value === 'called' ? '/api/called' : '/api/contacted';
    var confirmBtn = this;
    var errEl = document.getElementById('contact-error');
    errEl.classList.remove('show');
    confirmBtn.disabled = true;
    L.apiAction('POST', url, { entry: entry, nurse: L.getNurse() })
      .then(function () { L.hideModal('modal-contact'); L.showToast('聯絡記錄已儲存'); load(); })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  document.getElementById('btn-vpn-confirm').addEventListener('click', function () {
    if (!_actionEntry) return;
    var confirmBtn = this;
    var errEl = document.getElementById('vpn-error');
    errEl.classList.remove('show');
    confirmBtn.disabled = true;
    L.apiAction('POST', '/api/hep-returned-completed', { entry: _actionEntry, nurse: L.getNurse() })
      .then(function () { L.hideModal('modal-vpn'); L.showToast('VPN登錄記錄已儲存'); load(); })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  document.getElementById('btn-hold-confirm').addEventListener('click', function () {
    var entry = _pendingMap[_actionChart]; if (!entry) return;
    var note = document.getElementById('modal-hold-note').value.trim() || '暫緩';
    var confirmBtn = this;
    var errEl = document.getElementById('hold-error');
    errEl.classList.remove('show');
    confirmBtn.disabled = true;
    L.apiAction('POST', '/api/on-hold', { entry: entry, note: note, nurse: L.getNurse() })
      .then(function () { L.hideModal('modal-hold'); L.showToast('已設定暫緩'); load(); })
      .catch(function (e) { errEl.textContent = e.message || '操作失敗，請再試一次'; errEl.classList.add('show'); })
      .finally(function () { confirmBtn.disabled = false; });
  });

  Layout.init({ activePage: 'hepatitis', onRefresh: load });
  load();
})();
</script>
</body>
</html>
